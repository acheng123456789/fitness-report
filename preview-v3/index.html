<script>
const D={};
/* 页面版本号 —— build_preview_data.py 每次重建会自动改写成新值，别手改。
   主屏 PWA（iOS 独立模式）会把 index.html 整份缓存死，改了页面他刷不到；
   data.json 是 cache-bust 拉的新版，拿它的 v 跟这里比，不一致 = 页面旧了 → 换 URL 重载。 */
const APPV="bc81d6cd186";
const WD=['周一','周二','周三','周四','周五','周六','周日'];
const TY={'跑步':['🏃','run'],'步行':['🚶','walk'],'徒步':['🥾','walk'],'骑行':['🚴','ride'],
  '力量训练':['💪','lift'],'核心训练':['🧘','lift'],'乒乓球':['🏓','lift'],'爬楼梯':['🪜','walk'],
  '健身游戏':['🎮','lift'],'椭圆机':['⚙️','lift'],'游泳':['🏊','run']};
/* 类型名带前缀（户外骑行 / 室内跑步）在 TY 里查不到，之前会退化成 '·'，
   首页 chip 就显示成「· 户外骑行」这种半截符号。这里先剥前缀再查，查不到就不给图标。 */
function tyIcon(t){
  const s=String(t||''), k=s.replace(/^(户外|室内)/,'');
  const m=TY[k]||TY[s];
  return m?m[0]:'';
}

/* 哪些类型的"配速（分钟/公里）"有意义 ——
   游泳按每公里算会显示成 102'45" 这种怪数字，干脆不显示。 */
const PACE_TYPES=['跑步','骑行','步行','徒步','爬楼梯'];
function hasPace(w){return !!w&&PACE_TYPES.indexOf(w.类型)>=0&&(w.距离||0)>0&&w.配速显示&&w.配速显示!=='—'}

/* 当前月 / 当前月的文字标签 —— 一切跟“今天”有关的东西都从这里取，
   ⚠️ 以前这里写死过 '2026-10'，换个月份页面就全错。 */
function nowYM(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function nowMonthLabel(){const d=new Date();return d.getFullYear()+' · '+String(d.getMonth()+1).padStart(2,'0')}

/* 主题：默认**跟随手机系统的深/浅色**（阿成 2026-10-03 要求）。
   手动点过「浅色/深色」就固定成手动，点「自动」回到跟随系统。
   偏好存在 'thm'（auto/d/l）；旧的 'th' 不再读 —— 否则他以前点过一次浅色，
   就永远不跟随系统了。 */
const MQ=matchMedia('(prefers-color-scheme: dark)');
let THMODE=localStorage.getItem('thm')||'auto';
const wantDark=()=>THMODE==='auto'?MQ.matches:THMODE==='d';
let ST={theme:wantDark(), ym:nowYM(), pick:{}, focus:null, hmode:'chart'};

/* 当月汇总：当月没数据就退回数据里最新的那个月（别让页面读到 undefined） */
function curOv(){
  const ks=Object.keys(D.overview||{}).sort();
  return (D.overview||{})[nowYM()]||(ks.length?D.overview[ks[ks.length-1]]:null)
      ||{次数:0,天数:0,总时长:0,总距离:0,总消耗:0,workouts:[],types:[]};
}

function fmtDay(s){const p=s.split('-');return +p[2]}
function hm(m){m=Math.round(m);return Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')+'m'}
function mins(m){return Math.round(m)+'分'}
/* 时长显示：不满 1 小时用「X 分」，满 1 小时用「X 小时 Y 分」（整分省略）。
   阿成 2026-10-05 定的口径：超过一小时就说小时，别拿 683 分这种数字糊弄人。 */
function fmtDur(t){t=Math.round(t);
  if(t<60) return t+' 分';
  const h=Math.floor(t/60),m=t%60;
  return h+' 小时'+(m?' '+m+' 分':'')}
function fmtNum(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function esc(s){return String(s==null?'':s)}

/* 封面那行"日期范围"：一律从数据现算。写死过 "2026 · 08 – 10"，其实跑步数据从 2025-05 就开始了。 */
function spanLabel(dates){
  const ys=[...new Set(dates.map(d=>String(d).slice(0,7)))].sort();
  if(!ys.length) return '暂无数据';
  const a=ys[0], b=ys[ys.length-1];
  if(a===b) return a.slice(0,4)+' · '+a.slice(5);
  return a.slice(0,4)===b.slice(0,4)
    ? a.slice(0,4)+' · '+a.slice(5)+' – '+b.slice(5)
    : a.slice(0,4)+' · '+a.slice(5)+' – '+b.slice(0,4)+' · '+b.slice(5);
}

/* 标签词：换成普通人一眼懂的说法（红旗 → 警示） */
const TAGS={'红旗':'警示','外伤':'撞伤','复发':'又来了','性质':'性质','存疑':'存疑','顺序':'顺序',
  '间隔':'间隔','补水':'补水','作息':'作息','器械':'器械','跑步':'跑步'};
function tagText(t){return TAGS[t]||t}

function head(title,en){
  return `<div class="cover">
    <div class="topbar"><span class="brand" onclick="goHome()" title="回到首页">Health Report</span>
      <div class="sw" role="group" aria-label="深浅色">
        <button type="button" data-m="auto" aria-pressed="false" onclick="setTh('auto')" title="跟随手机系统">自动</button>
        <button type="button" data-m="l" aria-pressed="false" onclick="setTh('l')" title="一直浅色">浅色</button>
        <button type="button" data-m="d" aria-pressed="false" onclick="setTh('d')" title="一直深色">深色</button>
      </div></div>
    <div class="month">${title.month}</div><div class="title">${title.t}</div><div class="en">${en}</div>
    <div class="sub">${title.s}</div>
    ${title.badge?`<div class="srcpill">${title.badge}</div>`:''}
    ${title.week||''}
    <div class="rline"></div>${title.strip||''}</div>`;
}

/* 本周节奏条：周一~周日，格子上有数字＝那天练了多少分钟 */
function weekStrip(){
  const now=new Date(), dow=(now.getDay()+6)%7;         // 0=周一
  const mon=new Date(now); mon.setDate(now.getDate()-dow);
  const byday={}; D.recent.forEach(r=>{byday[r.date]=(byday[r.date]||0)+r.时长});
  let cells='';
  for(let i=0;i<7;i++){
    const d=new Date(mon); d.setDate(mon.getDate()+i);
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const m=byday[ds]||0;
    const cls='wd2'+(m?' on':'')+(i===dow?' today':'');
    cells+=`<div><div class="wl">${WD[i][1]}</div>
      <div class="${cls}" ${m?`onclick="detailDay('${ds}')"`:''} style="${m?'cursor:pointer':''}">${m?Math.round(m)+'′':''}</div></div>`;
  }
  const wkMin=Object.keys(byday).filter(k=>{const d=new Date(k);
    return d>=mon&&d<=new Date(mon.getTime()+6*864e5)}).reduce((a,k)=>a+byday[k],0);
  return `<div class="wkt"><span>本周节奏</span><em>${wkMin?('已练 '+Math.round(wkMin)+' 分钟'):'本周还没动'}</em></div>
    <div class="wk">${cells}</div>`;
}

/* ── 首页看板用的数据计算（全部现算，不写死） ── */

/* 近 n 个月（含当月）的训练时长序列；用 overview 的键排序，取最后 n 个 */
function monthsBack(n){
  return Object.keys(D.overview).sort().slice(-n);
}
/* 单月时长（分钟）→ 小时，一位小数 */
function hrsOf(min){return Math.round(min/6)/10}

/* 类型配色 —— 必须两两可区分（原来骑行和跑步都用 var(--run) 蓝，图例里分不出来）。
   有氧系用蓝系渐变、力量系用紫系、其余用绿/橙/金，逐个分色。 */
function mixColor(n){const p=pal();return p[n]||'#8A8578'}
/* 同色系里按占比排序，深浅拉开（骑行占多时更蓝、占少时更浅） */
function mixPalette(){
  const ms=stackMonths(MONTHS_N);
  const tot={}; ms.forEach(m=>m.types.forEach(t=>tot[t.名称]=(tot[t.名称]||0)+t.时长));
  const grp={}, p={};
  Object.keys(tot).forEach(n=>{
    const base=navigator_hue(n);
    (grp[base]=grp[base]||[]).push([n,tot[n]]);
  });
  Object.keys(grp).forEach(b=>{
    const arr=grp[b].sort((a,c)=>c[1]-a[1]);
    const n=arr.length;
    arr.forEach((x,i)=>{
      const t=n===1?1:i/(n-1);
      p[x[0]]=shade(baseOf(b),t);
    });
  });
  return p;
}
const BASE={blue:[34,99,196],purple:[107,51,214],green:[15,122,82],orange:[180,98,44],gold:[144,112,47]};
function navigator_hue(n){
  if(/跑|骑|游|椭圆/.test(n)) return 'blue';
  if(/力量|核心|健身/.test(n)) return 'purple';
  if(/徒|步|爬/.test(n)) return 'green';
  if(/乒乓/.test(n)) return 'orange';
  return 'gold';
}
function baseOf(b){return BASE[b]||BASE.gold}
function shade(rgb,t){
  /* t=0 → 最深（该项占比最大），t=1 → 最浅 */
  const k=1-t*0.52;
  return `rgb(${Math.round(rgb[0]*k)},${Math.round(rgb[1]*k)},${Math.round(rgb[2]*k)})`;
}
let __PAL=null;
function pal(){ return __PAL || (__PAL=mixPalette()) }

/* 配速条形宽度：越快越宽，在这批里自己归一；最慢保底 30% 以免压成一个点 */
function paceBar(p,bestSec,worstSec){
  const s=secOf(p), rg=(worstSec-bestSec)||1;
  return Math.max(30,Math.round(100-(s-bestSec)/rg*70));
}

/* overview 里没有按天的分布，从 D.recent 现算某月的 {日期: 分钟} */
function bydayOf(ym){
  const m={}; D.recent.forEach(r=>{if(r.date.slice(0,7)===ym)m[r.date]=(m[r.date]||0)+r.时长}); return m;
}

/* 环比：按「当月已过天数 vs 上月同样天数」比，避免月中对比整月的误导 */
function momCompare(){
  const keys=Object.keys(D.overview).sort();
  const cur=keys[keys.length-1], prev=keys[keys.length-2];
  if(!prev) return null;
  const now=new Date(), dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const passed=now.getDate();
  const pd=Object.keys(bydayOf(prev)).sort().slice(0,passed);
  const pMin=pd.reduce((a,k)=>a+bydayOf(prev)[k],0);
  if(!pMin) return null;
  const pct=Math.round((D.overview[cur].总时长/pMin-1)*100);
  return {pct, cur:D.overview[cur].总时长, prev:pMin, passed, 上月整月:D.overview[prev].总时长};
}

/* 体重进度：起点取「今年最早的记录」。
   ⚠️ 别用 2025 年的 149.2 斤当起点 —— 那是去年的低谷，拿来当"起点"会把进度算得离谱地高。
   今年 3 月最高 169.2 斤 → 现在 162.8，这个口径才反映今年的实际减重。 */
function weightProg(){
  const b=D.body.slice().sort((x,y)=>x.date<y.date?-1:1);
  if(b.length<2) return null;
  const cur=b[b.length-1];
  const y=cur.date.slice(0,4);
  const thisYear=b.filter(r=>r.date.slice(0,4)===y);
  const st=(thisYear.length>=2?thisYear[0]:b[0]);
  const 起点=st.weight_jin;
  const 已减=Math.max(0,起点-cur.weight_jin);
  const 还需=Math.max(0,cur.weight_jin-D.profile['目标斤']);
  const 总需=Math.max(1,起点-D.profile['目标斤']);
  return {cur:cur.weight_jin, goal:D.profile['目标斤'], 起点, 起点日期:st.date, 已减, 还需,
    pct:Math.max(0,Math.min(100,Math.round(已减/总需*100))),
    bf:cur.bf_pct, visceral:cur.visceral, date:cur.date};
}

/* 跑步能力：最近 5 次配速 + 均心率，取最快/最慢与趋势 */
function runAbility(){
  const rs=D.recent.filter(r=>r.类型==='跑步'&&hasPace(r)).slice(0,5);
  if(!rs.length) return null;
  const sp=rs.map(r=>secOf(r.配速显示));
  const hr=rs.map(r=>r.平均心率).filter(Boolean);
  const 最新=rs[0], 最快=rs[sp.indexOf(Math.min(...sp))];
  const 同比=rs.length>=2?Math.round((sp[sp.length-1]/sp[0]-1)*100):null;
  return {n:rs.length, 最新, 最快, avgHr:hr.length?Math.round(hr.reduce((a,b)=>a+b,0)/hr.length):null,
    bestSec:Math.min(...sp), worstSec:Math.max(...sp),
    趋势pct:同比, list:rs, 里程:+rs.reduce((a,b)=>a+(b.距离||0),0).toFixed(1)};
}

/* 身体信号：从手记里现扫「肩」等关键词，扫到就在首页提示（不写死结论）
   2026-10-20：看**最新一条**提到该关键词的手记，若那条说的是「已恢复/缓解/没有影响」，就不再提示 */
function bodySignals(){
  const out=[];
  const kw=[['肩','肩部不适'],['膝','膝部不适'],['脚','足部不适'],['痛','疼痛记录']];
  const blobOf=j=>(j.感受||'')+JSON.stringify(j.要点||[])+JSON.stringify(j.建议||[]);
  const js=D.journal.slice().sort((a,b)=>a.date<b.date?1:-1);      // 新 → 旧
  kw.forEach(([k,label])=>{
    const hit=js.find(j=>blobOf(j).indexOf(k)>=0);
    if(!hit) return;
    if(/已恢复|缓解|不疼了|没有影响|没影响|早就好/.test(blobOf(hit))) return;
    out.push({label, date:hit.date, k, 疲劳:hit.疲劳});
  });
  return out.sort((a,b)=>a.date<b.date?1:-1).slice(0,2);
}

/* 近 n 个月时长柱状（SVG 高度现算，标出当月） */
function trendBars(){
  const keys=monthsBack(6), mx=Math.max(...keys.map(k=>D.overview[k].总时长),1);
  const W=320,H=96,pad=4, gap=(W-pad*2)/keys.length;
  const bw=Math.min(30,(gap-12));
  return {keys,mx,W,H,pad,gap,bw,
    bars:keys.map((k,i)=>{
      const v=D.overview[k].总时长, h=Math.max(4,(v/mx)*(H-pad*2-22));
      const x=pad+i*gap+(gap-bw)/2;
      return {k,v,h,x,w:bw,on:i===keys.length-1};
    })};
}

/* ═══════════ v3 图表：数据准备 ═══════════ */

/* 近 n 个月的类型分段（堆叠柱用）。
   ⚠️ 10 月只过了半个月，跟整月柱放一起会显得"暴跌"—— 柱子上标"至今"，
   并且在图例下写明，避免误读。 */
function stackMonths(n){
  return Object.keys(D.overview).sort().slice(-n).map(k=>{
    const o=D.overview[k];
    const ts=(o.types||[]).slice().sort((a,b)=>b.时长-a.时长);
    return {ym:k, 总时长:o.总时长, 次数:o.次数, 天数:o.天数, types:ts,
      距离:o.总距离, 消耗:o.总消耗};
  });
}
/* 当月是否已过完 —— 没过完要标"至今" */
function isCurrentMonth(ym){
  const now=new Date();
  return ym===now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
}

/* 近 n 周 × 7 天热力图。weeks 从早到晚返回，每周 7 格（周一→周日）。 */
function heatWeeks(n){
  const now=new Date(), dow=(now.getDay()+6)%7;
  const mon=new Date(now); mon.setDate(now.getDate()-dow);
  const start=new Date(mon); start.setDate(mon.getDate()-(n-1)*7);
  const byday=bydayOf(nowYM());
  /* bydayOf 只扫当月 —— 周跨月时上个月那几天会漏，这里补全月 */
  const all={}; D.recent.forEach(r=>{all[r.date]=(all[r.date]||0)+r.时长});
  const weeks=[];
  for(let w=0;w<n;w++){
    const cells=[];
    for(let d=0;d<7;d++){
      const x=new Date(start); x.setDate(start.getDate()+w*7+d);
      const ds=ymd(x);
      const m=all[ds]||0;
      const fut=x>now;
      cells.push({ds, min:m, wd:d, fut, today:ds===ymd(now)});
    }
    weeks.push(cells);
  }
  /* 强度分级：按当月最大单日时长 */
  const mx=Math.max(...Object.values(all),1);
  weeks.forEach(w=>w.forEach(c=>{
    c.lv=c.min<=0?0:c.min<mx*0.25?1:c.min<mx*0.5?2:c.min<mx*0.8?3:4;
  }));
  return {weeks, start, mx};
}

/* 跑步序列（双轴图用）—— 距离太短的不进（2km 那次配速不可比） */
function runSeries(n){
  const rs=D.recent.filter(r=>r.类型==='跑步'&&hasPace(r)&&(r.距离||0)>=4)
    .slice(0,n);
  if(!rs.length) return null;
  const sp=rs.map(r=>secOf(r.配速显示));
  const hr=rs.filter(r=>r.平均心率).map(r=>r.平均心率);
  return {rs, sp,
    best:Math.min(...sp), worst:Math.max(...sp),
    hrMin:hr.length?Math.min(...hr):0, hrMax:hr.length?Math.max(...hr):0};
}

/* 体重 + 体脂双线 */
function weightSeries(){
  const b=D.body.slice().sort((x,y)=>x.date<y.date?-1:1);
  if(b.length<2) return null;
  const cur=b[b.length-1], y=cur.date.slice(0,4);
  /* 只画今年 —— 2025 年那两次和今年不是一条连续曲线，混在一起会误导 */
  const thisYear=b.filter(r=>r.date.slice(0,4)===y);
  const use=thisYear.length>=3?thisYear:b;
  return {b:use, 全:b,
    wMin:Math.min(...use.map(r=>r.weight_jin))-1, wMax:Math.max(...use.map(r=>r.weight_jin))+1,
    fMin:Math.min(...use.map(r=>r.bf_pct))-.6, fMax:Math.max(...use.map(r=>r.bf_pct))+.6,
    年份:y};
}

/* ═══════════ v3 图表：交互（统一的点选状态机） ═══════════
   ST.pick={图表名:选中项}，点已选中的 = 取消选中。
   不用变量重渲染整页（会闪、丢滚动位置），只更新受影响的 DOM 节点。 */
function pickAt(chart,key,sel){
  const cur=ST.pick[chart];
  if(cur===key){ ST.pick[chart]=null; }else{ ST.pick[chart]=key; }
  paintCharts(chart);
}
function picked(chart){return ST.pick[chart]}

/* 只刷新某个图表区域，避免整页重绘 */
function paintCharts(chart){
  if(chart==='month') paintMonthChart();
  else if(chart==='heat') paintHeatChart();
  else if(chart==='dual') paintDualChart();
  else if(chart==='weight') paintWeightChart();
}

/* 选中项高亮 + 降透明度其它项：一次把所有相关 class 刷一遍 */
function applySel(scope, selAttr, hitSel, dimSel){
  const box=document.getElementById(scope);
  if(!box) return;
  Array.prototype.forEach.call(box.querySelectorAll(hitSel), el=>{
    const on=el.dataset[selAttr]===String(ST.pick[chartOf(scope)]);
    el.classList.toggle(dimSel, !!ST.pick[chartOf(scope)] && !on);
  });
}

/* ═══════════ v5 首页：看板（2026-10-20 大改版）═══════════
   四块，从上到下回答四个问题：
     ① 今天练了什么   ② 本周练得怎么样   ③ 这个月哪几天练了   ④ 趋势与体重
   ⚠️ 口径：手表记录(D.recent) 与手动补录的器械(D.strength) 必须**合并**。
      旧版只看 D.recent —— 手动补录那天（比如 10-20 练背）在日历上是空的，
      他会觉得"我今天练了怎么没显示"。 */
function dsPad(n){return String(n).padStart(2,'0')}
function dsOf(d){return d.getFullYear()+'-'+dsPad(d.getMonth()+1)+'-'+dsPad(d.getDate())}
function allDays(){
  const m={};
  const t=ds=>m[ds]||(m[ds]={min:0,kcal:0,km:0,n:0,st:null,j:null});
  (D.recent||[]).forEach(r=>{const o=t(r.date);o.min+=r.时长||0;o.kcal+=r.消耗||0;o.km+=r.距离||0;o.n++});
  (D.strength||[]).forEach(s=>{t(s.date).st=s});
  (D.journal||[]).forEach(j=>{t(j.date).j=j});
  return m;
}
function setsOf(st){return st&&st.items?st.items.reduce((a,i)=>a+(i.sets||0),0):0}
function grpOf(st){
  if(!st||!st.items) return '';
  const s=[...new Set(st.items.map(i=>i.部位).filter(Boolean))];
  return s.join(' · ');
}
/* 本月的合并口径统计（天数/次数/分钟），用于封面那行和趋势卡 */
function monthStat(ym){
  const days=allDays(); let d=0,n=0,min=0;
  Object.keys(days).forEach(k=>{
    if(k.slice(0,7)!==ym) return;
    const o=days[k];
    if(o.n||o.st){d++;n+=o.n||1;min+=o.min||0}
  });
  return {d,n,min};
}
/* 某一周（off=0 本周，-1 上周）：7 天格子 + 合计 */
function weekStat(off){
  const now=new Date(), dow=(now.getDay()+6)%7;
  const mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow+(off||0)*7);
  const days=allDays(), cells=[];
  let min=0,n=0,on=0,sets=0;
  for(let i=0;i<7;i++){
    const d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i);
    const ds=dsOf(d), o=days[ds]||null;
    const has=!!(o&&(o.n||o.st));
    if(has){on++;n+=o.n||1;min+=o.min||0;if(o.st)sets+=setsOf(o.st)}
    cells.push({ds,has,min:o?o.min:0,st:o?o.st:null,
      fut:ds>dsOf(now),today:ds===dsOf(now),wd:WD[i]});
  }
  return {cells,mon,min,n,on,sets};
}

/* ③ 本月训练日历（真日历：周一开头，一格一天；强度按当天时长分 4 档，
   手动补录的器械日没有手表时长 → 固定中间档，不瞎编分钟数） */
function homeCalHTML(){
  const now=new Date(), Y=now.getFullYear(), M=now.getMonth();
  const days=allDays(), dim=new Date(Y,M+1,0).getDate();
  const start=(new Date(Y,M,1).getDay()+6)%7;
  let mx=1;
  for(let d=1;d<=dim;d++){const o=days[Y+'-'+dsPad(M+1)+'-'+dsPad(d)]; if(o&&o.min>mx) mx=o.min}
  const tds=dsOf(now);
  let on=0;
  let cells='';
  for(let i=0;i<start;i++) cells+='<div class="cd empty"></div>';
  for(let d=1;d<=dim;d++){
    const ds=Y+'-'+dsPad(M+1)+'-'+dsPad(d), o=days[ds];
    const has=!!(o&&(o.n||o.st));
    let lv=0;
    if(has){
      on++;
      lv=o.min>0?(o.min<mx*0.3?1:o.min<mx*0.6?2:o.min<mx*0.85?3:4):2;
    }
    const cls='cd'+(lv?' lv'+lv:'')+(ds===tds?' now':'');
    cells+=`<div class="${cls}"${has?` onclick="detailDay('${ds}')"`:''} aria-label="${M+1} 月 ${d} 日${has?' 有训练':''}">
      <span class="cdn">${d}</span>${has?'<div class="dotline"><i></i></div>':''}</div>`;
  }
  const tail=(7-(start+dim)%7)%7;
  for(let i=0;i<tail;i++) cells+='<div class="cd empty"></div>';
  return `<div class="card block mcal">
    <div class="mnav"><b>${M+1} 月</b><span style="font-size:10.5px;color:var(--ink3)">
      练了 <b style="color:var(--gold);font-weight:700">${on}</b> 天</span></div>
    <div class="ch7">${['一','二','三','四','五','六','日'].map(x=>`<span>${x}</span>`).join('')}</div>
    <div class="cg">${cells}</div>
    <div class="leg"><span>少</span>
      <i style="background:color-mix(in srgb,var(--gold) 13%,transparent)"></i>
      <i style="background:color-mix(in srgb,var(--gold) 25%,transparent)"></i>
      <i style="background:color-mix(in srgb,var(--gold) 38%,transparent)"></i>
      <i style="background:color-mix(in srgb,var(--gold) 54%,transparent)"></i>
      <span>多</span><span style="margin-left:auto">点某天看当天做了什么</span></div>
  </div>`;
}

/* ④ 体重迷你折线 */
function wSpark(){
  const s=weightSeries(); if(!s) return '';
  const b=s.b, W=132, H=36, pad=4;
  const min=s.wMin, max=s.wMax;
  const pts=b.map((r,i)=>{
    const x=pad+i*(W-pad*2)/Math.max(b.length-1,1);
    const y=pad+(1-(r.weight_jin-min)/((max-min)||1))*(H-pad*2);
    return [x,y];
  });
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:36px;display:block;overflow:visible">
    <path d="${d}" fill="none" stroke="var(--gold)" stroke-width="1.5" vector-effect="non-scaling-stroke"
      stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.6" fill="var(--gold)"/></svg>`;
}

            <span style="font-size:11px;color:var(--ink2);font-family:-apple-system,'PingFang SC',sans-serif;margin-left:7px">${(TY[top.type]||['',''])[0]} ${top.type}</span></div>
          <div style="font-size:10.5px;color:var(--ink3);margin-top:4px">共 ${idx.n} 条 GPS 轨迹 · 累计 ${idx.totalKm} km · 总爬升 ${idx.totalElev} m</div>

/* ═══════════ v3 图表：① 月度堆叠柱 ═══════════ */
const MONTHS_N=8;
function monthChartHTML(){
  const ms=stackMonths(MONTHS_N);
  ST.__ms=ms;
  /* 顺序与总数缓存起来，供 paint* 重画时复用，别每次重算 */
  const allTypes=[]; ms.forEach(m=>m.types.forEach(t=>{if(allTypes.indexOf(t.名称)<0)allTypes.push(t.名称)}));
  const byTot={}; allTypes.forEach(n=>byTot[n]=0);
  ms.forEach(m=>m.types.forEach(t=>byTot[t.名称]+=t.时长));
  ST.__order=allTypes.slice().sort((a,b)=>byTot[b]-byTot[a]);
  const on=ST.pick.month;
  /* 图例关掉某类后，柱子要按「可见时长」重新归一化 —— 否则 9 月隐藏骑行后
     柱子还是全高、里面只剩一小段彩色（空心柱），图例就失去了"只看某一类"的意义。
     visMin=0（该类全被关掉）时柱子整根消失，也不再给选中态。 */
  const visMin=m=>m.types.filter(t=>!lgOff(t.名称)).reduce((a,t)=>a+t.时长,0);
  const mx=Math.max(...ms.map(visMin),1);

  const bars=ms.map(m=>{
    const vm=visMin(m);
    const h=vm>0?Math.max(8,(vm/mx)*100):0;
    const segs=m.types.map(t=>{
      if(lgOff(t.名称)) return '';
      const sh=vm>0?(t.时长/vm)*100:0;   /* 每段占「可见总时长」的比例 */
      return `<i style="height:${sh.toFixed(2)}%;background:${mixColor(t.名称)}"></i>`;
    }).join('');
    const isOn=on===m.ym&&vm>0;
    return `<div class="mg${isOn?' on':''}" data-month="${m.ym}" onclick="pickAt('month','${m.ym}')">
      <div class="mtop">${isOn?hrsOf(vm):''}</div>
      <div class="mzone"><div class="mstack" style="height:${h}%">${segs}</div></div>
      <div class="mlab">${+m.ym.slice(5)}月${isCurrentMonth(m.ym)?'*':''}</div>
    </div>`;
  }).join('');

  return `<div class="gsec">
    <div class="gt">每个月练了什么</div>
    <div class="gd">柱子里每一段是一种运动。点柱子看当月明细，点图例可隐藏某一类。</div>
    <div class="mbar chart" id="ch-month">${bars}</div>
    <div class="legend" style="margin-top:13px">${legendHTML()}</div>
    ${pickBodyHTML()}
  </div>`;
}
function paintMonthChart(){
  const card=document.querySelector('#app .gsec .mg')&&document.querySelector('#app .gsec .mg').closest('.gsec');
  if(!card) return;
  const on=ST.pick.month;
  /* 图例：先在原位置刷 off 类，再按需重建（顺序可能变） */
  const lg=card.querySelector('.legend[data-live]');
  if(lg){
    lg.innerHTML=legendHTML();
    lg.setAttribute('data-live','1');
  }
  Array.prototype.forEach.call(card.querySelectorAll('.mg'), el=>{
    const m=ST.__ms.find(x=>x.ym===el.dataset.month);
    const vm=m?m.types.filter(t=>!lgOff(t.名称)).reduce((a,t)=>a+t.时长,0):0;
    el.classList.toggle('on', el.dataset.month===on&&vm>0);
    el.classList.toggle('dim', !!on && el.dataset.month!==on);
    const top=el.querySelector('.mtop');
    if(top) top.textContent=(el.dataset.month===on&&vm>0)?hrsOf(vm):'';
  });
  /* 明细条：整体替换 */
  const old=card.querySelector('.pick[data-pick]');
  const tmp=document.createElement('div');
  tmp.innerHTML=pickBodyHTML();
  const nb=tmp.firstElementChild;
  if(nb) nb.setAttribute('data-pick','1');
  if(old) old.replaceWith(nb);
  else card.appendChild(nb);
}
/* 图例聚焦：ST.focus=null 看全部；=某类型名时只看那一类。
   ⚠️ 旧版是"多选隐藏"（ST.legendOff 逐个点掉），阿成反馈"我想看其中一个得把其他
   全部点掉，看起来好累"——参照淘宝/小红书筛选 chip 的逻辑改成**单选聚焦**：
   点一下只看它，再点同一项恢复全部，点其他项切换过去，随时有「全部」可回。 */
function lgOff(name){ return !!ST.focus && ST.focus!==name; }
function legendHTML(){
  const order=ST.__order||[], f=ST.focus;
  const all=f?`<span class="allchip" onclick="tglLegend('__all__')">全部</span>`:'';
  return all+order.map(n=>`<span class="${f===n?'on':(f?'dim':'')}" onclick="tglLegend('${esc(n)}')">
      <i style="background:${mixColor(n)}"></i><b>${esc(n)}</b></span>`).join('');
}
function pickBodyHTML(){
  const on=ST.pick.month;
  const sel=on?ST.__ms.find(m=>m.ym===on):null;
  if(!sel) return `<div class="pick" data-pick="1" style="opacity:.72">
      <div class="pk-s">点任意一根柱子看那个月的构成 · 点图例可只看某一类</div></div>`;
  const vis=sel.types.filter(t=>!lgOff(t.名称));
  const tot=vis.reduce((a,t)=>a+t.时长,0);
  if(!vis.length) return `<div class="pick" data-pick="1">
      <div class="pk-t">${+sel.ym.slice(5)} 月</div>
      <div class="pk-s">这个月没练过「${esc(ST.focus)}」· 点图例里的「全部」看所有类型</div>
      <div class="pk-x" onclick="pickAt('month','${sel.ym}')">×</div></div>`;
  const tip=ST.focus?` · 正在只看「${esc(ST.focus)}」`:'';
  return `<div class="pick" data-pick="1">
      <div class="pk-t">${+sel.ym.slice(5)} 月</div>
      <div class="pk-s">${sel.次数} 次 · ${sel.天数} 天 · ${hrsOf(tot)} 小时 · ${sel.距离.toFixed(1)} km · ${sel.消耗} kcal${tip}
        ${isCurrentMonth(sel.ym)?'（至今）':''}</div>
      <div class="pk-x" onclick="pickAt('month','${sel.ym}')">×</div>
    </div>
    <div class="legend" data-live="1" style="margin-top:10px">${vis.map(t=>
      `<span style="pointer-events:none"><i style="background:${mixColor(t.名称)}"></i>${esc(t.名称)} ${Math.round(t.时长)}′ · ${Math.round(t.时长/tot*100)}%</span>`).join('')}</div>`;
}
/* 图例开关：只重画这张图这张卡，不整页重绘（否则滚动位置会丢）
   ⚠️ 踩过的坑（2026-10-16 阿成录屏反馈）：这里原来是 card.innerHTML=monthChartHTML()，
   而 monthChartHTML() 返回的是**一整个 .gsec 卡片**，等于把新卡片塞进旧卡片的 innerHTML，
   卡片套卡片；再点一次图例，closest('.gsec') 找到最内层那张，又套一层 ——
   点几下首页就层层嵌套、内容重复、可视区被挤爆（他描述"一直重叠、越来越小"）。
   必须用 outerHTML 整块替换，且替换后不用再手动补 on/dim class
   （monthChartHTML() 生成时已经按 ST.pick.month 写好了）。 */
function tglLegend(n){
  /* 单选聚焦：点同一项或「全部」→ 恢复全部；点其他项 → 切换聚焦到它 */
  ST.focus=(n==='__all__'||ST.focus===n)?null:n;
  const anchor=document.querySelector('#app .mg');
  if(!anchor) return;
  const card=anchor.closest('.gsec');
  const scrollY=window.scrollY;
  card.outerHTML=monthChartHTML();
  window.scrollTo(0,scrollY);
}

/* ② 训练热力图 —— 12 周× 7 格在375pt 宽屏上大约 330px 高，占一整屏太多。
   改成「按列（周）竖向堆叠、每列是 7 天」仍然太高，所以这里用**上下两段**：
   近 6 周 + 更早 6 周，中间可折叠。默认只显示近 6 周（约 165px）。 */
const HEAT_WEEKS=12;
function heatHTML(){
  const h=heatWeeks(HEAT_WEEKS);
  const on=ST.pick.heat;
  const expanded=!!ST.heatAll;
  const visible=expanded?h.weeks:h.weeks.slice(HEAT_WEEKS/2);

  /* 跨月处（或当月 1 号）日期带月份前缀 —— 阿成反馈"下面是七八九十月，不知道对应哪"
     所以底部月份标签行整个去掉，让每格自己说"我是哪天" */
  const dLabel=ds=>{
    const d=new Date(ds);
    const yest=new Date(ds); yest.setDate(d.getDate()-1);
    const cross=yest.getMonth()!==d.getMonth()||d.getDate()===1;
    return cross?`${d.getMonth()+1}/${d.getDate()}`:`${d.getDate()}`;
  };

  /* 一周一行：上行日期（小）、下行分钟数（粗，有训练才显示） */
  const grid=visible.map(wk=>wk.map(c=>{
    const cls=['hc','l'+c.lv,c.today?'tdy':'',on===c.ds?'on':'',c.fut?'fut':''].filter(Boolean).join(' ');
    return `<div class="${cls}" data-ds="${c.ds}" ${c.fut?'':`onclick="pickAt('heat','${c.ds}')"`}>
      <i class="d">${dLabel(c.ds)}</i>${c.min>0?`<b class="m">${Math.round(c.min)}′</b>`:'<s class="m"></s>'}</div>`;
  }).join('')).join('');

  const all=h.weeks.flat(), act=all.filter(c=>c.min>0);
  const totalMin=all.reduce((a,c)=>a+c.min,0);
  const weeks=expanded?HEAT_WEEKS:HEAT_WEEKS/2;

  const sel=on?all.find(c=>c.ds===on):null;
  const selBody=sel?heatPickHTML(sel):'';

  return `<div class="gsec">
    <div class="gt">训练节奏</div>
    <div class="gd">一周一行，一格一天，颜色越深练得越久。蓝框是今天。点格子看那天练了什么。</div>
    <div class="chart" id="ch-heat">
      <div class="heatwk">${WD.map(d=>`<div>${d[1]}</div>`).join('')}</div>
      <div class="heat">${grid}</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:11px">
      <div style="flex:1;font-size:11.5px;color:var(--ink2)">
        近 ${weeks} 周 · <b style="color:var(--ink);font-weight:600">${act.length}</b> 天有训练 · 周均 <b style="color:var(--ink);font-weight:600">${Math.round(totalMin/weeks/6)/10}</b> 小时
      </div>
      <button class="minibtn" onclick="toggleHeat()">${expanded?'收起':'看更早 6 周'}</button>
    </div>
    ${selBody}
  </div>`;
}
function heatPickHTML(c){
  const list=D.recent.filter(r=>r.date===c.ds);
  return `<div class="pick" style="flex-direction:column;align-items:stretch;gap:9px" data-pick-heat="1">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="pk-t">${c.ds.slice(5)} ${WD[(new Date(c.ds).getDay()+6)%7]}</div>
        <div class="pk-s">${c.min>0?Math.round(c.min)+' 分钟':'这天没训练'}</div>
        <div class="pk-x" onclick="pickAt('heat','${c.ds}')">×</div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${list.map(r=>
        `<span style="font-size:10.5px;padding:3px 8px;border-radius:99px;background:var(--card);
           border:1px solid var(--line2)">${(TY[r.类型]||['·'])[0]} ${esc(r.类型)} ${Math.round(r.时长)}′${r.距离?' · '+r.距离+'km':''}</span>`).join('')||
        `<span style="font-size:10.5px;color:var(--ink3)">这天没有记录，休息也是训练的一部分</span>`}</div>
      <div style="font-size:10.5px;color:var(--ink3)">在「记录」里能看当天完整明细</div>
    </div>`;
}
function toggleHeat(){
  const y=window.scrollY;
  ST.heatAll=!ST.heatAll;
  route();
  window.scrollTo(0,y);
}
function paintHeatChart(){
  const box=document.getElementById('ch-heat'); if(!box) return;
  const on=ST.pick.heat;
  Array.prototype.forEach.call(box.querySelectorAll('.hc'), el=>{
    el.classList.toggle('on', el.dataset.ds===on);
  });
  const card=box.closest('.gsec'); if(!card) return;
  const old=card.querySelector('[data-pick-heat]');
  const h=heatWeeks(HEAT_WEEKS);
  const sel=on?h.weeks.flat().find(c=>c.ds===on):null;
  const tmp=document.createElement('div');
  if(sel) tmp.innerHTML=heatPickHTML(sel);
  const nb=tmp.firstElementChild;
  if(old) nb?old.replaceWith(nb):old.remove();
  else if(nb) card.appendChild(nb);

/* ═══════════ v3 图表：③ 配速 — 心率 双轴 ═══════════
   左轴＝配速（秒，越短越高），右轴＝平均心率。
   柱＝配速（越快越高），点＝心率。两个轴各自归一，各自标注单位。 */
/* ═══════════ v4 图表：③ 跑步配速折线（单轴，砍掉双轴） ═══════════
   ⚠️ v3 这里是「柱=配速 + 点=心率」双轴图，阿成反馈"柱状图跟点状图结合很奇怪、
   怎么看都怪怪的、一眼不知道在看什么"。双轴对普通用户学习成本太高。
   v4 改回**只说一件事**：配速趋势。线越靠上=跑得越快，金圈=最快那次。
   心率从图上撤掉，进选中明细 + 标题小结（避免一图两尺）。 */
function paceTxt(sec){return Math.floor(sec/60)+"'"+String(Math.round(sec%60)).padStart(2,'0')+'"'}
function dualHTML(){
  const d=runSeries(14);
  if(!d) return '';
  const W=330,H=150,padL=36,padR=14,padT=18,padB=26;
  const iw=W-padL-padR, ih=H-padT-padB;
  const n=d.rs.length;
  const spR=(d.worst-d.best)||1;
  const X=i=>padL+(n===1?iw/2:iw*i/(n-1));
  const Y=sp=>padT+((sp-d.best)/spR)*ih;      /* 秒数越小越快 → 越靠上 */
  const on=ST.pick.dual;
  const pts=d.rs.map((r,i)=>({x:X(i),y:Y(d.sp[i]),r,i}));
  const line=pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const area=`${padL},${(padT+ih).toFixed(1)} ${line} ${X(n-1).toFixed(1)},${(padT+ih).toFixed(1)}`;
  const fastI=d.sp.indexOf(d.best);

  const grid=[0,.5,1].map(t=>{
    const y=padT+ih*t;
    return `<line class="dgrid" x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}"/>`;
  }).join('');

  /* y 轴配速刻度：上=最快，下=最慢 */
  const yl=[0,.5,1].map(t=>{
    const sp=d.best+spR*t;
    return `<text class="daxl" x="${padL-6}" y="${(padT+ih*t).toFixed(0)}" text-anchor="end"
      dominant-baseline="central">${paceTxt(sp)}</text>`;
  }).join('');

  const dots=pts.map(p=>{
    const r=p.r, sel=on===r.date, fast=p.i===fastI;
    return `<circle class="ddot" data-dual="${r.date}" data-cx="${p.x.toFixed(0)}" data-cy="${(p.y-8).toFixed(0)}"
      cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${sel?6:4.2}"
      fill="${sel?'var(--gold)':'var(--card)'}" stroke="${fast?'var(--gold)':'var(--run)'}"
      stroke-width="${fast?2.8:2}" opacity="${on&&!sel?.4:1}"
      onpointerenter="dualTip('${r.date}',${p.x.toFixed(0)},${(p.y-8).toFixed(0)})"
      onpointerdown="dualTap('${r.date}')"/>`;
  }).join('');

  /* 最快那点上方标两个字，不用猜哪个是最快 */
  const fp=pts[fastI];
  const fastMark=`<text class="dfast" x="${fp.x.toFixed(1)}" y="${(fp.y-13).toFixed(1)}" text-anchor="middle">最快</text>`;

  /* ⚠️ (n-1)/2 可能带 .5（n=14 → 6.5），取 .date 会抛 undefined。必须 Math.floor。 */
  const xl=[0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>{
    const r=d.rs[i];
    return `<text class="daxl" x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${r.date.slice(5)}</text>`;
  }).join('');

  const avgSp=d.sp.reduce((a,b)=>a+b,0)/n;
  const hrs=d.rs.map(r=>r.平均心率).filter(Boolean);
  const avgHr=hrs.length?Math.round(hrs.reduce((a,b)=>a+b,0)/hrs.length):null;
  const fast=d.rs[fastI];

  return `<div class="gsec">
    <div class="gt">跑步配速</div>
    <div class="gd">线越靠上＝跑得越快，金圈是这 ${n} 次里最快的。平均 ${paceTxt(avgSp)}，最快 ${fast.配速显示}（${fast.date.slice(5)}）${avgHr!=null?`，平均心率 ♥${avgHr}`:''}。点圆点看那天详情。</div>
    <div class="chart dual" id="ch-dual">
      <div class="tipbox" id="tip-dual"></div>
      <svg viewBox="0 0 ${W} ${H}" height="${H}">
        <defs><linearGradient id="pgrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="var(--gold)" stop-opacity=".30"/>
          <stop offset="1" stop-color="var(--gold)" stop-opacity="0"/>
        </linearGradient></defs>
        ${grid}
        <polygon points="${area}" fill="url(#pgrad)"/>
        <polyline points="${line}" fill="none" stroke="var(--gold)" stroke-width="2.2"
          stroke-linejoin="round" stroke-linecap="round"/>
        ${fastMark}${dots}${xl}${yl}
      </svg>
    </div>
    ${dualPickHTML(on?d.rs.find(r=>r.date===on):null,d)}
  </div>`;
}
/* 选中明细：心率在这里给，还带"比平均高/低几跳"，言之有物 */
function dualPickHTML(sel,d){
  if(!sel) return `<div class="pick" data-pick-dual="1" style="opacity:.72">
      <div class="pk-s">点任意圆点，看那天的配速、心率和它在这批里的位置</div></div>`;
  const sp=d.sp[d.rs.indexOf(sel)];
  const ratio=Math.round(sp/d.best*100);
  const hrs=d.rs.map(r=>r.平均心率).filter(Boolean);
  const avgHr=hrs.length?Math.round(hrs.reduce((a,b)=>a+b,0)/hrs.length):null;
  const hrDiff=(sel.平均心率&&avgHr!=null)?Math.round(sel.平均心率-avgHr):null;
  const fast=ratio<=100;
  return `<div class="pick" data-pick-dual="1">
      <div class="pk-t">${sel.date.slice(5)}</div>
      <div class="pk-s">${sel.距离} km · ${sel.配速显示}/km · ${Math.round(sel.时长)} 分钟
        ${sel.平均心率?`· ♥${sel.平均心率}（最高 ${sel.最高心率}）${hrDiff!=null?`，比平均${hrDiff>0?'高':'低'} ${Math.abs(hrDiff)} 跳`:''}`:''}
        ${fast?'<span style="color:var(--gold);font-weight:600"> · 是这批里最快的一次</span>'
              :`<span style="color:var(--gold)"> · 比最快那次慢 ${ratio-100}%</span>`}</div>
      <div class="pk-x" onclick="pickAt('dual','${sel.date}')">×</div></div>`;
}
function dualTip(ds,x,y){
  const r=D.recent.find(v=>v.date===ds); if(!r) return;
  showTip('tip-dual',`<b>${ds.slice(5)}</b> ${esc(r.类型)} ${r.距离||''}km<br>
    配速 ${r.配速显示||'—'} · ♥${r.平均心率||'—'} · ${Math.round(r.时长)}分钟 · ${r.消耗}kcal`, x, y);
}

function weightChartHTML(){
  const d=weightSeries(); if(!d) return '';
  const W=330,H=150,padL=32,padR=34,padT=12,padB=26;
  const iw=W-padL-padR, ih=H-padT-padB, n=d.b.length;
  const step=iw/(n-1);
  const X=i=>padL+step*i;
  const wR=(d.wMax-d.wMin)||1, fR=(d.fMax-d.fMin)||1;
  const Yw=v=>padT+ih-((v-d.wMin)/wR)*ih;
  const Yf=v=>padT+ih-((v-d.fMin)/fR)*ih;
  const on=ST.pick.weight;

  const grid=[0,.5,1].map(t=>`<line class="dgrid" x1="${padL}" y1="${(padT+ih*t).toFixed(1)}"
    x2="${W-padR}" y2="${(padT+ih*t).toFixed(1)}"/>`).join('');

  const pw=d.b.map((r,i)=>`${X(i).toFixed(1)},${Yw(r.weight_jin).toFixed(1)}`).join(' ');
  const pf=d.b.map((r,i)=>`${X(i).toFixed(1)},${Yf(r.bf_pct).toFixed(1)}`).join(' ');

  const dotsW=d.b.map((r,i)=>{
    const sel=on===r.date;
    return `<circle class="wdot" data-wt="${r.date}" data-cx="${X(i).toFixed(1)}"

      onpointerdown="wTap('${r.date}')"/>`;
  }).join('');
  const dotsF=d.b.map((r,i)=>{
    const sel=on===r.date;
    return `<circle class="wdot" data-wt="${r.date}" data-cx="${X(i).toFixed(1)}"
      data-cy="${(Yf(r.bf_pct)-14).toFixed(0)}" cx="${X(i).toFixed(1)}" cy="${Yf(r.bf_pct).toFixed(1)}"
      r="${sel?5.5:4}" fill="var(--warn)" stroke="var(--card)" stroke-width="1.4"
      opacity="${on&&!sel?.32:1}"
      onpointerenter="wTip('${r.date}',${X(i).toFixed(0)},${(Yf(r.bf_pct)-22).toFixed(0)})"
      onpointerdown="wTap('${r.date}')"/>`;
  }).join('');

  /* x 轴标签按点数稀疏化：<=6 个全标，否则标首、中、尾。
     （11 次称重标 11 个会挤成一团，之前只标了 3 个又显得信息太少。） */
  const marks=n<=6?Array.from({length:n},(_,i)=>i)
    :[0,Math.round((n-1)/3),Math.round(2*(n-1)/3),n-1].filter((v,i,a)=>a.indexOf(v)===i);
  const xl=marks.map(i=>
    `<text class="daxl" x="${X(i).toFixed(1)}" y="${H-9}" text-anchor="middle">${d.b[i].date.slice(2)}</text>`).join('');

  const ylL=[0,1].map(t=>`<text class="daxl" x="${padL-5}" y="${(padT+ih-ih*t).toFixed(0)}"
    text-anchor="end" dominant-baseline="central">${Math.round(d.wMin+wR*t)}</text>`).join('');
  const ylR=[0,1].map(t=>`<text class="daxl" x="${W-padR+5}" y="${(padT+ih-ih*t).toFixed(0)}"
    text-anchor="middle" dominant-baseline="central">${(d.fMin+fR*t).toFixed(1)}</text>`).join('');

  const cur=d.b[n-1], first=d.b[0];
  const 净变化=(cur.weight_jin-first.weight_jin).toFixed(1);
  const sel=on?d.b.find(r=>r.date===on):null;

  return `<div class="gsec">
    <div class="gt">体重与体脂（${d.年份}）</div>
    <div class="gd">金线＝体重（斤，左轴），橙虚线＝体脂率（%，右轴）。点任一点看当次全部读数。</div>
    <div class="chart dual wl2" id="ch-weight">
      <div class="tipbox" id="tip-weight"></div>
      <svg viewBox="0 0 ${W} ${H}" height="${H}">
        ${grid}
        <polyline class="wline" points="${pf}" stroke="var(--warn)" stroke-width="1.8"
          stroke-dasharray="4 3" opacity=".9"/>
        <polyline class="wline" points="${pw}" stroke="var(--gold)" stroke-width="2.4"/>
        ${dotsF}${dotsW}${xl}${ylL}${ylR}

    <div class="legend ro" style="margin-top:10px;grid-template-columns:1fr 1fr auto">

      <span style="border:0;justify-content:flex-end;color:${Number(净变化)<=0?'var(--green)':'var(--heart)'};font-weight:700">

      <div class="pk-x" onclick="pickAt('weight','${sel.date}')">×</div></div>`:''}
  </div>`;
}

/* 周节奏条的内层（供首页「本周」卡复用；weekStrip 是封面用的带标题版本） */
function weekStripInner(){
  const now=new Date(), dow=(now.getDay()+6)%7;
  const mon=new Date(now); mon.setDate(now.getDate()-dow);
  const byday=bydayOf(nowMonthLabel().replace(' · ','-'));
  let cells='';
  for(let i=0;i<7;i++){
    const d=new Date(mon); d.setDate(mon.getDate()+i);
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const m=byday[ds]||0;
    const cls='wd2'+(m?' on':'')+(i===dow?' today':'');
    cells+=`<div><div class="wl">${WD[i][1]}</div>
      <div class="${cls}" ${m?`onclick="detailDay('${ds}')"`:''} style="${m?'cursor:pointer':''}">${m?Math.round(m)+'′':''}</div></div>`;
  }
  const wk=Object.keys(byday).filter(k=>k>=ymd(mon)).reduce((a,k)=>a+byday[k],0);
  const nD=Object.keys(byday).filter(k=>k>=ymd(mon)).length;
  return `<div class="wkt" style="margin-top:0"><span>本周已练</span><em>${nD} 天 · ${Math.round(wk)} 分钟</em></div>
    <div class="wk">${cells}</div>`;
}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

/* ═══════════ 身体指标 hm（2026-10-18 接入，数据见 脚本/import_metrics.py）═══════════
   两条来源合并：Apple Health 全量导出（2025-01-01~2026-09-19）+ 手机「健康自动导出」
   App 的每日指标（2025-01~04 / 2026-01 / 2026-10）。**睡眠数据按阿成要求未纳入**。
   手表没戴 / 没导出的日子没有数据 —— 图表按真实日期定位，缺口自然留空，不插值不补零。 */
const HM_METRICS={
  rhr  :{name:'静息心率',unit:'bpm',dec:0,better:'low', icon:'♥',
         note:'静息心率越低，通常说明恢复越好、心脏负担越小'},
  hrv  :{name:'HRV',    unit:'ms', dec:0,better:'high',icon:'∿',
         note:'HRV（心率变异性）越高，通常说明自主神经恢复越好'},
  spo2 :{name:'血氧',   unit:'%',  dec:0,better:'high',icon:'◍',
         note:'血氧日常都在 95% 上下，突然掉下去才值得注意'},
  rr   :{name:'呼吸率', unit:'次/分',dec:1,better:'low',icon:'≈',
         note:'静息呼吸率升高有时和疲劳、恢复不足有关'},
  vo2  :{name:'VO₂Max', unit:'',   dec:1,better:'high',icon:'⤴',
         note:'最大摄氧量，有氧体能的硬指标；只在户外走/跑后更新，所以稀疏'},
  steps:{name:'步数',   unit:'步', dec:0,better:'high',icon:'👟',comma:1,
         note:'全天累计步数（手表逐分钟记录求和）'},
  kcal :{name:'活动千卡',unit:'kcal',dec:0,better:'high',icon:'🔥',comma:1,
         note:'动态千卡（不含基础代谢），全天活动累计'},
};
function hmDays(){return (D.hm&&D.hm.days)||[]}
function hmByDate(){
  if(hmByDate._src===D.hm) return hmByDate._m;
  const m={}; hmDays().forEach(r=>{m[r.d]=r});
  hmByDate._src=D.hm; hmByDate._m=m; return m;
}
/* 最近 nDays 自然日内的有值点（升序）；nDays=0/不传 = 全部 */
function hmSeries(key,nDays){
  const out=[]; if(!hmDays().length) return out;
  const cut=nDays?ymd(new Date(Date.now()-nDays*864e5)):'0000-00-00';
  for(const r of hmDays()){ if(r[key]!=null&&r.d>=cut) out.push({d:r.d,v:r[key]}); }
  return out;
}
function hmAvg(a){return a.reduce((s,p)=>s+p.v,0)/a.length}
/* 以每个点为中心 ±half 个自然日的均值（跨缺口不硬桥接） */
function hmRoll(arr,half){
  return arr.map(p=>{
    const c=new Date(p.d).getTime(), lo=c-half*864e5, hi=c+half*864e5;
    let s=0,n=0;
    for(const q of arr){const t=new Date(q.d).getTime(); if(t>=lo&&t<=hi){s+=q.v;n++;}}
    return n?s/n:null;
  });
}
/* 最近 days 天均值 vs 前一个有数据的同长度窗口（缺口味自动往前找，最多回看 90 天）；
   样本不足返回 null。winLast=对照窗内最后一个有数据的日期（文案里跟它比）。 */
function hmDelta(arr,days){
  if(arr.length<4) return null;
  const now=Date.now();
  const cut=ymd(new Date(now-days*864e5));
  const a=arr.filter(p=>p.d>=cut);
  if(a.length<2) return null;
  const hard=ymd(new Date(now-90*864e5));
  for(let back=days;back<=90;back+=days){
    const hi=ymd(new Date(now-back*864e5));
    const lo=ymd(new Date(now-(back+days)*864e5));
    if(lo<hard) break;
    const b=arr.filter(p=>p.d>=lo&&p.d<hi);
    if(b.length>=2) return {now:hmAvg(a),prev:hmAvg(b),n:a.length,winLast:b[b.length-1].d};
  }
  return null;
}
function hmFmt(k,v){
  if(v==null) return '—';
  const m=HM_METRICS[k];
  const d=m?m.dec:0;
  return m&&m.comma?fmtNum(v):(d?v.toFixed(d):String(Math.round(v)));
}
/* 把序列按「>7 天没数据」的缺口切成段 —— 折线不硬跨缺口，不然 9/19→10/11 会被
   画成一条连续下降的线，把"没数据"读成"在变差"（阿成对口径很敏感）。 */
function hmSegs(arr){
  const segs=[];let cur=[];
  for(let i=0;i<arr.length;i++){
    if(cur.length&&(new Date(arr[i].d)-new Date(arr[i-1].d))/864e5>7){segs.push(cur);cur=[];}
    cur.push(arr[i]);
  }
  if(cur.length)segs.push(cur);
  return segs;
}
/* 通用 SVG 折线图：x=真实日期（有缺口留空），y 值域自适应；可选 ±roll 日均线 */
function hmLineSVG(series,o){
  o=o||{};
  const W=342,H=o.h||124,PL=o.pl||34,PR=10,PT=12,PB=20;
  const n=series.length;
  if(n<2) return `<div class="cap">${o.empty||'这段时间数据不足（手表没戴的日子没有记录）'}</div>`;
  const vs=series.map(p=>p.v);
  let lo=Math.min(...vs),hi=Math.max(...vs);
  if(o.min!=null)lo=Math.min(lo,o.min);
  if(o.max!=null)hi=Math.max(hi,o.max);
  if(hi===lo){hi+=1;lo-=1;}
  const pad=(hi-lo)*.12; lo-=pad; hi+=pad;
  const t0=new Date(series[0].d).getTime(),t1=new Date(series[n-1].d).getTime();
  const x=d=>PL+(t1===t0?(W-PL-PR)/2:(new Date(d).getTime()-t0)/(t1-t0)*(W-PL-PR));
  const y=v=>PT+(hi-v)/(hi-lo)*(H-PT-PB);
  const col=o.color||'var(--gold)';
  const segs=hmSegs(series);
  const roll=o.roll?hmRoll(series,o.roll):null;
  const line=segs.map(s=>`<polyline points="${s.map(p=>`${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ')}"
    fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
  const area=segs.map(s=>`<polygon points="${PL},${y(lo).toFixed(1)} ${s.map(p=>`${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ')} ${x(s[s.length-1].d).toFixed(1)},${y(lo).toFixed(1)}"
    fill="${col}" fill-opacity=".09"/>`).join('');
  let rollLine='';
  if(roll){
    const rsegs=[];let cur=[];
    series.forEach((p,i)=>{ if(roll[i]!=null){cur.push(i);} else if(cur.length){rsegs.push(cur);cur=[];} });
    if(cur.length)rsegs.push(cur);
    rollLine=rsegs.map(is=>`<polyline points="${is.map(i=>`${x(series[i].d).toFixed(1)},${y(roll[i]).toFixed(1)}`).join(' ')}"
      fill="none" stroke="var(--ink3)" stroke-width="1" stroke-dasharray="3 2.5" opacity=".65"/>`).join('');
  }
  const yv=[hi,(hi+lo)/2,lo];
  const grid=yv.map(v=>`<line x1="${PL}" y1="${y(v).toFixed(1)}" x2="${W-PR}" y2="${y(v).toFixed(1)}" class="dgrid"/>
    <text x="${PL-5}" y="${(y(v)+2.6).toFixed(1)}" class="daxl" text-anchor="end">${o.yfmt?o.yfmt(v):(Math.round(v*10)/10)}</text>`).join('');
  const dots=series.map((p,i)=>`<circle cx="${x(p.d).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2.3"
    fill="${col}" class="hmdot" onclick="hmTip('${o.tip||'hm'}','${p.d}',${p.v},${roll&&roll[i]!=null?roll[i].toFixed(1):'null'},'${o.label||''}','${o.unit||''}')"/>`).join('');
  const xl=`<text x="${PL}" y="${H-6}" class="daxl">${series[0].d.slice(5).replace('-','/')}</text>
    <text x="${W-PR}" y="${H-6}" class="daxl" text-anchor="end">${series[n-1].d.slice(5).replace('-','/')}</text>`;
  return `<div class="hmchart"><div class="hmtip" id="tip-${o.tip||'hm'}"></div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
      ${grid}${area}${line}${rollLine}${dots}${xl}
    </svg></div>`;
}
function hmTip(id,d,v,roll,label,unit){
  const t=document.getElementById('tip-'+id); if(!t)return;
  const m=HM_METRICS[Object.keys(HM_METRICS).find(k=>HM_METRICS[k].name===label)]||null;
  const dec=m?m.dec:0;
  t.innerHTML=`${d.slice(5).replace('-',' 月 ')} 日 · ${label||''} <b>${dec?v.toFixed(dec):Math.round(v)}</b>${unit?' '+unit:''}`+
    (roll!=='null'?`<br><span style="color:var(--ink3)">附近日均 ${roll}${unit?' '+unit:''}</span>`:'');
  t.classList.add('on');
}
/* ── 首页「今日身体」卡 ── */
function hmHomeCard(){
  const days=hmDays(); if(!days.length) return '';
  const last=days[days.length-1];
  /* 三格大数字：静息心率 / HRV / 血氧，各自取最近 30 天内有值的一天 */
  const cells=['rhr','hrv','spo2'].map(k=>{
    const m=HM_METRICS[k], arr=hmSeries(k,30);
    if(!arr.length) return '';
    const p=arr[arr.length-1], d7=hmDelta(arr,7);
    let dh='<div class="hd">近 7 天样本不足</div>';
    if(d7){
      const diff=d7.now-d7.prev, same=Math.abs(diff)<(m.dec?0.05:0.5);
      const better=m.better==='low'?diff<0:diff>0;
      /* 对照窗就是紧邻的前 7 天 → 不用说日期；跨了缺口找回来的 → 把对比日期摆出来，
         不然"跟 9 月中旬比"会被读成"跟上周比"（阿成对口径很敏感） */
      const near=ymd(new Date(Date.now()-8*864e5));
      const vs=`近 7 天 ${hmFmt(k,d7.now)}${same?' · <b class="eq">基本持平</b>':
        ` · <b class="${better?'up':'dn'}">${diff>0?'↑':'↓'}${Math.abs(diff).toFixed(m.dec)}</b>`}`;
      const from=d7.winLast<near?` <span style="opacity:.8">较 ${d7.winLast.slice(5).replace('-','/')} 周</span>`:'';
      dh=`<div class="hd">${vs}${from}</div>`;
    }
    return `<div class="hc"><div class="hl">${m.icon} ${m.name}</div>
      <div class="hv">${hmFmt(k,p.v)}<u>${m.unit}</u></div>${dh}</div>`;
  }).filter(Boolean).join('');
  /* 活动四项：取最近一个有步数的日子（通常就是同一天） */
  let act=null;
  for(let i=days.length-1;i>=0;i--){ if(days[i].steps!=null){act=days[i];break;} }
  const actHtml=act?`<div class="hmact">
      ${[['步数',fmtNum(act.steps)],
         ['锻炼分钟',act.exmin!=null?act.exmin:'—'],
         ['站立小时',act.stand!=null?act.stand:'—'],
         ['爬楼层数',act.flights!=null?act.flights:'—']]
        .map(a=>`<div class="ac"><b>${a[1]}</b><span>${a[0]}</span></div>`).join('')}
    </div>`:'';
  const spark=hmSparkHTML();
  const gap=hmGapNote();
  return `<div class="sec"><div class="sectt"><i></i><b>今日身体</b><span>最近一次 ${last.d.slice(5).replace('-','/')} · 点开看全部</span></div>
    <div class="card block tap" onclick="hmSheet()">
      <div style="display:flex;align-items:baseline;justify-content:space-between">
        <div style="font-size:10.5px;color:var(--ink3);letter-spacing:.5px">静息心率 · HRV · 血氧</div>
        <div style="font-size:9.5px;color:var(--gold);font-weight:600">更多指标 ▸</div></div>
      <div class="hmgrid" style="grid-template-columns:repeat(${cells.split('<div class="hc">').length-1||1},1fr)">${cells}</div>
      ${actHtml}
      ${spark}
      <div class="cap">点开看任意指标 · 30/90 天趋势与对比${gap?' · '+gap:''}</div>
    </div></div>`;
}
/* 首页卡里的 14 天迷你趋势（可切 静息心率/HRV/血氧） */
function hmSparkHTML(){
  const k=ST.hmKey||'rhr', m=HM_METRICS[k];
  const chips=['rhr','hrv','spo2'].map(c=>`<button class="${c===k?'on':''}"
     onclick="event.stopPropagation();ST.hmKey='${c}';hmSparkRepaint()">${HM_METRICS[c].name}</button>`).join('');
  const arr=hmSeries(k,14);
  let body;
  if(arr.length<2){ body='<div class="cap">近两周数据不足</div>'; }
  else{
    /* PT 留 14：最右那天的数值标签要写在点上方，顶部不留白会被 SVG 边界裁掉半个字
       PR 留 18：最后一个点往左让开，标签才不会压在折线尾巴上（2026-10-21 阿成圈图）*/
    const W=342,H=50,PL=4,PR=18,PT=14,PB=8;
    const vs=arr.map(p=>p.v); let lo=Math.min(...vs),hi=Math.max(...vs);
    if(hi===lo){hi+=1;lo-=1;}
    const t0=new Date(arr[0].d).getTime(),t1=new Date(arr[arr.length-1].d).getTime();
    const x=d=>PL+(new Date(d).getTime()-t0)/((t1-t0)||1)*(W-PL-PR);
    const y=v=>PT+(hi-v)/(hi-lo)*(H-PT-PB);
    const lines=hmSegs(arr).map(s=>`<polyline points="${s.map(p=>`${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ')}"
      fill="none" stroke="var(--gold)" stroke-width="1.7" stroke-linejoin="round"/>`).join('');
    const lastP=arr[arr.length-1];
    /* 标签纵向夹住：点越靠顶，标签越贴近点，但不许越过上边界（9px 字至少要 12 的基线）*/
    const labY=Math.min(Math.max(y(lastP.v)-4.5,12),H-PB-2);
    body=`<div class="hmchart"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
        ${hmSegs(arr).map(s=>`<polygon points="${PL},${H-PB} ${s.map(p=>`${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ')} ${x(s[s.length-1].d).toFixed(1)},${H-PB}" fill="var(--gold)" fill-opacity=".10"/>`).join('')}
        ${lines}
        ${arr.map(p=>`<circle cx="${x(p.d).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="1.9" fill="var(--gold)"/>`).join('')}
        <text x="${W-2}" y="${labY.toFixed(1)}" class="daxl" text-anchor="end"
          style="fill:var(--gold);font-weight:700;font-size:9px">${hmFmt(k,lastP.v)}</text>
      </svg></div>
      <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--ink3);margin-top:2px">
        <span>${arr[0].d.slice(5).replace('-','/')}</span><span>${m.name}</span>
        <span>${arr[arr.length-1].d.slice(5).replace('-','/')}</span></div>`;
  }
  return `<div class="hmspark"><div class="hmchips">${chips}</div>${body}</div>`;
}

  const roll=arr.length>10?3:0;

  const st=arr.length?{avg:hmAvg(arr),min:Math.min(...arr.map(p=>p.v)),max:Math.max(...arr.map(p=>p.v))}:null;
  const d30=hmDelta(hmSeries(k,0),30);

/* 数据覆盖说明（缺口 >10 天才提，鸡毛缺口不说） */
function hmGapNote(full){
  const days=hmDays(); if(days.length<2) return '';
  let worst=0,wa='',wb='';
  for(let i=1;i<days.length;i++){
    const g=(new Date(days[i].d)-new Date(days[i-1].d))/864e5;
    if(g>worst){worst=g;wa=days[i-1].d;wb=days[i].d;}
  }
  if(worst<=10) return '';
  const fmt=d=>d.slice(5).replace('-','/');
  return full?`最长缺口 ${Math.round(worst)} 天（${fmt(wa)} → ${fmt(wb)}），期间没有身体数据`
    :`最长缺口 ${Math.round(worst)} 天`;
}
/* ── 记录页 detailDay：当天身体数据 ── */
function hmDayBlock(ds){
  const row=hmByDate()[ds]; if(!row) return '';
  const items=[];
  const push=(l,v,u)=>{if(v!=null)items.push([l,typeof v==='number'&&v>=1000?fmtNum(v):v,u||''])};
  push('步数',row.steps,'步'); push('活动千卡',row.kcal,'kcal');
  push('步行+跑步',row.dist,'km'); push('站立',row.stand,'小时');
  push('锻炼',row.exmin,'分钟'); push('爬楼',row.flights,'层');
  push('日照',row.dl,'分钟'); push('静息心率',row.rhr,'bpm');
  push('HRV',row.hrv,'ms'); push('血氧',row.spo2,'%');
  push('呼吸率',row.rr,'次/分'); push('VO₂Max',row.vo2,'');
  if(!items.length) return '';
  return `<div class="sh2">当天身体数据</div>
    <div class="hmact hmday">${items.map(a=>`<div class="ac"><b>${a[1]}${a[2]?`<u style="text-decoration:none;font-size:9px;font-weight:600;color:var(--ink2);margin-left:2px">${a[2]}</u>`:''}</b><span>${a[0]}</span></div>`).join('')}</div>
    <div class="cap">来自 Apple Watch 当天记录 · 手表没戴的项目没有数据</div>`;
}
/* 对照窗的口径说法：紧邻的前一窗 → "再前 N 天"；跨缺口找回的 → 把日期摆出来 */
function hmWinLabel(d,days){
  const near=ymd(new Date(Date.now()-(days+1)*864e5));
  return d.winLast>=near?'再前 '+days+' 天':d.winLast.slice(5).replace('-','/')+' 前 '+days+' 天';
}
/* ── 建议页：恢复趋势 ── */
function hmTrendSec(){
  if(!hmDays().length) return '';
  const rhr=hmSeries('rhr',90), hrv=hmSeries('hrv',90), vo2=hmSeries('vo2',90);
  const dR=hmDelta(hmSeries('rhr',0),30), dH=hmDelta(hmSeries('hrv',0),30);
  const ks=hmDays(); const cov=`${ks[0].d.slice(2).replace('-','/')} ~ ${ks[ks.length-1].d.slice(2).replace('-','/')} 共 ${ks.length} 天`;
  /* VO2Max 卡：最新值 + 区间首末变化 */
  let vo2Card='';
  if(vo2.length){
    const f=vo2[0],l=vo2[vo2.length-1],chg=(l.v-f.v);
    vo2Card=`<div class="card block">
      <div class="srow2"><b>最近一次 VO₂Max</b><span>${l.v.toFixed(1)} · ${l.d.slice(5).replace('-','/')}</span></div>
      <div class="srow2"><b>近 90 天测量</b><span>${vo2.length} 次（只在户外走/跑后更新）</span></div>
      <div class="srow2"><b>区间变化</b><span>${f.v.toFixed(1)}（${f.d.slice(5).replace('-','/')}）→ ${l.v.toFixed(1)}，
        <b style="color:${chg>=0?'var(--green)':'var(--warn)'}">${chg>=0?'+':''}${chg.toFixed(1)}</b></span></div>
      <div class="cap">最大摄氧量是有氧体能的硬指标；按你近 90 天的记录在${chg>=0?'上升':'下降'}。</div></div>`;
  }
  /* 自动建议：两个指标都够才下结论，只有一个就说一个 */
  let adv='';
  if(dR&&dH){
    const rImp=dR.now<dR.prev, hImp=dH.now>dH.prev;
    const rTxt=`最近 30 天静息心率平均 ${dR.now.toFixed(1)} bpm（${hmWinLabel(dR,30)} ${dR.prev.toFixed(1)}）`;
    const hTxt=`HRV 平均 ${dH.now.toFixed(1)} ms（${hmWinLabel(dH,30)} ${dH.prev.toFixed(1)}）`;
    if(rImp&&hImp) adv=['a3','p2','恢复正在变好',
      `${rTxt}，${hTxt} —— 一个往下、一个往上，都是恢复能力改善的方向。`,
      ['这个趋势下可以适度加一点量，但每周增幅别超 10%','加量优先加在轻松跑（Z2），别先加强度','继续保证睡眠，恢复是练出来的也是睡出来的']];
    else if(!rImp&&!hImp) adv=['a1','p2','恢复压力在变大，注意减压',
      `${rTxt}，${hTxt}。两个指标同向走差，通常是疲劳在累积。`,
      ['接下来 3~5 天把强度课停一停，只留轻松活动','每晚多睡 30~60 分钟，比加练一次值钱','如果伴随"抬手没劲"或持续疲惫，先停练两天看看']];
    else adv=['a2','p3','恢复指标一升一降，先观望',
      `${rTxt}，${hTxt}，方向不一致。单日波动受喝水、酒精、熬夜、生病影响很大，别凭一两天下结论。`,
      ['连续看 7 天再判断趋势','训练量维持现状，不加不减','把每天的静息心率记在同一时间看，可比性更高']];
  } else if(dR) adv=['a2','p3','静息心率趋势',
    `最近 30 天平均 ${dR.now.toFixed(1)} bpm，${hmWinLabel(dR,30)} ${dR.prev.toFixed(1)}。${dR.now<dR.prev?'往下走是恢复改善的信号。':'往上走要注意是不是疲劳或没睡够。'}`,
    ['连续记录 7 天以上再看趋势，单日意义不大']];
  const advCard=adv?`<div class="abox ${adv[0]}">
      <div class="ah"><span class="pri ${adv[1]}">${adv[1].toUpperCase()}</span><b>${adv[2]}</b></div>
      <div class="why">${adv[3]}</div>
      <div class="do"><div class="dt">怎么做</div>${adv[4].map(x=>`<li>${x}</li>`).join('')}</div></div>`:'';
  return `<div class="sec"><div class="shead"><span class="tt">恢复趋势</span><span class="en2">Recovery</span><span class="ln"></span></div>
    <div class="card block">
      <div style="font-size:11.5px;color:var(--ink2);line-height:1.65">
        静息心率和 HRV 是恢复的两个硬指标：<b style="color:var(--gold)">静息心率越低越好，HRV 越高越好</b>。
        下面两条线是近 90 天的真实记录，虚线是附近 7 日均值。</div>
      <div style="margin-top:12px">${hmLineSVG(rhr,{roll:3,tip:'rhr',label:'静息心率',unit:'bpm',h:126,color:'var(--heart)'})}</div>
      <div style="margin-top:14px">${hmLineSVG(hrv,{roll:3,tip:'hrv',label:'HRV',unit:'ms',h:126,color:'var(--lift)'})}</div>
      <div class="cap">${dR?`静息心率：最近 30 天平均 ${dR.now.toFixed(1)} bpm，${hmWinLabel(dR,30)} ${dR.prev.toFixed(1)}。`:''}
        ${dH?`HRV：最近 30 天平均 ${dH.now.toFixed(1)} ms，${hmWinLabel(dH,30)} ${dH.prev.toFixed(1)}。`:''}</div>
    </div>
    ${vo2Card?`<div class="sec" style="margin-top:14px"><div class="card block">${vo2Card}</div></div>`:''}
    ${advCard?`<div style="margin-top:14px">${advCard}</div>`:''}
    <div class="cap" style="margin-top:12px">数据覆盖 ${cov}：2025-01 ~ 2026-09 来自 Apple Health 全量导出，2026-10 来自手机每日自动导出。
      手表没戴 / 没导出的日子没有数据，图上留空。睡眠数据按你的要求未纳入。</div></div>`;
}
