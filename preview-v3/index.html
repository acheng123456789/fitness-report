<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>我的运动报告</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的运动报告">
<meta name="application-name" content="我的运动报告">
<meta name="theme-color" content="#F3F3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07090C" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F3F3F1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="shortcut icon" href="favicon.png">
<style>
:root{
  --bg:#EFEEEA; --bg2:#E6E4DE; --card:#FFFFFF; --emb:#FAF9F6;
  --line:rgba(23,26,32,.11); --line2:rgba(23,26,32,.06);
  /* --ink3 原来是 #7A8290，在浅色底上对比度只有 3.5:1（小字要 4.5:1 才够清）。
     调到 #656E7C 后是 4.7:1，视觉上几乎看不出差别，但说明文字清楚多了。 */
  --ink:#101318; --ink2:#4E5766; --ink3:#656E7C;
  --gold:#90702F; --run:#2263C4; --lift:#6B33D6; --green:#0F7A52; --warn:#B4622C;
  /* --heart：心率♥专用色。跟 --warn 的橙分开，红色更像"心跳"，也一眼能和蓝色配速区分开。 */
  --heart:#C6364F;
  --grid:rgba(23,26,32,.07); --hl:rgba(255,255,255,.9); --bar:rgba(250,249,246,.92);
  --tear:#DED9CA; --tearHi:#EBE7DB;
  --sh:0 1px 2px rgba(20,23,28,.04),0 6px 18px rgba(20,23,28,.05);
}
body.dk{
  --bg:#0A0C10; --bg2:#0E1218; --card:#141822; --emb:#10141C;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.05);
  --ink:#F0F2F5; --ink2:#A3ACB9; --ink3:#7C8593;
  --gold:#D2B571; --run:#68A4FF; --lift:#AF92F7; --green:#4BD6A0; --warn:#E9AC66;
  --heart:#FF7B8C;
  --grid:rgba(255,255,255,.06); --hl:rgba(255,255,255,.07); --bar:rgba(16,20,28,.92);
  --tear:rgba(255,255,255,.16); --tearHi:rgba(255,255,255,.28);
  --sh:0 1px 0 var(--hl) inset,0 8px 26px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;
  font-feature-settings:"tnum";-webkit-font-smoothing:antialiased;
  overscroll-behavior-x:none;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));transition:background .3s,color .3s}
.wrap{max-width:430px;margin:0 auto;padding:0 16px}

/* 封面 */
.cover{background:linear-gradient(165deg,var(--bg2),var(--bg) 62%);
  padding:calc(22px + env(safe-area-inset-top)) 20px 0;position:relative;overflow:hidden}
.cover:after{content:"";position:absolute;right:-46px;top:-34px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle,rgba(200,169,106,.18),transparent 70%);pointer-events:none}
.topbar{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.brand{font-size:10px;letter-spacing:2.6px;color:var(--gold);font-weight:700;cursor:pointer}
.sw{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--card);
  -webkit-tap-highlight-color:transparent}
.sw button{border:0;background:transparent;color:var(--ink3);font-size:11px;padding:6px 11px;cursor:pointer;
  font-family:inherit;white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:color .2s}
.sw button:not(.on):active{color:var(--ink)}
.sw button.on{background:var(--gold);color:#fff;font-weight:600}
.dk .sw button.on{color:#171102}
.month{font-size:13px;font-weight:400;letter-spacing:6px;color:var(--gold);margin:20px 0 3px}
.title{font-size:28px;font-weight:600;letter-spacing:-.5px}
.en{font-size:9.5px;letter-spacing:2.2px;color:var(--ink3);margin-top:7px;text-transform:uppercase}
.sub{font-size:11px;color:var(--ink3);margin-top:5px}
.rline{height:1px;background:linear-gradient(90deg,var(--gold),transparent 78%);margin-top:16px}
/* 首页数据来源小标 */
.srcpill{display:inline-block;margin-top:11px;font-size:9.5px;letter-spacing:.8px;color:var(--gold);
  border:1px solid var(--gold);border-radius:99px;padding:3px 10px;background:var(--card);
  box-shadow:0 1px 0 var(--hl) inset}
/* 建议页优先级标签 */
.pri{font-size:9px;font-weight:700;letter-spacing:1px;padding:2px 7px;border-radius:5px;color:#fff}
.pri.p1{background:#C0392B}.pri.p2{background:var(--warn)}.pri.p3{background:var(--ink3)}
.advcard{border-left:3px solid var(--gold)}
.advcard.a1{border-left-color:#C0392B}.advcard.a2{border-left-color:var(--warn)}
/* 封面：细斜纹肌理 + 本周节奏条 */
.cover:before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(118deg,rgba(120,120,120,.045) 0 1px,transparent 1px 10px)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:14px;position:relative;z-index:2}
.wk .wl{font-size:8.5px;color:var(--ink3);text-align:center;margin-bottom:4px;letter-spacing:.3px}
.wk .wd2{height:24px;border-radius:6px;background:var(--emb);border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--ink3);
  box-shadow:0 1px 0 var(--hl) inset}
.wk .wd2.on{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
.dk .wk .wd2.on{color:#171102}
.wk .wd2.today{box-shadow:0 0 0 1.4px var(--gold) inset}
.wkt{display:flex;align-items:center;justify-content:space-between;margin-top:14px;position:relative;z-index:2}
.wkt span{font-size:9px;letter-spacing:1.4px;color:var(--ink3)}
.wkt em{font-style:normal;font-size:9.5px;color:var(--gold);font-weight:600}
/* 台历：顶部撕痕 + 装订环 */
.teartop{height:8px;margin:-14px -14px 12px;position:relative;overflow:hidden}
.teartop:before{content:"";position:absolute;left:0;right:0;top:0;height:8px;
  background:linear-gradient(180deg,rgba(0,0,0,.13),transparent);
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 3px,transparent 3px 6px);
  mask:repeating-linear-gradient(90deg,#000 0 3px,transparent 3px 6px)}
.bind{display:flex;justify-content:center;gap:26px;margin:-6px 0 8px}
.bind i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--gold);
  background:var(--bg2);box-shadow:0 1px 2px rgba(0,0,0,.22)}
/* 无氧：个人最佳榜 */
.pr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.pr:last-child{border:0}
.pr .rk{flex:none;width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;background:var(--emb);color:var(--ink3);border:1px solid var(--line2)}
.pr.top .rk{background:var(--gold);color:#fff;border-color:var(--gold)}
.dk .pr.top .rk{color:#171102}
.pr .mid{flex:1;min-width:0}
.pr .mid b{font-size:12.5px;font-weight:600}
.pr .mid .meta{font-size:9.5px;color:var(--ink3);margin-top:3px}
.pr .vv{flex:none;text-align:right}
.pr .vv b{font-size:15px;font-weight:600;font-family:ui-monospace,Menlo,monospace}
.pr .vv b u{text-decoration:none;font-size:10px;color:var(--ink2);font-family:-apple-system,"PingFang SC",sans-serif}
.pr .vv span{display:block;font-size:9px;color:var(--ink3);margin-top:2px;font-family:ui-monospace,Menlo,monospace}
/* 建议页 */
.abox{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);
  padding:14px;margin-bottom:10px;border-left:3px solid var(--gold)}
body.dk .abox{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012)),var(--card)}
.abox.a1{border-left-color:#C0392B}.abox.a2{border-left-color:var(--warn)}.abox.a3{border-left-color:var(--ink3)}
.abox .ah{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.abox .ah b{font-size:13px;font-weight:600;letter-spacing:.2px}
.abox .why{font-size:11px;line-height:1.65;color:var(--ink2);margin-top:2px}
.abox .do{margin-top:9px;background:var(--emb);border-radius:8px;padding:9px 11px}
body.dk .abox .do{background:rgba(255,255,255,.04)}
.abox .do .dt{font-size:9px;font-weight:700;letter-spacing:1.4px;color:var(--gold);margin-bottom:5px}
.abox .do li{list-style:none;font-size:11.5px;line-height:1.65;color:var(--ink);padding:2px 0 2px 13px;position:relative}
.abox .do li:before{content:"";position:absolute;left:0;top:10px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.hrzone{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:10px 0 6px}
.hrzone i{display:block;height:100%}
.hrlg{display:flex;gap:10px;flex-wrap:wrap;font-size:9px;color:var(--ink2)}
.hrlg span i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px;vertical-align:-1px}
/* ═══ v2：去报告化 ═══
   ① 隐藏区块序号 01/02/03 和英文小标题 —— 这是"读报告"最大的来源
   ② 标题放大、留白收紧，数字成为视觉主体 */
.shead .no,.shead .en2{display:none}
.shead{margin-bottom:12px}
.shead .tt{font-size:17px;font-weight:700;letter-spacing:-.2px}
.sec{margin-top:28px}

/* 精简页头：不再有巨大的月份字距 + 英文副标题 + 金色装饰圆 */
.cover{padding-top:calc(16px + env(safe-area-inset-top))}
.cover:after{display:none}
.cover:before{background:repeating-linear-gradient(118deg,rgba(120,120,120,.03) 0 1px,transparent 1px 12px)}
.month{font-size:11px;letter-spacing:1.2px;margin:14px 0 2px;font-weight:600}
.title{font-size:24px;font-weight:700;letter-spacing:-.6px}
.en{display:none}
.sub{font-size:11.5px;color:var(--ink3);margin-top:6px;line-height:1.5}
.rline{background:var(--line);margin-top:14px}

/* 首页看板 —— 唯一没有编号、没有卡套的大数字区 */
.hero{padding:20px 18px 18px}
.hero .hlabel{font-size:11px;color:var(--ink3);letter-spacing:.6px}
.hero .hbig{font-size:52px;font-weight:700;letter-spacing:-2.4px;line-height:1;margin-top:6px;
  display:flex;align-items:baseline;gap:7px}
.hero .hbig u{text-decoration:none;font-size:17px;font-weight:600;color:var(--ink2);letter-spacing:0}
.hero .hsub{font-size:11.5px;color:var(--ink3);margin-top:9px;line-height:1.5}
/* 环比：涨绿跌红（中国用户习惯之外？——训练量涨是好事，用金色；下降用红）*/
.delta{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;
  padding:3px 8px;border-radius:99px;margin-left:6px;vertical-align:middle;letter-spacing:0}
.delta.up{background:rgba(200,169,106,.16);color:var(--gold)}
.delta.dn{background:rgba(196,54,79,.13);color:var(--heart)}

/* 近 6 个月训练量柱状趋势 */
.trend{display:flex;align-items:flex-end;gap:8px;height:104px;margin-top:18px;padding-top:6px;
  border-top:1px solid var(--line2)}
.trend .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.trend .tb i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--line);
  min-height:4px;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.trend .tb.on i{background:var(--gold)}
.trend .tb em{font-style:normal;font-size:9.5px;color:var(--ink3);letter-spacing:0}
.trend .tb.on em{color:var(--gold);font-weight:600}
.trend .tb b{font-style:normal;font-size:9.5px;color:var(--ink3);font-weight:600;letter-spacing:0}
.trend .tb.on b{color:var(--ink)}

/* 目标进度条（体重） */
.prog{height:8px;border-radius:5px;background:var(--line2);overflow:hidden;margin-top:12px;position:relative}
.prog i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--gold),var(--warn))}
.prog u{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink2);border-radius:1px;
  text-decoration:none}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--ink3);margin-top:8px}

/* 信号卡（身体提醒）：左侧一条色带，不用图标 */
.sig{display:flex;gap:12px;padding:14px 15px;border-radius:14px;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--sh);align-items:flex-start}
.sig .bar{flex:none;width:3px;align-self:stretch;border-radius:2px;background:var(--warn);min-height:34px}
.sig.crit .bar{background:#C0392B}
.sig .bd{flex:1;min-width:0}
.sig .bd b{font-size:14.5px;font-weight:600;display:block}
.sig .bd p{font-size:11.5px;color:var(--ink2);margin-top:5px;line-height:1.6}
.sig .bd .mt{font-size:10.5px;color:var(--ink3);margin-top:6px}

/* 行列表：替代"点卡片进二级页"的大入口卡 */
.rows{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.rows .rw{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line2);
  transition:background .15s;position:relative}
.rows .rw:last-child{border-bottom:0}
.rows .rw:active{background:var(--emb)}
.rows .rw .tx{flex:1;min-width:0}
.rows .rw .tx b{font-size:14px;font-weight:600;display:block}
.rows .rw .tx span{font-size:10.5px;color:var(--ink3);margin-top:2px;display:block}
.rows .rw .vv{font-size:14px;font-weight:600;color:var(--gold);font-family:ui-monospace,Menlo,monospace;flex:none}
.rows .rw .go{flex:none;width:7px;height:7px;border-top:1.5px solid var(--ink3);border-right:1.5px solid var(--ink3);
  transform:rotate(45deg);opacity:.5}

/* 首页快捷入口：从"6 张大卡"改成"一个紧凑的两列小图标行" */
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qgrid a{display:block;text-decoration:none;color:inherit;text-align:center;padding:11px 2px;
  border-radius:12px;background:var(--card);border:1px solid var(--line)}
.qgrid a:active{background:var(--emb);transform:scale(.96)}
.qgrid .qi{font-size:16px;line-height:1;margin-bottom:6px}
.qgrid .qs{font-size:10px;color:var(--ink2);letter-spacing:.2px}

/* 段内小标题（替代 .shead 的定位：区块内再分组时用） */
.mini{font-size:11px;color:var(--ink3);letter-spacing:.4px;margin:16px 0 8px;display:flex;
  align-items:center;gap:7px}
.mini:after{content:"";flex:1;height:1px;background:var(--line2)}

/* 记录页顶部的 日历/列表 切换（底栏已无日历 tab，日历在这里） */
.segbar{display:flex;background:var(--line2);border-radius:10px;padding:3px;gap:3px}
.segbar button{flex:1;border:0;background:transparent;font-family:inherit;font-size:12.5px;
  font-weight:600;color:var(--ink3);padding:8px 0;border-radius:8px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background .18s,color .18s}
.segbar button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,23,28,.09)}
body.dk .segbar button.on{background:var(--card);box-shadow:0 1px 0 var(--hl) inset,0 2px 8px rgba(0,0,0,.35)}

/* ══════════════════════════════════════════════════════════
   v3 图表系统 —— 四个图，统一「点一下联动、再点取消」的交互
   核心约定：所有图表的选中态存在 ST 里（pick），重渲染后还在，
   这样点柱子→下面明细变→再点别处才切换，不会闪回。
   ══════════════════════════════════════════════════════════ */

/* 图表通用容器 */
.chart{margin-top:14px;position:relative;-webkit-user-select:none;user-select:none}
.chart svg{display:block;width:100%;overflow:visible}
.chart svg *{-webkit-tap-highlight-color:transparent}

/* 可点元素的通用反馈：默认实心，hover/按下变虚线描边 */
.hit{cursor:pointer;transition:opacity .16s}
.hit:active{opacity:.55}
.dim{opacity:.26}

/* ① 月度堆叠柱
   ⚠️ 踩过的坑：.mstack 不能写 flex:1 —— flex:1 即 flex-basis:0，
   内联 style="height:X%" 在 flex 列容器里会被完全忽略，柱子容器永远撑满整列高，
   选中态的 box-shadow 就变成一根全高的金框（柱子很短、框很高，非常丑）。
   正确做法：外层 .mzone 用 flex:1 吃掉剩余空间并给出确定高度，
   .mstack 不设 flex，让 height:% 相对 .mzone 生效，金框才能紧贴柱子。 */
.mbar{display:flex;align-items:flex-end;gap:7px;height:132px}
.mbar .mg{flex:1;display:flex;flex-direction:column;height:100%;min-width:0}
.mbar .mtop{height:15px;flex:none;font-size:9.5px;font-weight:700;color:var(--gold);text-align:center;
  font-family:ui-monospace,Menlo,monospace}
.mbar .mzone{flex:1;display:flex;flex-direction:column;justify-content:flex-end;min-height:0}
.mbar .mstack{display:flex;flex-direction:column;justify-content:flex-end;gap:1.5px;
  border-radius:5px 5px 2px 2px;overflow:hidden;position:relative}
.mbar .mstack i{display:block;width:100%;transition:height .55s cubic-bezier(.2,.8,.2,1);min-height:2px}
.mbar .mlab{font-size:9px;color:var(--ink3);text-align:center;margin-top:6px;flex:none;letter-spacing:-.2px}
.mbar .mg.on .mlab{color:var(--gold);font-weight:700}
.mbar .mg.on .mstack{box-shadow:0 0 0 1.6px var(--gold),0 0 0 4px color-mix(in srgb,var(--gold) 18%,transparent)}

/* 图例：点它可以只看某一类。四列网格（7 项 = 两行），紧凑到不抢主体的视觉重量。 */
.legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:11px;
  font-size:9.5px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:4px;padding:4px 5px;border-radius:7px;
  border:1px solid var(--line2);transition:opacity .16s,border-color .16s,background .16s;
  min-width:0;cursor:pointer}
.legend span i{width:7px;height:7px;border-radius:2px;flex:none;display:block}
.legend span b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend span.off{opacity:.3;text-decoration:line-through}
.legend span:active{background:var(--emb);border-color:var(--line)}
/* 聚焦态：点中的那类描金边，其余变灰但仍可点（点了就切换过去） */
.legend span.on{border-color:var(--gold);color:var(--ink);
  background:color-mix(in srgb,var(--gold) 13%,transparent);font-weight:600}
.legend span.dim{opacity:.42}
.legend .allchip{border-color:var(--gold);color:var(--gold);font-weight:700}
.legend.ro{pointer-events:none}

/* 联动明细条 */
.pick{display:flex;align-items:center;gap:10px;margin-top:14px;padding:11px 13px;border-radius:12px;
  background:var(--emb);border:1px solid var(--line2);transition:opacity .2s}
body.dk .pick{background:rgba(255,255,255,.045)}
.pick .pk-t{font-size:12.5px;font-weight:600;flex:none}
.pick .pk-s{font-size:10.5px;color:var(--ink3);flex:1;min-width:0;line-height:1.45}
.pick .pk-x{flex:none;font-size:17px;color:var(--ink3);width:24px;height:24px;display:flex;
  align-items:center;justify-content:center;border-radius:50%;background:var(--line2);font-size:13px}

/* ② 训练热力图
   ⚠️ 别用 aspect-ratio:1 —— 7 列平分 330pt 宽，每格会到 50px，
   6 周就313px 高、整张卡 496px，占掉两屏多。改成固定 30px 方格才紧凑。 */
/* ② 训练热力图（真日历版：一周一行，一格一天，格内上行日期、下行分钟数）
   阿成 2026-10-16 反馈原版"一堆色块方框看不懂、不知道对应哪天、底部七八九十月标签对不上"，
   所以：每格自带日期数字，跨月处显示"月/日"，底部月份标签行删掉。 */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.heat .hc{height:38px;border-radius:6px;background:var(--emb);border:1px solid var(--line2);
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;color:var(--ink3);cursor:pointer;
  transition:transform .14s,box-shadow .14s,background .16s}
.heat .hc .d{font-size:8.5px;line-height:1;font-style:normal;opacity:.8}
.heat .hc .m{font-size:10.5px;line-height:1;font-weight:700;text-decoration:none;
  font-family:ui-monospace,Menlo,monospace}
.heat .hc.l1{background:color-mix(in srgb,var(--gold) 20%,var(--emb));color:var(--ink2)}
.heat .hc.l2{background:color-mix(in srgb,var(--gold) 40%,var(--emb));color:var(--ink)}
.heat .hc.l3{background:color-mix(in srgb,var(--gold) 68%,var(--emb));color:#fff}
.heat .hc.l4{background:var(--gold);color:#171102}
body.dk .heat .hc.l3,body.dk .heat .hc.l4{color:#171102}
.heat .hc.fut{opacity:.35;pointer-events:none}
.heat .hc.tdy{border-color:var(--run);box-shadow:0 0 0 1.6px var(--run) inset}
.heat .hc.on{transform:scale(1.1);box-shadow:0 0 0 2px var(--ink) inset,0 2px 8px rgba(0,0,0,.25);z-index:2}
.heat .hc:active{transform:scale(.92)}
.heatwk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}
.heatwk div{text-align:center;font-size:8.5px;color:var(--ink3)}

/* ③ 跑步配速折线（v4 单轴，v3 双轴已砍） */
.dual{position:relative}
.dual .tipbox{position:absolute;top:0;left:0;right:0;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;font-size:10.5px;box-shadow:var(--sh);z-index:5;
  pointer-events:none;opacity:0;transition:opacity .15s;line-height:1.55}
.dual .tipbox.on{opacity:1}
.dual .tipbox b{font-size:12px;font-weight:700}
.dgrid{stroke:var(--grid);stroke-width:1}
.daxl{font-size:8px;fill:var(--ink3);font-family:ui-monospace,Menlo,monospace}
.dfast{font-size:8.5px;fill:var(--gold);font-weight:700}
.ddot{transition:r .16s,opacity .16s;cursor:pointer}
.ddot:hover{filter:brightness(1.1)}

/* ④ 体重双线 */
.wl2 .tipbox{position:absolute;top:0;left:0;right:0;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;font-size:10.5px;box-shadow:var(--sh);z-index:5;
  pointer-events:none;opacity:0;transition:opacity .15s;line-height:1.55}
.wl2 .tipbox.on{opacity:1}
.wdot{transition:r .16s,opacity .16s;cursor:pointer}
.wline{fill:none;stroke-linejoin:round;stroke-linecap:round}

/* 图表里的小按钮（展开/收起） */
.minibtn{flex:none;border:1px solid var(--line);background:var(--emb);color:var(--ink2);
  font-family:inherit;font-size:10.5px;font-weight:600;padding:6px 11px;border-radius:99px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s,background .2s}
.minibtn:active{transform:scale(.94)}
.minibtn.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.dk .minibtn.on{color:#171102}

/* 图表卡片的统一外壳 —— 没有大标题，靠小标题分层 */
.gsec{background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--sh);padding:14px 15px 15px}
body.dk .gsec{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012)),var(--card)}
.gsec .gt{font-size:14.5px;font-weight:700;letter-spacing:-.2px}
.gsec .gd{font-size:10.5px;color:var(--ink3);margin-top:3px;line-height:1.5}
.gsec .gr{display:flex;align-items:baseline;gap:7px;margin-top:11px}
.gsec .gr b{font-size:22px;font-weight:700;letter-spacing:-.6px;font-family:ui-monospace,Menlo,monospace}
.gsec .gr span{font-size:10.5px;color:var(--ink3)}

/* 类型分布条（首页主卡内） */
.mixbar{display:flex;height:9px;border-radius:5px;overflow:hidden;gap:2px}
.mixbar i{display:block;height:100%;border-radius:2px}
.mixlg{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px;font-size:10.5px;color:var(--ink2)}
.mixlg span{display:flex;align-items:center;gap:5px}
.mixlg i{width:8px;height:8px;border-radius:2px;display:block;flex:none}

/* strip 原样式（封面用） */
.strip{display:flex;border-top:1px solid var(--line);margin-top:16px}
.strip div{flex:1;padding:12px 0 13px;text-align:center;border-right:1px solid var(--line2)}
.strip div:last-child{border:0}
.strip b{display:block;font-size:19px;font-weight:600;letter-spacing:-.3px}
.strip b u{text-decoration:none;font-size:10px;font-weight:500;color:var(--ink2);margin-left:1px}
.strip span{display:block;font-size:9.5px;color:var(--ink3);margin-top:3px;letter-spacing:.5px}

/* 通用 */
.sec{margin-top:24px}
.shead{display:flex;align-items:baseline;gap:9px;margin-bottom:10px}
.shead .no{font-size:9.5px;font-weight:700;color:var(--gold);letter-spacing:1.4px;border:1px solid var(--gold);border-radius:3px;padding:2px 4px}
.shead .tt{font-size:13.5px;font-weight:600;letter-spacing:.6px}
.shead .en2{font-size:9px;letter-spacing:1.6px;color:var(--ink3);text-transform:uppercase}
.shead .ln{flex:1;height:1px;background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh)}
body.dk .card{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012)),var(--card)}
.block{padding:14px}

/* 「05 心率与配速对照」一行一条。
   ⚠️ 右列必须用**固定宽度**（84px）而不是 auto：每行是各自独立的 grid 容器，
   用 auto 时行与行宽度不同，左侧条形会左右错位。配速位数可能从 5 字符
   （6'28"）变到 6 字符（10'02"），所以配速格给 42px 并右对齐 + 等宽数字。 */
.prow{display:grid;grid-template-columns:42px 1fr 84px;gap:9px;align-items:center;
  padding:5px 0;font-size:10px;border-radius:7px}
.prow.tap:active{background:var(--line2)}
.pdate{color:var(--ink3);font-family:ui-monospace,Menlo,monospace;
  font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.ptrack{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.ptrack i{display:block;height:100%;border-radius:4px;background:var(--run)}
.ptrack i.fast{background:var(--gold)}
.pval{display:flex;align-items:center;justify-content:space-between;gap:6px;
  font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.ppace{width:42px;text-align:right;color:var(--ink);font-weight:600}
.phr{width:36px;display:flex;align-items:center;justify-content:flex-end;gap:3px;
  color:var(--heart);font-weight:600}
.phr svg{width:10px;height:10px;flex:none;display:block;fill:currentColor}
.cap{font-size:10px;color:var(--ink3);margin-top:9px;line-height:1.5}

/* 可点卡片：按下反馈（箭头必须显式加 .arr，否则会压住右侧的数值） */
.tap{transition:transform .12s ease,background .2s;cursor:pointer;position:relative}
.tap:active{transform:scale(.978)}
.tap.arr:after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;
  border-top:1.5px solid var(--ink3);border-right:1.5px solid var(--ink3);
  transform:translateY(-50%) rotate(45deg);opacity:.55}
.pressed{background:var(--emb)}

/* 入口卡 */
.entry{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ent{padding:15px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);position:relative;overflow:hidden}
body.dk .ent{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012)),var(--card)}
.ent .ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;margin-bottom:9px}
.ent b{font-size:13.5px;font-weight:600;display:block}
.ent span{font-size:10px;color:var(--ink3);margin-top:3px;display:block;line-height:1.4}

/* KPI */
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.kpi{padding:13px 14px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden;box-shadow:var(--sh)}
body.dk .kpi{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012)),var(--card)}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold)}
.kpi .lb{font-size:10px;color:var(--ink3);letter-spacing:1px;margin-bottom:5px}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.7px;line-height:1.05;display:flex;align-items:baseline;gap:3px}
.kpi .v u{text-decoration:none;font-size:11.5px;font-weight:500;color:var(--ink2)}
.kpi .e{font-size:10px;color:var(--ink3);margin-top:4px}
.kpi .mb{height:3px;background:var(--line2);border-radius:2px;margin-top:9px;overflow:hidden}
.kpi .mb i{display:block;height:100%;background:var(--gold);border-radius:2px}

/* 日历 */
.ch7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:5px}
.ch7 span{text-align:center;font-size:9.5px;color:var(--ink3)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cd{aspect-ratio:1/1.1;border-radius:9px;background:var(--emb);border:1px solid var(--line2);
  display:flex;flex-direction:column;align-items:center;padding-top:5px;gap:2px;overflow:hidden;
  transition:transform .12s,background .2s;cursor:pointer}
.cd:active{transform:scale(.92)}
.cd.empty{background:transparent;border-color:transparent;cursor:default}
.cd .cdn{font-size:10.5px;color:var(--ink2);font-weight:500}
.cd.hit{border-color:var(--line)}
.cd.hit .cdn{color:var(--ink);font-weight:600}
.cd.now{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.cd.now .cdn{color:var(--gold);font-weight:700}
.cd.sel{background:var(--gold)}
.pl{font-size:7.5px;padding:1px 3px;border-radius:3px;font-weight:700;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis;line-height:1.45}
.pl.run{background:color-mix(in srgb,var(--run) 16%,transparent);color:var(--run)}
.pl.lift{background:color-mix(in srgb,var(--lift) 16%,transparent);color:var(--lift)}
.pl.ride{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.pl.walk{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mnav b{font-size:15px;font-weight:600;letter-spacing:.5px}
/* 台历撕页式日期牌：缩小的尺寸 + 顶部"上一页被撕剩的残边"（不规则手撕锯齿） */
.calbox{width:38px;flex:none;border-radius:8px;overflow:hidden;border:1px solid var(--line);
  background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.13),0 1px 0 var(--hl) inset;position:relative}
.calbox .tear{height:7px;position:relative;
  background:linear-gradient(180deg,var(--tearHi),var(--tear) 70%);
  clip-path:polygon(0 0,100% 0,100% 42%,96.2% 82%,92.8% 38%,89% 100%,85.4% 52%,81.8% 30%,78.4% 92%,
    74.6% 42%,71% 100%,67.4% 36%,63.8% 78%,60.2% 28%,56.6% 96%,53% 48%,49.4% 26%,45.8% 86%,
    42.2% 40%,38.6% 100%,35% 34%,31.4% 72%,27.8% 30%,24.2% 92%,20.6% 44%,17% 100%,13.4% 36%,
    9.8% 78%,6.2% 28%,2.6% 88%,0 40%)}
.calbox .m{background:var(--gold);color:#fff;font-size:7px;letter-spacing:1px;text-align:center;padding:2px 0 2px;font-weight:700;
  box-shadow:inset 0 2px 3px -1px rgba(0,0,0,.30)}
.dk .calbox .m{color:#171102}
.calbox .d{font-size:15px;font-weight:600;text-align:center;letter-spacing:-.5px;line-height:1.15;padding-top:1px}
.calbox .w{font-size:6.5px;color:var(--ink3);text-align:center;padding:0 0 3px;letter-spacing:.3px}
/* 胶囊按钮：要有立体感（内高光 + 投影），两种主题都清晰 */
.btn{font-size:11px;padding:6px 13px;border-radius:99px;font-weight:600;white-space:nowrap;
  border:1px solid var(--gold);color:var(--gold);background:var(--card);
  box-shadow:0 1px 0 var(--hl) inset,0 2px 7px rgba(0,0,0,.12);
  transition:transform .12s,box-shadow .2s;font-family:inherit}
.btn:active{transform:scale(.93)}
.btn.off{border-color:var(--line);color:var(--ink3);background:transparent;box-shadow:none}
.seg{display:flex;background:var(--emb);border:1px solid var(--line);border-radius:10px;padding:2px;margin-bottom:12px}
body.dk .seg{background:rgba(255,255,255,.04)}
.seg button{flex:1;border:0;background:transparent;font-size:12px;padding:7px 0;border-radius:8px;
  color:var(--ink2);font-family:inherit;transition:background .2s}

/* 年份胶囊行（记录页/跑步明细的年月导航） */
.ychips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}

/* 三列图例行（部位分布 / 构成占比）：点在最左、名字居中、数值最右 —— 三列各自一条竖轴。
   原来用 .srow2(space-between) 时，中间那格会被两侧挤着跑，看起来整排往右斜。 */
.lgr{display:grid;grid-template-columns:1fr 62px 1fr;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--line2);font-size:11.5px}
.lgr:last-child{border-bottom:0}
.lgr>.dot{margin:0;justify-self:start;align-self:center}
.lgr>b{text-align:center;font-weight:600}
.lgr>.vv{justify-self:end;text-align:right;color:var(--ink2);white-space:nowrap;
  font-family:ui-monospace,Menlo,monospace}

/* 一周计划：星期固定窄列 + 内容左对齐（原来 space-between 把内容顶到右边悬空） */
.wkrow{display:grid;grid-template-columns:46px 1fr;column-gap:12px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--line2)}
.wkrow .dw{text-align:center;color:var(--gold);font-weight:600;font-size:11.5px;letter-spacing:.6px}
.wkrow .wc b{font-size:12.5px;font-weight:600;color:var(--ink)}
.wkrow .ws{font-size:10px;color:var(--ink3);margin-top:3px;line-height:1.5}

/* 记录页"选年月"：细线表格，不用任何装饰件（跟全站 .srow2 / .grow2 的细线语言一致）。
   ⚠️ 历史：做过"钉子+长斜绳"和"挂环+金色装订杆+吊环"，阿成两次都说太花哨，已全部拆掉。
      只保留"点月份翻一页"这一个动作感（@keyframes cflip），其它视觉一律素着来。 */
.yhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding-bottom:11px;border-bottom:1px solid var(--line)}
.yhead b{font-size:15px;font-weight:600;letter-spacing:.4px}
.yhead span{font-size:10px;color:var(--ink3)}
.mrow{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line2)}
.mrow:last-child{border-bottom:0}
.mcell2{padding:11px 0 10px;text-align:center;transition:transform .12s,background .2s;border-radius:9px}
.mcell2:active{transform:scale(.94)}
.mcell2 b{display:block;font-size:13px;font-weight:600;color:var(--ink);
  font-family:ui-monospace,Menlo,monospace;letter-spacing:-.3px}
.mcell2 span{display:block;font-size:9px;color:var(--ink3);margin-top:3px;letter-spacing:.3px}
.mcell2.off b{color:var(--ink3);opacity:.4}
.mcell2.off span{opacity:.45}
.mcell2.on{background:color-mix(in srgb,var(--gold) 13%,transparent)}
.mcell2.on b,.mcell2.on span{color:var(--gold)}
/* 点月份 = 日历页从上边落下来贴平 */
@keyframes cflip{
  0%{transform:perspective(760px) rotateX(58deg);opacity:.35}
  60%{transform:perspective(760px) rotateX(-3.5deg);opacity:1}
  100%{transform:perspective(760px) rotateX(0)}
}
.mcardflip{transform-origin:top center;animation:cflip .56s cubic-bezier(.22,.9,.26,1) both}

/* 器械构成行（05）：统一行高与对齐 */
.grow2{display:grid;grid-template-columns:60px 1fr 52px;gap:9px;align-items:center;padding:5px 0;font-size:10.5px}
.grow2 .bar{height:9px;background:var(--line2);border-radius:5px;overflow:hidden;display:block}
.grow2 .bar i{display:block;height:100%;background:var(--lift);border-radius:5px}
.grow2 .num{text-align:right;color:var(--ink3);font-family:ui-monospace,Menlo,monospace;white-space:nowrap}
.seg button.on{background:var(--gold);color:#fff;font-weight:600}
.dk .seg button.on{color:#171102}
/* 迷你图例 / 图注 */
.mini{display:flex;gap:14px;flex-wrap:wrap;font-size:9.5px;color:var(--ink2);margin-top:8px}
.mini i{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:0}
/* 记录卡日期徽章 */
.rc .dt{text-align:center;width:46px;flex:none}
.rc .dt b{display:block;font-size:20px;font-weight:600;letter-spacing:-.5px;line-height:1.05;color:var(--ink)}
.rc .dt span{display:block;font-size:8.5px;color:var(--ink3);margin-top:3px;letter-spacing:.3px}
/* 动作明细（sheet 内） */
.ex{display:flex;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line2)}
.ex:last-child{border:0}
.ex .no{flex:none;width:20px;height:20px;border-radius:6px;background:color-mix(in srgb,var(--gold) 16%,transparent);
  color:var(--gold);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;align-self:flex-start;margin-top:1px}
.ex .mid{flex:1;min-width:0}
.ex .mid b{font-size:12.5px;font-weight:600}
.ex .meta{font-size:9.5px;color:var(--ink3);margin-top:3px}
.ex .note{font-size:9.5px;color:var(--ink2);margin-top:4px;line-height:1.5;background:var(--emb);
  border-radius:6px;padding:5px 8px}
body.dk .ex .note{background:rgba(255,255,255,.04)}
.ex .val{flex:none;text-align:right}
.ex .val b{display:block;font-size:14px;font-weight:600;color:var(--ink);font-family:ui-monospace,Menlo,monospace}
.ex .val span{display:block;font-size:9.5px;color:var(--ink2);margin-top:2px;font-family:ui-monospace,Menlo,monospace}
/* sheet 分节标题 */
.sh2{font-size:10px;font-weight:700;letter-spacing:1.6px;color:var(--ink3);text-transform:uppercase;
  margin:16px 0 4px;display:flex;align-items:center;gap:8px}
.sh2:after{content:"";flex:1;height:1px;background:var(--line2)}
.mnav .arw{width:28px;height:28px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--ink2);font-size:12px;transition:transform .12s}
.mnav .arw:active{transform:scale(.9)}
.mnav .arw.off{opacity:.3}
/* ── 日历年视图（12 宫格）：点日历顶部的「X 年 X 月」进来 ── */
.ytit b{cursor:pointer;-webkit-tap-highlight-color:transparent}
.ytit b:active{opacity:.55}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:2px}
.mc{border-radius:12px;background:var(--emb);border:1px solid var(--line2);
  padding:13px 6px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;transition:transform .15s;-webkit-tap-highlight-color:transparent}
.mc:active{transform:scale(.94)}
.mc b{font-size:14.5px;font-weight:600;letter-spacing:.5px;color:var(--ink)}
.mc span{font-size:9.5px;color:var(--ink3);line-height:1.4}
/* 月度/年度汇总卡的小 KPI 格（2×2） */
.mst{border:1px solid var(--line2);border-radius:10px;padding:9px 11px 8px;background:var(--emb)}
.mst .v{font-size:14.5px;font-weight:600;color:var(--ink);letter-spacing:-.2px;white-space:nowrap}
.mst .v u{text-decoration:none;font-size:9.5px;font-weight:500;color:var(--ink2);margin-left:1px}
.mst .lb{font-size:8.5px;color:var(--ink3);letter-spacing:1.5px;margin-top:3px}
.mc.hit{background:color-mix(in srgb,var(--gold) 9%,var(--emb));
  border-color:color-mix(in srgb,var(--gold) 38%,var(--line2))}
.mc.hit span{color:var(--gold);font-weight:700}
.mc.now{border:1.5px solid var(--gold)}
.mc.now b{color:var(--gold)}
.mc.fut{opacity:.38;cursor:default}
.mc.fut:active{transform:none}

/* 记录列表 */
.rc{margin-bottom:10px;overflow:hidden}
.rc .hd{display:flex;align-items:center;gap:10px;padding:13px 14px}
.rc .dt{text-align:center;width:48px;flex:none}
.rc .dt b{font-size:19px;font-weight:600;letter-spacing:-.5px;display:block;line-height:1}
.rc .dt span{font-size:8.5px;color:var(--ink3);white-space:nowrap;display:block;margin-top:2px}
.rc .info{flex:1;min-width:0}
.rc .info .tp{font-size:12px;font-weight:600}
.rc .info .meta{font-size:10px;color:var(--ink3);margin-top:3px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.chip{font-size:9px;padding:2px 6px;border-radius:5px;background:var(--emb);color:var(--ink2);border:1px solid var(--line2)}
body.dk .chip{background:rgba(255,255,255,.04)}
.fail{display:flex;gap:2px;align-items:center;margin-top:6px}
.fail i{width:12px;height:4px;border-radius:2px;background:var(--line2)}
.fail i.on{background:var(--warn)}

/* 表格 */
table{width:100%;border-collapse:collapse}
th{font-size:9px;color:var(--ink3);font-weight:700;letter-spacing:.9px;text-align:right;padding:0 6px 8px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{font-size:11.5px;padding:9px 6px;border-bottom:1px solid var(--line2);text-align:right;font-family:ui-monospace,Menlo,monospace}
td:first-child{font-family:-apple-system,"PingFang SC",sans-serif;color:var(--ink2)}
tr:last-child td{border:0}
.dot{display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:4px;vertical-align:1px}

/* 底部 tab */
#tab{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
  background:var(--bar);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tab a{flex:1;text-align:center;padding:8px 0 7px;color:var(--ink3);text-decoration:none;
  transition:color .2s,transform .12s}
#tab a:active{transform:scale(.92)}
#tab a i{display:block;font-size:16px;line-height:1.3;font-style:normal}
#tab a span{font-size:9.5px;letter-spacing:.3px}
#tab a.on{color:var(--gold)}
#tab a.on i{transform:translateY(-1px)}

/* sheet 弹层 */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;
  transition:opacity .28s;z-index:80}
#mask.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;transform:translateY(102%);
  transition:transform .34s cubic-bezier(.22,.9,.28,1);max-height:80vh;overflow:auto;
  background:var(--card);border-radius:18px 18px 0 0;border-top:1px solid var(--line);
  box-shadow:0 -8px 40px rgba(0,0,0,.28);padding:0 0 calc(20px + env(safe-area-inset-bottom))}
#sheet.on{transform:translateY(0)}
#sheet .grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:9px auto 4px}
#sheet .sbody{padding:6px 18px 8px}
#sheet h3{font-size:16px;font-weight:600;letter-spacing:-.2px}
#sheet .sst{font-size:10.5px;color:var(--ink3);margin-top:3px}
.srow2{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2);font-size:12px}
.srow2:last-child{border:0}
.srow2 b{font-weight:600}
.srow2 span{color:var(--ink2)}
.pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pillrow span{font-size:10px;padding:4px 9px;border-radius:7px;background:var(--emb);color:var(--ink2)}
body.dk .pillrow span{background:rgba(255,255,255,.05)}
.quote{font-size:12px;line-height:1.65;color:var(--ink2);background:var(--emb);border-left:2px solid var(--gold);
  padding:10px 12px;border-radius:8px;margin-top:10px}
body.dk .quote{background:rgba(255,255,255,.04)}
.adv{font-size:11.5px;line-height:1.7;color:var(--ink2);margin-top:8px;padding-left:2px}
.adv li{list-style:none;padding:2px 0 2px 14px;position:relative}
.adv li:before{content:"";position:absolute;left:2px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.tag{border:1px solid var(--gold);color:var(--gold);font-size:9px;padding:1px 5px;border-radius:4px;margin-right:5px;font-weight:600}

/* 图表 hover 气泡 */
.tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .15s;
  background:var(--ink);color:var(--bg);font-size:10px;padding:4px 8px;border-radius:7px;white-space:nowrap;z-index:20}
.tip.on{opacity:1}
.chartbox{position:relative}
.barhit{cursor:pointer;transition:opacity .15s}
.barhit:active{opacity:.75}

/* 页面切换动画 */
#app{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.empty-tip{text-align:center;font-size:11.5px;color:var(--ink3);padding:26px 0}

/* ═══════════ 路线轨迹（⌖ tab） ═══════════ */
/* 顶部三格汇总 */
.rtstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rtstat .cell{border:1px solid var(--line2);border-radius:10px;padding:10px 8px 9px;background:var(--emb);text-align:center}
body.dk .rtstat .cell{background:rgba(255,255,255,.03)}
.rtstat .v{font-size:16px;font-weight:700;letter-spacing:-.3px;color:var(--ink);font-family:ui-monospace,Menlo,monospace}
.rtstat .v u{text-decoration:none;font-size:9px;font-weight:500;color:var(--ink2);margin-left:1px}
.rtstat .lb{font-size:8.5px;color:var(--ink3);letter-spacing:1.2px;margin-top:3px}
/* 类型筛选 chips */
.rflt{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 12px}
.rflt button{border:1px solid var(--line2);background:var(--card);color:var(--ink2);font-size:10.5px;
  padding:5px 11px;border-radius:99px;cursor:pointer;font-family:inherit;transition:all .18s;-webkit-tap-highlight-color:transparent}
.rflt button.on{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}
body.dk .rflt button.on{color:#171102}
.rflt button:active{transform:scale(.95)}
/* 路线卡 */
.rtc{display:flex;gap:12px;align-items:center;padding:11px 12px;margin-bottom:10px;cursor:pointer;
  transition:transform .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* 可点元素统一 touch-action:manipulation —— 去掉 iOS 上"先判断是不是双击缩放"的 300ms 等待，
   点击反馈立刻出来（2026-10-21：阿成说点路线卡片"很久才反应过来"，一半是下载、一半是这个）。 */
.rtc,.card.tap,.wkbar .c,.mcal .cd,.hero-today .go,#tab a,.segbar button,.rflt button,.rows .rw{
  touch-action:manipulation}
.rtc:active{transform:scale(.98)}
.rtc .rtmini{flex:none;width:92px;height:68px;border-radius:9px;background:var(--emb);
  border:1px solid var(--line2);position:relative;overflow:hidden}
body.dk .rtc .rtmini{background:rgba(255,255,255,.03)}
.rtc .info{flex:1;min-width:0}
.rtc .d1{display:flex;align-items:baseline;gap:7px}
.rtc .d1 b{font-size:13px;font-weight:600;letter-spacing:-.2px;font-family:ui-monospace,Menlo,monospace}
.rtc .d1 span{font-size:10px;color:var(--ink2)}
.rtc .d2{font-size:11px;color:var(--ink);margin-top:4px;font-family:ui-monospace,Menlo,monospace}
.rtc .d3{font-size:9.5px;color:var(--ink3);margin-top:3px}
.rtmini-sk{position:absolute;inset:0;border-radius:8px;
  background:linear-gradient(100deg,transparent 30%,var(--line2) 50%,transparent 70%) 0 0/220% 100%;
  animation:rtsk 1.3s linear infinite}
@keyframes rtsk{to{background-position:-220% 0}}
/* 路线详情全屏层 */
#rtView{position:fixed;inset:0;z-index:100;background:var(--bg);transform:translateY(102%);
  transition:transform .38s cubic-bezier(.22,.9,.28,1),visibility .38s;overflow-y:auto;overscroll-behavior:contain;
  visibility:hidden;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
#rtView.on{transform:translateY(0);visibility:visible}
#rtView .rtbar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:11px;
  padding:calc(9px + env(safe-area-inset-top)) 14px 9px;
  /* 不用毛玻璃：整个浮层要跟着手指滑，sticky + backdrop-filter 在这种滚动容器里
     会把每帧都重新模糊一次（iOS 上明显发滞），底色本来就是同色，看不出差别。 */
  background:var(--bg);
  border-bottom:1px solid var(--line)}
#rtView .rtbar .rtx{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:var(--card);
  color:var(--ink2);font-size:13px;cursor:pointer;flex:none;font-family:inherit;transition:transform .15s}
#rtView .rtbar .rtx:active{transform:scale(.9)}
#rtView .rtbar .rtt{flex:1;min-width:0;font-size:14px;font-weight:600;letter-spacing:-.2px}
#rtView .rtbar .rtt span{display:block;font-size:9px;color:var(--ink3);font-weight:400;letter-spacing:1.5px;margin-top:1px}
/* 详情统计 4×2 */
.rtgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line2);border-radius:10px;overflow:hidden}
.rtgrid .cell{background:var(--card);padding:9px 4px 8px;text-align:center}
.rtgrid .v{font-size:13.5px;font-weight:700;color:var(--ink);letter-spacing:-.2px;font-family:ui-monospace,Menlo,monospace;white-space:nowrap}
.rtgrid .v u{text-decoration:none;font-size:8.5px;font-weight:500;color:var(--ink2);margin-left:1px}
.rtgrid .lb{font-size:8px;color:var(--ink3);letter-spacing:1px;margin-top:3px}
/* 路线大图容器 */
.rtmap{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line2);background:var(--emb)}
body.dk .rtmap{background:rgba(255,255,255,.02)}
.rtmap svg{display:block;touch-action:none;cursor:crosshair}
/* 拖动读数条 */
.rtread{position:absolute;left:9px;top:9px;background:var(--ink);color:var(--bg);font-size:10px;
  padding:5px 9px;border-radius:8px;white-space:nowrap;font-family:ui-monospace,Menlo,monospace;
  opacity:0;transition:opacity .18s;pointer-events:none;letter-spacing:.2px;z-index:3}
.rtread.on{opacity:1}
.rtread b{color:var(--gold);font-weight:700}
body.dk .rtread b{color:#F0D9A0}
/* 比例尺 */
.rtscale{position:absolute;right:9px;bottom:8px;font-size:8px;color:var(--ink3);text-align:center;
  pointer-events:none;font-family:ui-monospace,Menlo,monospace}
.rtscale i{display:block;height:4px;border-left:1.5px solid var(--ink3);border-right:1.5px solid var(--ink3);border-bottom:1.5px solid var(--ink3);margin-bottom:2px}
/* 分段表高亮最快一公里 */
tr.fast td{color:var(--gold);font-weight:700}
/* 详情页里的环境 chips 复用 pillrow；补一个字段标签 */
.rtcond{display:flex;gap:6px;flex-wrap:wrap}
.rtcond span{font-size:10px;padding:4px 9px;border-radius:7px;background:var(--emb);color:var(--ink2);border:1px solid var(--line2)}
body.dk .rtcond span{background:rgba(255,255,255,.04)}
/* detailDay 里的「查看路线」按钮 */
.rtgo{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--gold);
  border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line2));background:color-mix(in srgb,var(--gold) 7%,var(--card));
  padding:5px 11px;border-radius:8px;cursor:pointer;font-family:inherit;transition:transform .15s}
.rtgo:active{transform:scale(.95)}
/* 轨迹图上的「回放」按钮 */
.rtplay{position:absolute;right:9px;top:9px;z-index:4;display:inline-flex;align-items:center;gap:4px;
  font-size:9.5px;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--card) 84%,transparent);
  border:1px solid var(--line2);border-radius:99px;padding:4px 10px;cursor:pointer;font-family:inherit;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .15s}
.rtplay:active{transform:scale(.92)}

/* ═══ 身体指标（hm）—— 2026-10-18 接入每日健康指标 ═══
   风格对齐既有看板：金/蓝/紫/绿取自同一组 token，卡片用 .card + .gsec 同一套外壳。 */

/* 首页「今日身体」卡：三格大数字 + 活动行 + 迷你趋势 */
.hmgrid{display:grid;gap:0;margin-top:12px}
.hmgrid .hc{flex:1;min-width:0;padding:0 12px;border-left:1px solid var(--line2)}
.hmgrid .hc:first-child{border-left:0;padding-left:0}
.hmgrid .hl{font-size:10px;color:var(--ink3);letter-spacing:.3px;display:flex;align-items:center;gap:4px}
.hmgrid .hv{font-size:25px;font-weight:700;letter-spacing:-.8px;margin-top:4px;line-height:1;
  font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.hmgrid .hv u{text-decoration:none;font-size:10px;font-weight:600;color:var(--ink2);margin-left:3px;
  font-family:-apple-system,'PingFang SC',sans-serif}
.hmgrid .hd{font-size:9.5px;color:var(--ink3);margin-top:5px;line-height:1.35}
.hmgrid .hd b{font-weight:600}
.hmgrid .hd .up{color:var(--green)}
.hmgrid .hd .dn{color:var(--warn)}
.hmgrid .hd .eq{color:var(--ink3)}
/* 活动四项（步数/锻炼/站立/爬楼） */
.hmact{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:13px}
.hmact.hmday{grid-template-columns:repeat(3,1fr)}
.hmact.hmday .ac b{font-size:14px}
.hmact .ac{background:var(--emb);border:1px solid var(--line2);border-radius:9px;padding:8px 6px 7px;text-align:center}
body.dk .hmact .ac{background:rgba(255,255,255,.04)}
.hmact .ac i{font-style:normal;font-size:11px;line-height:1;display:block;color:var(--ink2)}
.hmact .ac b{display:block;font-size:15px;font-weight:700;letter-spacing:-.3px;margin-top:5px;
  font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.hmact .ac span{display:block;font-size:9px;color:var(--ink3);margin-top:3px}
/* 迷你趋势（14 天线）*/
.hmspark{margin-top:13px}
.hmchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.hmchips button{border:1px solid var(--line);background:var(--emb);color:var(--ink2);font-family:inherit;
  font-size:10px;font-weight:600;padding:4px 10px;border-radius:99px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:transform .12s,background .2s}
.hmchips button:active{transform:scale(.94)}
.hmchips button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.dk .hmchips button.on{color:#171102}
/* 图表提示框（复用 .dual .tipbox 的样式约定） */
.hmtip{position:absolute;top:0;left:0;right:0;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;font-size:10.5px;box-shadow:var(--sh);z-index:5;
  pointer-events:none;opacity:0;transition:opacity .15s;line-height:1.55}
.hmtip.on{opacity:1}
.hmtip b{font-size:12px;font-weight:700;font-family:ui-monospace,Menlo,monospace}
.hmchart{position:relative}
.hmchart svg{display:block;width:100%;height:auto}
.hmdot{cursor:pointer;transition:r .16s,opacity .16s}
.hmdot:hover{filter:brightness(1.15)}
/* 指标说明弹层里的统计行 */
.hmstat{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
.hmstat div{background:var(--emb);border:1px solid var(--line2);border-radius:9px;padding:7px 4px 6px;text-align:center}
body.dk .hmstat div{background:rgba(255,255,255,.04)}
.hmstat span{display:block;font-size:9px;color:var(--ink3)}
.hmstat b{display:block;font-size:13px;font-weight:700;margin-top:3px;
  font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}

/* 器械照片已取消（2026-10-21 阿成：不需要缩略图）*/

/* ══════════════════════════════════════════════════════════════════
   v5 · 商务看板（2026-10-20 大改版）
   原则：① 首页是"此刻状态"，不是目录 ② 底部固定四个 tab，永不增减
        ③ 商务感来自留白、极细边框、克制的烫金，而不是装饰件
   做法：类名全部沿用（视图函数还在用），只重新定义视觉参数，
        新首页组件另起 t- 前缀，与旧样式隔离。
   ══════════════════════════════════════════════════════════════════ */
:root{
  --bg:#F3F3F1; --bg2:#EAEAE6; --card:#FFFFFF; --emb:#F7F7F5;
  --line:rgba(14,17,23,.085); --line2:rgba(14,17,23,.042);
  --ink:#0B0E13; --ink2:#424957; --ink3:#6C7480;
  --gold:#8A6A2B; --gold-lt:#B08F4C;
  --run:#1F5FBF; --lift:#5B36C4; --green:#0E6E4A; --warn:#A85B27; --heart:#BE3350;
  --grid:rgba(14,17,23,.06); --hl:rgba(255,255,255,.9); --bar:rgba(250,249,246,.94);
  --tear:#DCD6C6; --tearHi:#EAE6DA;
  --sh:0 1px 2px rgba(12,15,21,.035),0 10px 30px -14px rgba(12,15,21,.16);
  --r:18px; --r2:13px;
}
body.dk{
  --bg:#07090C; --bg2:#0B0E13; --card:#11141A; --emb:#0C0F14;
  --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.035);
  --ink:#ECEEF1; --ink2:#A0A8B4; --ink3:#767F8C;
  --gold:#C9A961; --gold-lt:#DCC189;
  --run:#6BA4FF; --lift:#AE93F7; --green:#48D6A0; --warn:#E5A96A; --heart:#FF7B8C;
  --grid:rgba(255,255,255,.05); --hl:rgba(255,255,255,.06); --bar:rgba(14,17,23,.94);
  --tear:rgba(255,255,255,.16); --tearHi:rgba(255,255,255,.28);
  --sh:0 1px 0 rgba(255,255,255,.035) inset,0 16px 40px -20px rgba(0,0,0,.9);
}
html{background:var(--bg)}
body{
  background:
    radial-gradient(120% 60% at 50% -10%,color-mix(in srgb,var(--gold) 7%,transparent),transparent 62%),
    var(--bg);
  padding-bottom:calc(86px + env(safe-area-inset-bottom));
  letter-spacing:-.005em;
}
.wrap{max-width:452px;padding:0 18px}
::selection{background:color-mix(in srgb,var(--gold) 26%,transparent)}

/* ── 页头：去掉斜纹与装饰圆，只留一块安静的抬头 ── */
.cover{background:transparent;padding:calc(14px + env(safe-area-inset-top)) 18px 0;
  max-width:452px;margin:0 auto;overflow:visible}
.cover:before,.cover:after{display:none}
.topbar{padding-bottom:2px}
.brand{font-size:9.5px;letter-spacing:.34em;font-weight:600;color:var(--gold);opacity:.9}
.sw{background:color-mix(in srgb,var(--card) 70%,transparent);border-color:var(--line);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.sw button{font-size:10.5px;padding:5px 10px;letter-spacing:.02em}
.month{font-size:10.5px;letter-spacing:.2em;margin:20px 0 7px;font-weight:600;color:var(--ink3)}
.title{font-size:24px;font-weight:700;letter-spacing:-.7px;line-height:1.18}
.sub{font-size:12px;color:var(--ink3);margin-top:8px;line-height:1.55}
.rline{height:1px;background:linear-gradient(90deg,var(--gold) 0%,var(--line) 34%,transparent 100%);
  opacity:.8;margin-top:18px}
.srcpill{border-color:color-mix(in srgb,var(--gold) 40%,transparent);color:var(--gold);
  font-size:9px;letter-spacing:.08em;padding:4px 10px;background:transparent}

/* ── 卡片：更薄的边、更柔的影、更大的圆角 ── */
.card,.gsec,.kpi,.sig,.rows,.abox,.ent{border-radius:var(--r);border-color:var(--line);
  box-shadow:var(--sh)}
body.dk .card,body.dk .gsec,body.dk .kpi,body.dk .abox,body.dk .ent{
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.008) 42%),var(--card)}
.block{padding:18px}
.sec{margin-top:26px}
.shead{margin-bottom:11px;gap:8px}
.shead .tt{font-size:12.5px;font-weight:600;letter-spacing:.06em;color:var(--ink2)}
.shead .ln{background:linear-gradient(90deg,var(--line),transparent)}
.mini{font-size:10.5px;letter-spacing:.06em;color:var(--ink3)}
.cap{font-size:10.5px;color:var(--ink3);line-height:1.55}

/* ── 底部四个固定 tab（阿成要求：就四个，不能多）── */
#tab{position:fixed;left:0;right:0;bottom:0;z-index:80;display:flex;
  padding:0 env(safe-area-inset-left) env(safe-area-inset-bottom) env(safe-area-inset-right);
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border-top:1px solid var(--line)}
#tab:after{content:"";position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);opacity:.5;pointer-events:none}
body.dk #tab:after{display:none}
#tab a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  height:60px;padding:0;color:var(--ink3);text-decoration:none;position:relative;
  transition:color .22s;-webkit-tap-highlight-color:transparent}
#tab a svg{width:21px;height:21px;display:block;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .26s cubic-bezier(.22,.9,.26,1)}
#tab a span{font-size:9.5px;letter-spacing:.06em;font-weight:500;transition:font-weight .2s}
#tab a.on{color:var(--gold)}
#tab a.on svg{transform:translateY(-1px) scale(1.04)}
#tab a.on span{font-weight:600}
#tab a.on:before{content:"";position:absolute;top:0;left:50%;width:22px;height:2px;border-radius:0 0 3px 3px;
  background:var(--gold);transform:translateX(-50%) scaleX(1);animation:tabin .3s cubic-bezier(.22,.9,.26,1)}
#tab a:active svg{transform:scale(.9)}
@keyframes tabin{from{transform:translateX(-50%) scaleX(.2);opacity:0}to{transform:translateX(-50%) scaleX(1);opacity:1}}

/* ── 页面切换：轻微上浮，像翻一页 ── */
/* 页面切换的入场：**不用 opacity 整层淡入**。
   ⚠️ 2026-10-20 试过 `#app{animation:pagein}`（opacity 0→1），在无头 Chrome 里
   动画会被冻在 0%，连带整个图层栅格化错位（截图整页发黑、文字浅色、背景割裂）。
   真机不一定出问题，但这属于"无法验证"的写法，按底风险处理：
   改用只做位移的轻入场（不碰 opacity），观感几乎一样，且不会整层透明。 */
@keyframes pagein{from{transform:translateY(7px)}to{transform:none}}
#app{animation:pagein .3s cubic-bezier(.22,.9,.26,1)}

/* ══════ 首页看板组件 ══════ */

/* 区块抬头：金色小竖条 + 标题 + 右侧补充 */
.sectt{display:flex;align-items:center;gap:9px;margin:0 0 11px}
.sectt b{font-size:13px;font-weight:700;letter-spacing:.02em}
.sectt i{width:3px;height:13px;border-radius:2px;background:var(--gold);display:block;flex:none}
.sectt span{margin-left:auto;font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}

/* ① 今天 —— 首页的视觉锚点。
   ⚠️ 2026-10-21 阿成指出：整页是浅色时这块还是黑的，很突兀。
   现在**浅色主题给浅色版**（暖象牙底 + 烫金细框，仍然比周围卡片"重"一档，
   但不再是一块黑砖），深色版本只在 body.dk 下出现。
   内部颜色全部走 --h-* 变量，两套主题各写一遍，不要再往规则里硬编码白色。 */
.hero-today{
  --h-ink:#14171C; --h-ink2:#5C6472; --h-ink3:#8A919C;
  --h-gold:#8A6A2C; --h-ln:rgba(20,23,28,.10); --h-ln2:rgba(20,23,28,.055);
  --h-chip:rgba(255,255,255,.78); --h-chipbd:rgba(20,23,28,.10);
  --h-go:rgba(144,112,47,.055); --h-date:rgba(255,255,255,.62); --h-datebd:rgba(144,112,47,.26);
  background:linear-gradient(168deg,#FFFDF8 0%,#F6F2E7 100%);
  border:1px solid rgba(144,112,47,.22);border-radius:var(--r);
  box-shadow:0 1px 1px rgba(16,19,24,.04),0 16px 34px -26px rgba(16,19,24,.34);
  overflow:hidden;position:relative;color:var(--h-ink)}
.hero-today:after{content:"";position:absolute;right:-60px;top:-80px;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,169,97,.14),transparent 68%);pointer-events:none}
body.dk .hero-today{
  --h-ink:#FFFFFF; --h-ink2:rgba(255,255,255,.60); --h-ink3:rgba(255,255,255,.42);
  --h-gold:#D9BE86; --h-ln:rgba(255,255,255,.09); --h-ln2:rgba(255,255,255,.06);
  --h-chip:rgba(255,255,255,.055); --h-chipbd:rgba(255,255,255,.09);
  --h-go:rgba(201,169,97,.07); --h-date:rgba(255,255,255,.06); --h-datebd:rgba(201,169,97,.32);
  background:linear-gradient(168deg,#1E232C 0%,#0F1218 100%);
  border-color:rgba(201,169,97,.22);
  box-shadow:0 1px 1px rgba(10,12,16,.2),0 18px 40px -22px rgba(10,12,16,.55)}
.hero-today .th{display:flex;align-items:flex-start;gap:14px;padding:18px 18px 0;position:relative;z-index:1}
.hero-today .dnum{flex:none;width:54px;text-align:center;padding:8px 0 7px;border-radius:14px;
  background:linear-gradient(160deg,rgba(201,169,97,.22),rgba(201,169,97,.05));
  border:1px solid var(--h-datebd)}
.hero-today .dnum b{display:block;font-size:23px;font-weight:700;letter-spacing:-1px;line-height:1;color:var(--h-ink);
  font-variant-numeric:tabular-nums}
.hero-today .dnum span{display:block;font-size:8.5px;color:var(--h-gold);letter-spacing:.1em;margin-top:4px;font-weight:600}
.hero-today .tx{flex:1;min-width:0;padding-top:1px}
.hero-today .tx .k{font-size:9.5px;letter-spacing:.18em;color:var(--h-gold);font-weight:600}
.hero-today .tx h2{font-size:19px;font-weight:700;letter-spacing:-.4px;margin-top:5px;line-height:1.25;color:var(--h-ink)}
.hero-today .tx .s{font-size:11.5px;color:var(--h-ink2);margin-top:5px;line-height:1.5}
.hero-today .tb{padding:14px 18px 16px;position:relative;z-index:1}
.hero-today .chipwrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.hero-today .ex-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:500;
  padding:5px 9px;border-radius:8px;background:var(--h-chip);
  border:1px solid var(--h-chipbd);color:var(--h-ink2)}
.hero-today .ex-chip b{font-weight:700;color:var(--h-ink);font-variant-numeric:tabular-nums}
.hero-today .ex-chip em{color:var(--h-ink3)!important}
.hero-today .empty{padding:2px 0 4px;font-size:11.5px;color:var(--h-ink2);line-height:1.6}
.hero-today .mstats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--h-ln);
  margin-top:14px;padding-top:13px}
.hero-today .mstats div{text-align:center;border-right:1px solid var(--h-ln2)}
.hero-today .mstats div:last-child{border:0}
.hero-today .mstats b{display:block;font-size:16px;font-weight:700;letter-spacing:-.4px;color:var(--h-ink);
  font-variant-numeric:tabular-nums}
.hero-today .mstats span{display:block;font-size:9px;color:var(--h-ink3);margin-top:3px;letter-spacing:.06em}
.hero-today .go{display:flex;align-items:center;justify-content:center;gap:5px;font-size:11px;
  color:var(--h-gold);font-weight:600;padding:13px;border-top:1px solid var(--h-ln2);
  background:var(--h-go);position:relative;z-index:1}

/* ② 本周 7 条：细柱（宽度固定 18px 居中）—— 之前柱宽 100%，
   只有一天有训练时看着像一整块金色，分不清是"一天"还是"一周"。 */
.wkbar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:2px}
.wkbar .c{display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;
  cursor:pointer;-webkit-tap-highlight-color:transparent;padding:2px 0 8px;border-radius:10px;
  transition:background .16s ease,transform .12s ease}
/* 「今天」只能用一个小圆点标出来 ——
   ⚠️ 原来今天那根柱子底下画了条金色横杠（.cur .bar:after），
   没训练的日子看着像"练了一点"，阿成 2026-10-21 明确说会误读，已删。
   现在：今天 = 星期那个字变金 + 底下一个小金点，柱子里除了真实数据什么都不画。 */
.wkbar .c.cur:after{content:"";position:absolute;left:50%;bottom:0;width:4px;height:4px;
  margin-left:-2px;border-radius:50%;background:var(--gold)}
.wkbar .c:active{background:color-mix(in srgb,var(--gold) 9%,transparent);transform:scale(.955)}
.wkbar .c:active .bar i{filter:brightness(1.08)}
.wkbar .c .bar{width:18px;height:52px;border-radius:4px;background:transparent;
  border:0;display:flex;align-items:flex-end;overflow:visible;position:relative}
.wkbar .c .bar i{display:block;width:100%;border-radius:4px 4px 2px 2px;
  background:linear-gradient(180deg,var(--gold-lt),var(--gold));
  transition:height .6s cubic-bezier(.22,.9,.26,1)}
.wkbar .c.rest .bar:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  border-radius:2px;background:var(--line)}
.wkbar .c.fut .bar:after{background:var(--line2)}
.wkbar .c.fut .bar{opacity:.55}
.wkbar .c .d{font-size:9.5px;color:var(--ink3);letter-spacing:.04em}
.wkbar .c.cur .d{color:var(--gold);font-weight:700}
.wkbar .c .v{font-size:9px;color:var(--ink3);font-variant-numeric:tabular-nums;height:12px;line-height:12px}
.wkbar .c.cur .v{color:var(--gold);font-weight:600}

/* ③ 本月日历 */
.mcal .mnav{margin-bottom:9px}
.mcal .mnav b{font-size:13px;letter-spacing:.02em}
.mcal .mnav .mn{display:flex;align-items:center;gap:4px}
.mcal .mnav button{border:1px solid var(--line);background:var(--card);color:var(--ink2);
  width:26px;height:26px;border-radius:8px;font-family:inherit;font-size:12px;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.mcal .mnav button:active{background:var(--emb)}
.mcal .ch7 span{font-size:9px;color:var(--ink3);letter-spacing:.04em}
.mcal .cg{gap:4px}
.mcal .cd{aspect-ratio:1/.92;border-radius:9px;background:transparent;border:1px solid transparent;
  padding-top:5px;gap:1px;position:relative}
.mcal .cd.empty{background:transparent}
.mcal .cd .cdn{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;font-weight:500}
.mcal .cd.lv1{background:color-mix(in srgb,var(--gold) 13%,transparent);
  border-color:color-mix(in srgb,var(--gold) 18%,transparent)}
.mcal .cd.lv2{background:color-mix(in srgb,var(--gold) 25%,transparent);
  border-color:color-mix(in srgb,var(--gold) 32%,transparent)}
.mcal .cd.lv3{background:color-mix(in srgb,var(--gold) 38%,transparent);
  border-color:color-mix(in srgb,var(--gold) 46%,transparent)}
.mcal .cd.lv4{background:color-mix(in srgb,var(--gold) 54%,transparent);
  border-color:color-mix(in srgb,var(--gold) 62%,transparent)}
/* 深色主题底色本来就暗，四档要更实才看得出来 */
body.dk .mcal .cd.lv1{background:color-mix(in srgb,var(--gold) 15%,transparent);
  border-color:color-mix(in srgb,var(--gold) 22%,transparent)}
body.dk .mcal .cd.lv2{background:color-mix(in srgb,var(--gold) 28%,transparent);
  border-color:color-mix(in srgb,var(--gold) 38%,transparent)}
body.dk .mcal .cd.lv3{background:color-mix(in srgb,var(--gold) 45%,transparent);
  border-color:color-mix(in srgb,var(--gold) 56%,transparent)}
body.dk .mcal .cd.lv4{background:color-mix(in srgb,var(--gold) 66%,transparent);
  border-color:color-mix(in srgb,var(--gold) 76%,transparent)}
.mcal .cd.lv1 .cdn,.mcal .cd.lv2 .cdn{color:var(--ink)}
/* ⚠️ 2026-10-21：lv3/lv4 原来是 #fff 白字，浅色主题下这两档是"浅金底"，
   白字对比度只有 1.9，几乎看不见（阿成说"其他地方有没有类似的问题"就是这类）。
   浅色统一用深墨字，深色主题里金底更亮，继续用近黑字。 */
.mcal .cd.lv3 .cdn,.mcal .cd.lv4 .cdn{color:var(--ink)}
body.dk .mcal .cd.lv3 .cdn,body.dk .mcal .cd.lv4 .cdn{color:#0B0E13}
.mcal .cd.now{box-shadow:0 0 0 1.5px var(--gold) inset;border-color:transparent}
.mcal .cd.now .cdn{color:var(--ink);font-weight:700}
.mcal .cd.fut{opacity:.34}
.mcal .cd .dotline{display:flex;gap:2px;height:3px;align-items:center;margin-top:2px}
.mcal .cd .dotline i{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.5}
.mcal .leg{display:flex;align-items:center;gap:10px;margin-top:11px;font-size:9px;color:var(--ink3)}
.mcal .leg i{width:9px;height:9px;border-radius:3px;display:block}

/* ④ 数据双卡 / 迷你图 */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo .c{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:14px 14px 12px;position:relative;overflow:hidden}
body.dk .duo .c{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.008) 42%),var(--card)}
.duo .c .l{font-size:9.5px;letter-spacing:.1em;color:var(--ink3)}
.duo .c .v{font-size:24px;font-weight:700;letter-spacing:-.9px;margin-top:5px;
  font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:3px}
.duo .c .v u{text-decoration:none;font-size:10.5px;font-weight:600;color:var(--ink3);letter-spacing:0}
.duo .c .d{font-size:9.5px;color:var(--ink3);margin-top:3px}
.duo .c .mini-svg{margin-top:8px}
.duo .c .delta{margin-left:0}

/* 训练量迷你柱（首页） */
.tbars{display:flex;align-items:flex-end;gap:7px;height:76px;margin-top:6px}
.tbars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  height:100%;gap:5px;min-width:0;cursor:pointer}
.tbars .b .col{width:100%;border-radius:5px 5px 3px 3px;background:var(--line);
  transition:height .55s cubic-bezier(.22,.9,.26,1),background .2s;min-height:3px}
.tbars .b.on .col{background:linear-gradient(180deg,var(--gold-lt),var(--gold))}
.tbars .b .lb{font-size:8.5px;color:var(--ink3);letter-spacing:-.02em;white-space:nowrap}
.tbars .b.on .lb{color:var(--gold);font-weight:700}

/* 快捷入口（细线两列，不用图标块） */
.qrow{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);overflow:hidden}
.qrow a{display:flex;align-items:center;gap:12px;padding:15px 18px;text-decoration:none;
  color:inherit;border-bottom:1px solid var(--line2);transition:background .16s}
.qrow a:last-child{border:0}
.qrow a:active{background:var(--emb)}
.qrow a .qi{width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  border-radius:8px;background:color-mix(in srgb,var(--gold) 10%,transparent);color:var(--gold);flex:none}
.qrow a .qi svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.qrow a .tx{flex:1;min-width:0}
.qrow a .tx b{font-size:13px;font-weight:600;display:block}
.qrow a .tx span{font-size:10.5px;color:var(--ink3);margin-top:2px;display:block}
.qrow a .ar{width:6px;height:6px;border-top:1.4px solid var(--ink3);border-right:1.4px solid var(--ink3);
  transform:rotate(45deg);opacity:.45;flex:none}

/* 底部提示 */
.foot{padding:16px 0 6px;text-align:center;font-size:9.5px;color:var(--ink3);line-height:1.7}

/* ── 页头：静止在页面顶部（不做 sticky）。
   ⚠️ 2026-10-20 试过 sticky + 滚动收缩，实测在无头 Chrome 下整页发黑，
   只有 position 改回 static 才恢复 —— 这是 sticky 建合成层带来的风险。
   手机端没法在这里真机验证，按"宁可少一个动效，不能有一天打不开"处理。── */
.cover{background:var(--bg)}

/* ── 通用件微调 ── */
.btn{border-radius:9px;font-size:11px;padding:6px 12px;box-shadow:none;
  border-color:color-mix(in srgb,var(--gold) 34%,transparent)}
.segbar{background:var(--line2);border-radius:11px;padding:3px}
.segbar button{border-radius:9px;font-size:12px}
.gsec{padding:16px 17px 17px}
.gsec .gt{font-size:15px;letter-spacing:-.2px}
.kpi{border-radius:var(--r)}
.kpi .v{font-size:25px}
.sig{border-radius:var(--r)}
.rows .rw{padding:14px 17px}
.ychips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.ychips::-webkit-scrollbar{display:none}
.chip{border-radius:8px}
.empty-tip{border-radius:var(--r)}
.heat .hc{border-radius:7px}
.legend span{border-radius:8px}
.pick{border-radius:11px}

/* 建议卡：左侧色带收细、优先级标签改描边 —— 实心色块一多就像告警面板，
   商务稿里要的是"克制地标重点"，不是一片红黄。 */
.abox{border-left-width:2px;padding:16px 17px 15px;border-radius:16px}
.abox .ah b{font-size:14px;letter-spacing:-.1px}
.abox .do{border-radius:10px;padding:10px 12px}
.pri{background:transparent!important;border:1px solid currentColor;font-size:8.5px;
  padding:1px 6px;letter-spacing:.08em;border-radius:4px}
.pri.p1{color:#C0392B}.pri.p2{color:var(--warn)}.pri.p3{color:var(--ink3)}
/* 器械动作行更紧一点，一屏多看两条 */
.ex{padding:9px 0}
</style>
