/* 渲染：构成环形 */
function renderMix(){
  const o=curOv(), tot=o.总时长||1;
  let acc=0, segs='';
  const cols={'跑步':'var(--run)','力量训练':'var(--lift)','核心训练':'var(--lift)','骑行':'var(--green)','步行':'var(--warn)','徒步':'var(--warn)','爬楼梯':'var(--warn)','乒乓球':'var(--gold)','游泳':'var(--green)'};
  o.types.forEach(t=>{
    const frac=t.时长/tot, C=2*Math.PI*46;
    segs+=`<circle cx="60" cy="60" r="46" fill="none" stroke="${cols[t.名称]||'var(--lift)'}" stroke-width="13"
      stroke-dasharray="${(frac*C).toFixed(1)} 999" stroke-dashoffset="${(-acc*C).toFixed(1)}" transform="rotate(-90 60 60)"
      style="cursor:pointer" onclick="toast('${t.名称}：${t.次数} 次 · ${hm(t.时长)} · ${t.消耗} kcal')"></circle>`;
    acc+=frac;
  });
  document.getElementById('mix').innerHTML=`
    <svg viewBox="0 0 120 120" width="104" height="104" style="flex:none">
      <circle cx="60" cy="60" r="46" fill="none" stroke="var(--line2)" stroke-width="13"/>${segs}
      <text x="60" y="57" text-anchor="middle" font-size="22" font-weight="600" fill="var(--ink)">${o.次数}</text>
      <text x="60" y="71" text-anchor="middle" font-size="9" fill="var(--ink3)">次运动</text></svg>
    <div style="flex:1;min-width:0">${o.types.map(t=>`<div class="lgr tap" onclick="toast('${t.名称}：${t.次数} 次 · ${hm(t.时长)} · ${t.消耗} kcal')">
      <span class="dot" style="background:${cols[t.名称]||'var(--lift)'}"></span><b>${t.名称}</b>
      <span class="vv">${Math.round(t.时长/tot*100)}% · ${hm(t.时长)}</span></div>`).join('')}</div>`;
}

/* 渲染：配速点图（可点） */
function renderPace(){
  const rs=D.recent.filter(r=>r.类型==='跑步'&&r.距离>0).slice(0,10).reverse();
  if(!rs.length){document.getElementById('paceChart').innerHTML='<div class="empty-tip">暂无跑步数据</div>';return}
  const W=342,H=130,pad=16;
  const secs=s=>{const m=s.match(/(\d+)'(\d+)"/);return m?(+m[1])*60+(+m[2]):0};
  const vs=rs.map(r=>secs(r.配速显示)).filter(v=>v>0);
  const mn=Math.min(...vs), mx=Math.max(...vs), rg=(mx-mn)||1;
  const step=(W-pad*2)/(Math.max(rs.length-1,1));
  const pts=rs.map((r,i)=>{
    const x=pad+i*step, y=H-pad-((secs(r.配速显示)-mn)/rg)*(H-pad*2-24);
    return {x,y,r};
  });
  const poly=pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  document.getElementById('paceChart').innerHTML=`
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
      <g stroke="var(--grid)"><line x1="0" y1="${pad}" x2="${W}" y2="${pad}"/>
        <line x1="0" y1="${(H/2).toFixed(0)}" x2="${W}" y2="${(H/2).toFixed(0)}"/>
        <line x1="0" y1="${H-pad}" x2="${W}" y2="${H-pad}"/></g>
      <polyline fill="none" stroke="var(--run)" stroke-width="2.2" stroke-linejoin="round" points="${poly}"/>
      ${pts.map((p,i)=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${i===pts.length-1?5:3.2}"
        fill="${i===pts.length-1?'var(--gold)':'var(--run)'}" opacity="${i===pts.length-1?1:.55}"
        class="barhit" onclick="detailDay('${p.r.date}','跑步')"/>
        <rect x="${(p.x-14).toFixed(1)}" y="${(p.y-16).toFixed(1)}" width="28" height="30" fill="transparent" class="barhit"
        onclick="detailDay('${p.r.date}','跑步')"/>`).join('')}
      <text x="0" y="12" font-size="8.5" fill="var(--ink3)">上方＝更快</text>
      <text x="${W}" y="${H-2}" font-size="8.5" fill="var(--ink3)" text-anchor="end">最早 → 最新</text>
    </svg>
    <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--ink3);margin-top:4px">
      <span>${rs[0].date.slice(5)}</span><span>最快 ${rs.map(r=>r.配速显示).sort()[0]}</span><span>${rs[rs.length-1].date.slice(5)}</span></div>`;
}

/* ══ 手记配图：多次同类运动对比（2026-10-06 加）══
   只在手记详情 sheet 里出现，别的地方不引用。
   距离/爬升/心率/消耗一律从 D.recent 现算；只有「运动后心率恢复」这种
   原始明细里才有的数值跟在手记的 图表.恢复 上（recent 没这个字段）。 */
function jcBox(t,sub,svg,note){
  return `<div style="background:var(--emb);border:0.5px solid var(--line2);border-radius:10px;padding:9px 10px 6px;margin-top:9px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
      <b style="font-size:11px;font-weight:500;color:var(--ink)">${t}</b>
      <span style="font-size:8.5px;color:var(--ink3);white-space:nowrap">${sub}</span></div>
    ${svg}${note?`<div style="font-size:8.5px;color:var(--ink3);margin-top:3px">${note}</div>`:''}</div>`;
}
const jcSw=(c,o)=>`<i style="display:inline-block;width:7px;height:7px;border-radius:2px;background:${c};opacity:${o||1};vertical-align:-1px;margin-right:3px;margin-left:3px"></i>`;

function jCharts(e){
  const c=e.图表; if(!c||!c.日期) return '';
  const days=c.日期, ty=c.类型, W=342;
  const lbl=days.map(d=>d===e.date?d.slice(5)+' 今天':d.slice(5));
  const recs=days.map(d=>D.recent.filter(r=>r.date===d&&(!ty||r.类型===ty))[0]);
  if(recs.some(r=>!r)) return '';                    // 记录被删/没同步到就不画，别画半截
  const cl=i=>i===days.length-1?'var(--gold)':'var(--ink3)';

  /* ① 心率：均心 + 峰值（纵轴 130 起，否则三天差 7 bpm 根本看不出来） */
  const A=118,La=27,Ra=8,Ta=12,Ba=19,ha=A-Ta-Ba,va=v=>Ta+ha-(v-130)/65*ha,ga=(W-La-Ra)/days.length;
  let s1='';
  [130,150,170,190].forEach(v=>{s1+=`<line x1="${La}" y1="${va(v)}" x2="${W-Ra}" y2="${va(v)}" stroke="var(--grid)" stroke-width=".6"/>`
    +`<text x="${La-4}" y="${va(v)}" font-size="8" fill="var(--ink3)" text-anchor="end" dominant-baseline="middle">${v}</text>`});
  recs.forEach((r,i)=>{const cx=La+ga*(i+.5);
    [[r.平均心率,1],[r.最高心率,.42]].forEach((p,k)=>{
      const bw=21,bx=cx-23+k*24,y=va(p[0]);
      s1+=`<rect x="${bx.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${(Ta+ha-y).toFixed(1)}" rx="2" fill="var(--heart)" opacity="${p[1]}"/>`
        +`<text x="${(bx+bw/2).toFixed(1)}" y="${(y-3).toFixed(1)}" font-size="9" fill="var(--ink)" text-anchor="middle">${p[0]}</text>`});
    s1+=`<text x="${cx.toFixed(1)}" y="${A-6}" font-size="9" fill="${cl(i)}" text-anchor="middle">${lbl[i]}</text>`});
  const c1=jcBox('心率对比','bpm '+jcSw('var(--heart)')+' 均心 '+jcSw('var(--heart)',.42)+' 峰值',
    `<svg viewBox="0 0 ${W} ${A}" width="100%" height="${A}">${s1}</svg>`,'纵轴从 130 起');

  /* ② 运动后心率恢复：三条折线（结束时 → 60 秒 → 120 秒） */
  const rd=c.恢复; if(!rd||!rd.数据) return `<div class="sh2">数据对比</div>${c1}`;
  const B=126,Lb=27,Rb=30,Tb=12,Bb=19,hb=B-Tb-Bb,vb=v=>Tb+hb-(v-90)/100*hb;
  const st=(W-Lb-Rb)/(rd.标签.length-1), cols=['var(--ink3)','var(--run)','var(--gold)'];
  let s2='';
  [100,130,160,190].forEach(v=>{s2+=`<line x1="${Lb}" y1="${vb(v)}" x2="${W-Rb}" y2="${vb(v)}" stroke="var(--grid)" stroke-width=".6"/>`
    +`<text x="${Lb-4}" y="${vb(v)}" font-size="8" fill="var(--ink3)" text-anchor="end" dominant-baseline="middle">${v}</text>`});
  rd.数据.forEach((d,i)=>{
    s2+=`<polyline points="${d.map((v,j)=>`${(Lb+j*st).toFixed(1)},${vb(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${cols[i]}" stroke-width="${i===rd.数据.length-1?2.2:1.5}" opacity="${i===rd.数据.length-1?1:.8}" stroke-linejoin="round" stroke-linecap="round"/>`;
    d.forEach((v,j)=>{s2+=`<circle cx="${(Lb+j*st).toFixed(1)}" cy="${vb(v).toFixed(1)}" r="${i===rd.数据.length-1?3:2.3}" fill="${cols[i]}"/>`});
  });
  const lab=rd.数据.map((d,i)=>({v:d[d.length-1],y:vb(d[d.length-1]),c:cols[i]})).sort((a,b)=>a.y-b.y);
  for(let k=1;k<lab.length;k++) if(lab[k].y-lab[k-1].y<11) lab[k].y=lab[k-1].y+11;
  lab.forEach(o=>{s2+=`<text x="${(Lb+(rd.标签.length-1)*st+4).toFixed(1)}" y="${o.y.toFixed(1)}" font-size="9" fill="${o.c}" dominant-baseline="middle">${o.v}</text>`});
  rd.标签.forEach((t,j)=>{s2+=`<text x="${(Lb+j*st).toFixed(1)}" y="${B-6}" font-size="8.5" fill="var(--ink3)" text-anchor="${j===0?'start':j===rd.标签.length-1?'end':'middle'}">${t}</text>`});
  const c2=jcBox('运动后心率恢复','bpm '+days.map((d,i)=>jcSw(cols[i])+d.slice(5)).join(' '),
    `<svg viewBox="0 0 ${W} ${B}" width="100%" height="${B}">${s2}</svg>`,'线越陡＝恢复越快');

  /* ③ 距离（柱）＋ 每公里消耗（线，右轴） */
  const C=126,Lc=27,Rc=30,Tc=12,Bc=19,hc=C-Tc-Bc,gc=(W-Lc-Rc)/days.length;
  const pk=recs.map(r=>Math.round((r.消耗||0)/(r.距离||1)));
  const vd=v=>Tc+hc-(v/3.5)*hc, vk=v=>Tc+hc-(v-100)/40*hc;
  let s3='';
  [0,1,2,3].forEach(v=>{s3+=`<line x1="${Lc}" y1="${vd(v)}" x2="${W-Rc}" y2="${vd(v)}" stroke="var(--grid)" stroke-width=".6"/>`
    +`<text x="${Lc-4}" y="${vd(v)}" font-size="8" fill="var(--ink3)" text-anchor="end" dominant-baseline="middle">${v}</text>`});
  [100,120,140].forEach(v=>{s3+=`<line x1="${W-Rc}" y1="${vk(v)}" x2="${W-Rc+3}" y2="${vk(v)}" stroke="var(--line)" stroke-width=".6"/>`
    +`<text x="${W-Rc+5}" y="${vk(v)}" font-size="8" fill="var(--ink3)" dominant-baseline="middle">${v}</text>`});
  const cx3=recs.map((r,i)=>Lc+gc*(i+.5));
  s3+=`<polyline points="${pk.map((v,i)=>`${cx3[i].toFixed(1)},${vk(v).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--gold)" stroke-width="1.8" stroke-linejoin="round"/>`;
  recs.forEach((r,i)=>{
    const bw=26,bx=cx3[i]-bw/2,y=vd(r.距离||0);
    s3+=`<rect x="${bx.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${(Tc+hc-y).toFixed(1)}" rx="2" fill="var(--run)" opacity=".85"/>`
      +`<text x="${cx3[i].toFixed(1)}" y="${(y-3).toFixed(1)}" font-size="9" fill="var(--ink)" text-anchor="middle">${r.距离}</text>`
      +`<circle cx="${cx3[i].toFixed(1)}" cy="${vk(pk[i]).toFixed(1)}" r="3" fill="var(--gold)"/>`
      +`<text x="${cx3[i].toFixed(1)}" y="${(vk(pk[i])-6).toFixed(1)}" font-size="9" fill="var(--gold)" text-anchor="middle">${pk[i]}</text>`
      +`<text x="${cx3[i].toFixed(1)}" y="${C-6}" font-size="9" fill="${cl(i)}" text-anchor="middle">${lbl[i]}</text>`});
  const c3=jcBox('走得越远 · 越省','km '+jcSw('var(--run)',.85)+' 距离　'+jcSw('var(--gold)')+' kcal/公里',
    `<svg viewBox="0 0 ${W} ${C}" width="100%" height="${C}">${s3}</svg>`,'柱越高＝走得越远；金线越低＝每公里越省力');

  return `<div class="sh2">数据对比</div>${c1}${c2}${c3}`;
}

/* 渲染：手记列表 */
function renderJ(){
  document.getElementById('jlist').innerHTML=D.journal.map(e=>`
    <div class="card tap" style="margin-bottom:10px" onclick="openJ('${e.date}')">
      <div class="block">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <b style="font-size:13px">${e.date.slice(5)} ${e.time||''} · 疲劳 ${e.疲劳}/5</b>
          <span style="font-size:10px;color:var(--gold);flex:none">${e.图表?'看点评 + '+((e.图表.日期||[]).length)+' 天对比图 ▸':'看点评 ▸'}</span></div>
        <div style="font-size:11.5px;color:var(--ink2);margin-top:8px;line-height:1.6">
          ${esc(e.结论)}</div>
        <div class="fail" style="margin-top:8px">${[1,2,3,4,5].map(i=>`<i class="${i<=e.疲劳?'on':''}"></i>`).join('')}
          <span style="font-size:9px;color:var(--ink3);margin-left:5px">${['轻松','有点累','累但能扛','很累','撑不住'][e.疲劳-1]}</span></div>
      </div></div>`).join('');
}

/* 手记正文（感受 / 补给 / 结论 / 图表 / 要点 / 建议）—— 日历详情页与手记弹层共用同一段 */
function jBlock(e){
  if(!e||!e.date) return '';
  let h='';
  if(e.感受) h+=`<div class="sh2" style="margin-top:14px">他的感受</div><div class="quote">${esc(e.感受)}</div>`;
  /* 补给：数据管道一直有传（build_preview_data.py 的 journal 映射），但页面从来没渲染过
     —— 2026-10-13 才发现 09-25 那条的「1.4L 凉白开 + 电解质水」一直没显示。放在感受后面。 */
  if(e.补给) h+=`<div class="sst" style="margin-top:8px">补给 · ${esc(e.补给)}</div>`;
  if(e.结论) h+=`<div class="sh2">点评</div><b style="font-size:12.5px">${esc(e.结论)}</b>`;
  h+=jCharts(e);
  if(e.要点&&e.要点.length) h+=`<div class="sh2">关键数据</div><div class="adv" style="margin-top:6px">${
    e.要点.map(p=>`<li><span class="tag">${tagText(p[0])}</span>${esc(p[1])}</li>`).join('')}</div>`;
  if(e.建议&&e.建议.length) h+=`<div class="sh2">建议</div><div class="adv">${
    e.建议.map(s=>`<li>${esc(s)}</li>`).join('')}</div>`;
  return h;
}

function openJ(date){
  const e=D.journal.find(x=>x.date===date)||{};
  openSheet(`<h3>${date.slice(5)} 训练手记</h3><div class="sst">记录时间 ${e.time||'—'} · 疲劳度 ${e.疲劳}/5（${['轻松','有点累','累但能扛','很累','撑不住'][e.疲劳-1]||'—'}）</div>${jBlock(e)}`);
}

/* ── 日历 ── */
function viewCal(){
  if(ST.caly) return calYearView();          // 年视图（12 宫格）分支
  if(ST.embed) ST.ym=CUR_YM;                 /* 嵌在记录页里时，默认跟着当前月份 */
  const ymp=ST.ym, [Y,M]=ymp.split('-').map(Number);
  const first=new Date(Y,M-1,1), lead=(first.getDay()+6)%7;
  const days=new Date(Y,M,0).getDate();
  const byday={}; D.recent.forEach(r=>{(byday[r.date]=byday[r.date]||[]).push(r)});
  const today=new Date().toISOString().slice(0,10);
  let cells='';
  for(let i=0;i<lead;i++) cells+='<div class="cd empty"></div>';
  for(let d=1;d<=days;d++){
    const ds=`${ymp}-${String(d).padStart(2,'0')}`;
    const list=byday[ds]||[];
    const cls=['cd', list.length?'hit':'', ds===today?'now':''].join(' ');
    const pills=list.slice(0,2).map(r=>{const k=(TY[r.类型]||['·'])[1];
      return `<span class="pl ${k==='run'?'run':k==='ride'?'ride':k==='lift'?'lift':'walk'}">${r.类型.slice(0,2)} ${Math.round(r.时长)}′</span>`}).join('');
    cells+=`<div class="${cls}" onclick="${list.length?`detailDay('${ds}')`:`toast('${d} 号没有训练记录')`}">
      <span class="cdn">${d}</span>${pills}</div>`;
  }
  /* 翻月边界：最晚＝本月（翻不到未来），最早＝数据起点。
     ⚠️ 别写死"往前 N 个月"（以前写过 2026-08 / 本月-2，过一个月就错）——
     年视图能把用户带到任何有数据的月份，翻月箭头必须跟得到数据起点。 */
  const minYm=(Object.keys(D.overview||{}).sort()[0])||monShift(CUR_YM,-23);
  const prev=ymp===minYm?'off':'';
  const nx=ymp===CUR_YM?'off':'';
  return (ST.embed?'':
    head({month:`${Y} · ${String(M).padStart(2,'0')}`,t:'训练日历',s:'点任意一天，看当天练了什么 · 点月份名看全年'},'Calendar'))+
  `<div class="wrap"><div class="sec">
    <div class="card block">
      <div class="teartop"></div>
      <div class="bind"><i></i><i></i></div>
      <div class="mnav">
        <div class="arw ${prev}" onclick="${prev?'':`navMonth(-1)`}">‹</div>
        <div class="ytit" style="display:flex;align-items:baseline;gap:7px">
          <b onclick="calYearOpen()">${Y} 年 ${M} 月 <span style="font-size:11px;color:var(--gold)">›</span></b>
          <button class="btn ${ymp===CUR_YM?'off':''}" onclick="navToday()">回到本月</button>
        </div>
        <div class="arw ${nx}" onclick="${nx?'':`navMonth(1)`}">›</div>
      </div>
      <div class="ch7">${WD.map(d=>`<span>${d[1]}</span>`).join('')}</div>
      <div class="cg">${cells}</div>
      <div class="cap">有运动的那天格子上有标签 · 点开看当天明细 · 今天是金色边框 · 点「${Y} 年 ${M} 月」看全年</div>
    </div>
    ${calMonthRecap(ymp)}
  </div></div>`;
}
/* 月度概览卡：2×2 小 KPI + 一段总结。数据全从 overview[ym].workouts 现算，不写死。 */
function calMonthRecap(ym){
  const ov=(D.overview||{})[ym];
  const [Y,M]=ym.split('-').map(Number);
  const title=`<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px">
    <span style="font-size:10px;color:var(--ink3);letter-spacing:2px">MONTHLY REVIEW</span>
    <b style="font-size:12px;color:var(--ink)">${Y} 年 ${M} 月</b></div>`;
  if(!ov||!ov.次数) return `<div class="card" style="margin-top:10px"><div class="block">${title}
    <div style="font-size:11.5px;color:var(--ink3);line-height:1.7">${ym>CUR_YM?'这个月还没到。':'这个月没有训练记录。'}</div></div></div>`;
  const ws=ov.workouts||[];
  const hrw=ws.filter(w=>w.平均心率>0);
  const ahr=hrw.length?Math.round(hrw.reduce((a,w)=>a+w.平均心率*w.时长,0)/hrw.reduce((a,w)=>a+w.时长,0)):null;
  const mx=ws.reduce((a,w)=>w.时长>(a?.时长||0)?w:a,null);
  const days=ov.天数||Object.keys(ws.reduce((a,w)=>(a[w.date]=1,a),{})).length;
  const stat=(v,l)=>`<div class="mst"><div class="v">${v}</div><div class="lb">${l}</div></div>`;
  const line=ahr
    ?`${M} 月共 <b style="color:var(--gold)">${ov.次数}</b> 次运动、练了 <b>${days}</b> 天，累计 <b>${fmtDur(ov.总时长)}</b>、消耗 <b>${fmtNum(ov.总消耗)}</b> 千卡；平均心率 <b>${ahr}</b> 次/分${mx?`，最长的一次是 ${+mx.date.slice(5,7)}/${+mx.date.slice(8)}${mx.类型}（${fmtDur(mx.时长)}）`:''}。`
    :`${M} 月共 <b style="color:var(--gold)">${ov.次数}</b> 次运动、练了 <b>${days}</b> 天，累计 <b>${fmtDur(ov.总时长)}</b>、消耗 <b>${fmtNum(ov.总消耗)}</b> 千卡${mx?`，最长的一次是 ${+mx.date.slice(5,7)}/${+mx.date.slice(8)}${mx.类型}（${fmtDur(mx.时长)}）`:''}。`;
  return `<div class="card" style="margin-top:10px"><div class="block">${title}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      ${stat(`${ov.次数}<u>次</u>`,'训练次数')}
      ${stat(fmtDur(ov.总时长),'累计时长')}
      ${stat(`${fmtNum(ov.总消耗)}<u>千卡</u>`,'消耗') }
      ${stat(ahr?`${ahr}<u>次/分</u>`:'—','平均心率')}
    </div>
    <div style="font-size:11.5px;color:var(--ink2);line-height:1.8;border-top:1px solid var(--line2);margin-top:11px;padding-top:10px">${line}</div>
  </div></div>`;
}
function monShift(ym,n){const[Y,M]=ym.split('-').map(Number);const d=new Date(Y,M-1+n,1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
/* 翻月：hash 不变时 go() 不会触发重渲染，必须直接调 route() */
function navMonth(n){ST.ym=monShift(ST.ym,n);route()}
const CUR_YM=(()=>{const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')})();
function navToday(){ST.ym=CUR_YM;route()}

/* ── 年视图（12 宫格）：点日历顶部的「X 年 X 月」进来，点任意月份回到那月的日历 ── */
function calYearOpen(){ST.caly=1;ST.calyr=Number(ST.ym.slice(0,4));route()}
function calPick(ym){ST.caly=0;ST.ym=ym;route()}
function calYearShift(n){ST.calyr+=n;route()}
function calYearView(){
  const Y=ST.calyr||Number(CUR_YM.slice(0,4));
  const OV=D.overview||{};
  const ovKeys=Object.keys(OV).sort();               // 倒序存的，sort() 后 [0] 是最早的月
  const minY=Number((ovKeys[0]||'2025-01').slice(0,4)), maxY=Number(CUR_YM.slice(0,4));
  let cells='';
  for(let m=1;m<=12;m++){
    const ym=`${Y}-${String(m).padStart(2,'0')}`;
    const ov=OV[ym], fut=ym>CUR_YM, now=ym===CUR_YM, hit=ov&&ov.次数>0;
    const cls=['mc',hit?'hit':'',now?'now':'',fut?'fut':''].join(' ');
    const sub=fut?'—':(hit?`${ov.次数} 次 · ${fmtDur(ov.总时长)}`:'无训练');
    cells+=`<div class="${cls}" ${fut?'':`onclick="calPick('${ym}')"`}>
      <b>${m} 月</b><span>${sub}</span></div>`;
  }
  const pv=Y>minY?'':'off', nx=Y<maxY?'':'off';
  const yk=ovKeys.filter(k=>k.startsWith(Y+'-'));
  const ytot=yk.reduce((a,k)=>a+(OV[k].次数||0),0);
  const ydur=yk.reduce((a,k)=>a+(OV[k].总时长||0),0);
  const yen=yk.reduce((a,k)=>a+(OV[k].总消耗||0),0);
  const ymon=yk.filter(k=>(OV[k].次数||0)>0).length;
  const stat=(v,l)=>`<div class="mst"><div class="v">${v}</div><div class="lb">${l}</div></div>`;
  return head({month:`${Y}`,t:'全年月历',s:'点开一个月，回到那月的训练日历'},'Months')+
  `<div class="wrap"><div class="sec"><div class="card block">
    <div class="teartop"></div><div class="bind"><i></i><i></i></div>
    <div class="mnav">
      <div class="arw ${pv}" onclick="${pv?'':`calYearShift(-1)`}">‹</div>
      <b>${Y} 年</b>
      <div class="arw ${nx}" onclick="${nx?'':`calYearShift(1)`}">›</div>
    </div>
    <div class="mg">${cells}</div>
    <div class="cap">金色边框是本月 · 有底色的月份练过 · 点任意月份回到那月</div>
  </div>
  <div class="card" style="margin-top:10px"><div class="block">
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px">
      <span style="font-size:10px;color:var(--ink3);letter-spacing:2px">YEARLY REVIEW</span>
      <b style="font-size:12px;color:var(--ink)">${Y} 年${Y===Number(CUR_YM.slice(0,4))?'（至今）':''}</b></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      ${stat(`${ytot}<u>次</u>`,'训练次数')}
      ${stat(fmtDur(ydur),'累计时长')}
      ${stat(`${fmtNum(yen)}<u>千卡</u>`,'总消耗')}
      ${stat(`${ymon}<u>/ 12</u>`,`练过的月份${Y===Number(CUR_YM.slice(0,4))?'（至今）':''}`)}
    </div>
  </div></div></div></div>`;
}

/* ── 有氧（跑步）/ 无氧（器械）专区 ── */
function repsNum(s){
  const p=String(s||'').split(/[–—\-~]/).map(v=>parseFloat(v)).filter(v=>!isNaN(v));
  if(!p.length) return 0;
  return p.length>1 ? (p[0]+p[1])/2 : p[0];
}
function volOf(it){return (it.kg||0)*(it.sets||0)*repsNum(it.reps)}
function secOf(s){const m=String(s||'').match(/(\d+)'(\d+)"/);return m?(+m[1])*60+(+m[2]):0}
/* 心率用的实心 ♥（SVG 而非 emoji：emoji 在 iOS/安卓上样式和大小都不一样，
   而且彩色 emoji 不跟随深/浅色主题，这里用 currentColor 吃到 --heart）。 */
const HEART='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.2 4.1 13.3a5 5 0 0 1 7.1-7.1l.8.8.8-.8a5 5 0 0 1 7.1 7.1z"/></svg>';

/* ═══════════ v5 分析页：四个维度收进一个 tab ═══════════
   原来「训练 / 体重 / 路线」各占一个底栏 tab，一共五个，太挤。
   现在合并成「分析」，内部用分段切换，底栏回归四个。
   复用老视图：把它们渲染出来的 .wrap 内部内容抽出来嵌进去，避免两个页头。 */
function embedOf(fn){
  const t=document.createElement('div');
  try{ t.innerHTML=fn(); }catch(e){ return '<div class="empty-tip">这段内容加载失败</div>' }
  const w=t.querySelector('.wrap');
  return w?w.innerHTML:t.innerHTML;
}
function viewAnalyze(){
  const seg=ST.aseg||'run';
  const SEGS=[['run','有氧'],['lift','器械'],['body','体重'],['route','轨迹']];
  const sub={run:'配速、距离与心率的变化',lift:'重量、组数与训练容量',
    body:'体重、体脂与围度',route:'GPS 轨迹与每公里分段'}[seg];
  const inner = seg==='run'?embedOf(runBody)
    : seg==='lift'?embedOf(liftBody)
    : seg==='body'?embedOf(viewBody)
    : embedOf(viewRoute);
  return head({month:spanLabel((D.recent||[]).map(r=>r.date)),t:'分析',s:sub},'Analytics')+
  `<div class="wrap">
    <div class="sec" style="margin-top:16px">
      <div class="segbar" role="tablist" aria-label="分析维度">
        ${SEGS.map(([k,l])=>`<button role="tab" aria-selected="${seg===k}" class="${seg===k?'on':''}" onclick="setAseg('${k}')">${l}</button>`).join('')}
      </div>
    </div>
    <div class="aseg">${inner}</div>
  </div>`;
}
function setAseg(k){
  if(ST.aseg===k) return;
  const y=window.scrollY;
  ST.aseg=k; route();
  window.scrollTo(0,y);
}

function viewTrain(){
  const tab=localStorage.getItem('tseg')||'run';
  const src=tab==='run'?(D.runs||D.recent.filter(r=>r.类型==='跑步')):(D.strength||[]);
  return head({month:spanLabel(src.map(x=>x.date)),t:tab==='run'?'有氧 · 跑步':'无氧 · 器械',
    s:tab==='run'?'配速、距离与心率的变化':'重量、组数与训练容量'},tab==='run'?'Cardio':'Strength')+
  `<div class="wrap">
    <div class="seg">
      <button class="${tab==='run'?'on':''}" onclick="localStorage.setItem('tseg','run');route()">有氧 · 跑步</button>
      <button class="${tab==='lift'?'on':''}" onclick="localStorage.setItem('tseg','lift');route()">无氧 · 器械</button>
    </div>
    <div id="tsegBody">${tab==='run'?runBody():liftBody()}</div>
  </div>`;
}

function runBody(){
  const rs=(D.runs||D.recent.filter(r=>r.类型==='跑步')).slice().sort((a,b)=>a.date<b.date?1:-1);
  if(!rs.length) return '<div class="empty-tip">暂无跑步数据</div>';
  const tot=rs.reduce((a,b)=>a+b.距离,0), kcal=rs.reduce((a,b)=>a+(b.消耗||0),0);
  const avg=rs.reduce((a,b)=>a+(b.平均心率||0),0)/rs.length;
  const paces=rs.map(r=>secOf(r.配速显示)).filter(v=>v>0);
  const best=Math.min(...paces), worst=Math.max(...paces);
  const fmm=s=>Math.floor(s/60)+"'"+String(Math.round(s%60)).padStart(2,'0')+'"';
  const chr=rs.slice().reverse();          /* 最早 → 最新（图表从左往右） */
  const W=342,H=132,pad=18;
  const mn=best-10,mx=worst+10,rg=mx-mn||1;
  const step=(W-pad*2)/Math.max(rs.length-1,1);
  const pt=chr.map((r,i)=>[pad+i*step, H-pad-((secOf(r.配速显示)-mn)/rg)*(H-pad*2-28)]);
  const dists=rs.map(r=>r.距离), dmx=Math.max(...dists)||1;
  return `
  <div class="sec"><div class="shead"><span class="no">01</span><span class="tt">跑步总览</span><span class="en2">Summary</span><span class="ln"></span></div>
    <div class="card"><div class="strip" style="border-top:0;margin:0">
      <div><b>${rs.length}<u>次</u></b><span>跑步次数</span></div>
      <div><b>${tot.toFixed(1)}<u>km</u></b><span>总距离</span></div>
      <div><b>${fmm(best)}</b><span>最好配速</span></div>
      <div><b>${Math.round(avg)}<u>bpm</u></b><span>平均心率</span></div>
    </div></div></div>

  <div class="sec"><div class="shead"><span class="no">02</span><span class="tt">配速走势</span><span class="en2">Pace</span><span class="ln"></span></div>
    <div class="card block">
      <div class="chartbox">
        <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
          <g stroke="var(--grid)"><line x1="0" y1="${pad}" x2="${W}" y2="${pad}"/>
            <line x1="0" y1="${(H/2).toFixed(0)}" x2="${W}" y2="${(H/2).toFixed(0)}"/>
            <line x1="0" y1="${H-pad}" x2="${W}" y2="${H-pad}"/></g>
          <polyline fill="none" stroke="var(--run)" stroke-width="2.2" stroke-linejoin="round"
            points="${pt.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}"/>
          ${pt.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===pt.length-1?5:3.2}"
            fill="${i===pt.length-1?'var(--gold)':'var(--run)'}" opacity="${i===pt.length-1?1:.5}" class="barhit"
            onclick="detailDay('${chr[i].date}','跑步')"/>
            <rect x="${(p[0]-13).toFixed(1)}" y="${(p[1]-16).toFixed(1)}" width="26" height="30" fill="transparent" class="barhit"
            onclick="detailDay('${chr[i].date}','跑步')"/>`).join('')}
          <text x="0" y="12" font-size="8.5" fill="var(--ink3)">上方＝更快</text>
          <text x="${W}" y="12" font-size="9" fill="var(--gold)" text-anchor="end">最新 ${rs[0].配速显示}</text>
        </svg>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--ink3);margin-top:4px">
        <span>${chr[0].date.slice(5)}（最早）</span><span>最慢 ${fmm(worst)}</span><span>${chr[chr.length-1].date.slice(5)}（最新）</span></div>
      <div class="cap">点任意一次看当天明细</div>
    </div></div>

  <div class="sec"><div class="shead"><span class="no">03</span><span class="tt">最近跑量</span><span class="en2">Distance</span><span class="ln"></span></div>
    <div class="card block">
      <svg viewBox="0 0 ${W} 152" width="100%" height="152">
        <g stroke="var(--grid)"><line x1="0" y1="16" x2="${W}" y2="16"/>
          <line x1="0" y1="60" x2="${W}" y2="60"/><line x1="0" y1="104" x2="${W}" y2="104"/>
          <line x1="0" y1="126" x2="${W}" y2="126"/></g>
        ${(()=>{const bs=chr.slice(-12), n=bs.length, slot=(W-16)/n, bw=Math.min(slot-8,26);
          return bs.map((r,i)=>{
          const h=Math.max((r.距离/(dmx*1.08))*98,3), x=8+i*slot+(slot-bw)/2, y=126-h;
          return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4"
              fill="var(--run)" opacity="${i===n-1?1:.45}" class="barhit" onclick="detailDay('${r.date}','跑步')"/>
            <text x="${(x+bw/2).toFixed(1)}" y="${(y-4).toFixed(1)}" font-size="8.5" fill="var(--ink)" text-anchor="middle"
              font-family="ui-monospace,Menlo,monospace">${r.距离.toFixed(1)}</text>
            ${(i%2===0||i===n-1)?`<text x="${(x+bw/2).toFixed(1)}" y="144" font-size="8" fill="var(--ink3)" text-anchor="middle">${r.date.slice(5)}</text>`:''}`;}).join('')})()}
      </svg>
      <div class="cap">柱高＝单次距离（km）· 实心柱为最近一次 · 从左到右由早到近 · 点柱子看那次跑步</div>
    </div></div>

  <div class="sec"><div class="shead"><span class="no">04</span><span class="tt">月跑量</span><span class="en2">Monthly</span><span class="ln"></span></div>
    <div class="card block">
      ${(()=>{const bym={}; rs.forEach(r=>{const k=r.date.slice(0,7); bym[k]=(bym[k]||0)+r.距离;});
        const ks=Object.keys(bym).sort().slice(-6), mx2=Math.max(...ks.map(k=>bym[k]))||1;
        return `<svg viewBox="0 0 ${W} 132" width="100%" height="132">
          <line x1="0" y1="104" x2="${W}" y2="104" stroke="var(--grid)"/>
          ${ks.map((k,i)=>{const slot=(W-16)/ks.length, bw=Math.min(slot-14,38);
            const h=Math.max((bym[k]/mx2)*90,3), x=8+i*slot+(slot-bw)/2, y=104-h;
            return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4"
                fill="var(--gold)" opacity="${i===ks.length-1?1:.5}"/>
              <text x="${(x+bw/2).toFixed(1)}" y="${(y-4).toFixed(1)}" font-size="9" fill="var(--ink)" text-anchor="middle"
                font-family="ui-monospace,Menlo,monospace">${bym[k].toFixed(1)}</text>
              <text x="${(x+bw/2).toFixed(1)}" y="120" font-size="8.5" fill="var(--ink3)" text-anchor="middle">${k.slice(5)}月</text>`}).join('')}
        </svg>`;})()}
      <div class="cap">最近 6 个月的累计跑量（km）</div>
    </div></div>

  <div class="sec"><div class="shead"><span class="no">05</span><span class="tt">心率与配速对照</span><span class="en2">HR vs Pace</span><span class="ln"></span></div>
    <div class="card block">
      ${(()=>{const top=rs.slice(0,10);
        /* 条形比例和「金色＝最快」都按**这 10 次自己**比。
           ⚠️ 别再借用 viewTrain 顶层的 best/worst —— 那是全量跑步算出来的，
           全量最快的一次多半不在这 10 条里，金色永远不会亮。 */
        const tp=top.map(r=>secOf(r.配速显示)).filter(v=>v>0);
        const tb=Math.min(...tp), tw=Math.max(...tp);
        /* 条形长度：最慢的也留 12%，否则 10 次里出现一次特别慢的（如 7'02"）
           会被压成一个几乎看不见的点，看着像没渲染出来。 */
        return top.map(r=>{const p=secOf(r.配速显示);
          const w=Math.min(100,Math.max(((tw-p)/(tw-tb||1))*100,12));
          return `<div class="prow tap" onclick="detailDay('${r.date}','跑步')">
          <span class="pdate">${r.date.slice(5)}</span>
          <span class="ptrack"><i class="${p===tb?'fast':''}" style="width:${w.toFixed(0)}%"></i></span>
          <span class="pval"><span class="ppace">${r.配速显示}</span><span class="phr">${HEART}${r.平均心率||'—'}</span></span></div>`}).join('')})()}
      <div class="cap">条越长越快，金色＝这 10 次里最快 · 右侧：配速 ｜ ♥ 平均心率（bpm）· 点任意一行看当天明细</div>
    </div></div>

  <div class="sec"><div class="shead"><span class="no">06</span><span class="tt">跑步明细</span><span class="en2">Log</span><span class="ln"></span></div>
    ${(()=>{const ys=[...new Set(rs.map(r=>r.date.slice(0,4)))].sort().reverse();
      if(!ST.runY||!ys.includes(ST.runY)) ST.runY=ys[0];
      const yr=rs.filter(r=>r.date.startsWith(ST.runY));
      const ytot=yr.reduce((a,b)=>a+b.距离,0);
      const bym={}; yr.forEach(r=>{const m=+r.date.slice(5,7);(bym[m]=bym[m]||[]).push(r)});
      return `<div class="ychips">${ys.map(v=>`<button class="btn ${v===ST.runY?'':'off'}" onclick="ST.runY='${v}';route()">${v} 年</button>`).join('')}</div>
      <div class="card block">
        <div style="font-size:11.5px;color:var(--ink2);line-height:1.7;margin-bottom:4px">
          <b style="color:var(--gold)">${ST.runY} 年</b> 共 <b>${yr.length}</b> 次 · ${ytot.toFixed(1)} km</div>
        ${Object.keys(bym).map(Number).sort((a,b)=>b-a).map(m=>{const list=bym[m];
          const mt=list.reduce((a,b)=>a+b.距离,0);
          return `<div class="sh2">${ST.runY} 年 ${m} 月 · ${list.length} 次 · ${mt.toFixed(1)} km</div>
          <table>
            <tr><th>日期</th><th>距离</th><th>配速</th><th>心率</th><th>消耗</th></tr>
            ${list.map(r=>`<tr onclick="detailDay('${r.date}','跑步')" style="cursor:pointer">
              <td>${r.date.slice(5)}</td><td>${r.距离.toFixed(2)}</td><td>${r.配速显示}</td><td>${r.平均心率}</td><td>${r.消耗}</td></tr>`).join('')}
          </table>`;}).join('')}
        <div class="cap">点任意一行看当天明细 · 历史合计 ${tot.toFixed(1)} km · ${kcal} kcal</div>
      </div>`;})()}
    </div></div>`;
}

const GEAR={'自重':'徒手','器械':'固定器械'};
function gearOf(it){return GEAR[it.gear]||it.gear||''}

function liftBody(){
  const ss=D.strength.slice().sort((a,b)=>a.date<b.date?1:-1);
  if(!ss.length) return '<div class="empty-tip">暂无器械记录</div>';
  const byPart={}; let totSets=0, totItems=0;
  const byGear={};
  ss.forEach(s=>s.items.forEach(it=>{
    const p=it.部位||'其他';
    byPart[p]=(byPart[p]||0)+(it.sets||0);
    const g=gearOf(it)||'其他';
    byGear[g]=(byGear[g]||0)+(it.sets||0);
    totSets+=(it.sets||0); totItems++;
  }));
  const parts=Object.entries(byPart).sort((a,b)=>b[1]-a[1]);
  const gears=Object.entries(byGear).sort((a,b)=>b[1]-a[1]);
  const COL={'胸':'var(--lift)','背':'var(--run)','腿臀':'var(--green)','肩':'var(--warn)',
    '手臂':'#9CA3AF','核心':'var(--gold)','其他':'var(--ink3)'};
  let acc=0, segs=''; const C=2*Math.PI*46, pTot=parts.reduce((a,b)=>a+b[1],0)||1;
  parts.forEach(([p,n])=>{
    segs+=`<circle cx="60" cy="60" r="46" fill="none" stroke="${COL[p]||'var(--ink3)'}" stroke-width="13"
      stroke-dasharray="${(n/pTot*C).toFixed(1)} 999" stroke-dashoffset="${(-acc*C).toFixed(1)}"
      transform="rotate(-90 60 60)"></circle>`; acc+=n/pTot;
  });
  const last=ss[0];
  const today0=new Date(); today0.setHours(0,0,0,0);
  const daysAgo=Math.round((today0-new Date(last.date+'T00:00:00'))/864e5);
  const setsOf=s=>s.items.reduce((a,i)=>a+(i.sets||0),0);
  const smx=Math.max(...ss.map(setsOf))||1;

  /* 个人最好成绩：按动作取最大重量 */
  const best={};
  ss.forEach(s=>s.items.forEach(it=>{
    if(!it.kg) return;
    const b=best[it.name];
    if(!b||it.kg>b.kg) best[it.name]={kg:it.kg,date:s.date,gear:gearOf(it),sets:it.sets,reps:it.reps};
  }));
  const prList=Object.entries(best).sort((a,b)=>b[1].kg-a[1].kg).slice(0,8);
  const bwList=[];
  ss.forEach(s=>s.items.forEach(it=>{if(!it.kg) bwList.push({name:it.name,sets:it.sets,reps:it.reps,date:s.date})}));

  return `
  <div class="sec"><div class="shead"><span class="no">01</span><span class="tt">器械总览</span><span class="en2">Summary</span><span class="ln"></span></div>
    <div class="card"><div class="strip" style="border-top:0;margin:0">
      <div><b>${ss.length}<u>次</u></b><span>训练次数</span></div>
      <div><b>${totSets}<u>组</u></b><span>累计组数</span></div>
      <div><b>${parts.length}<u>处</u></b><span>练到部位</span></div>
      <div><b>${daysAgo}<u>天前</u></b><span>上次是 ${last.date.slice(5)}</span></div>
    </div></div></div>

  <div class="sec"><div class="shead"><span class="no">02</span><span class="tt">练了哪些部位</span><span class="en2">By Part</span><span class="ln"></span></div>
    <div class="card block"><div style="display:flex;gap:16px;align-items:center">
      <svg viewBox="0 0 120 120" width="106" height="106" style="flex:none">
        <circle cx="60" cy="60" r="46" fill="none" stroke="var(--line2)" stroke-width="13"/>${segs}
        <text x="60" y="57" text-anchor="middle" font-size="21" font-weight="600" fill="var(--ink)">${totSets}</text>
        <text x="60" y="71" text-anchor="middle" font-size="9" fill="var(--ink3)" letter-spacing="1">总组数</text></svg>
      <div style="flex:1;min-width:0">${parts.map(([p,n])=>`<div class="lgr">
        <span class="dot" style="background:${COL[p]||'var(--ink3)'}"></span><b>${p}</b>
        <span class="vv">${n} 组 · ${Math.round(n/pTot*100)}%</span></div>`).join('')}</div>
    </div><div class="cap">按组数统计 · 复合动作计入主要发力部位</div></div></div>

  <div class="sec"><div class="shead"><span class="no">03</span><span class="tt">每次练了多少</span><span class="en2">Per Session</span><span class="ln"></span></div>
    <div class="card block">
      <svg viewBox="0 0 342 ${ss.length*46+8}" width="100%" height="${ss.length*46+8}">
        ${ss.map((s,i)=>{const y=i*46+6, w=Math.max((setsOf(s)/smx)*176,3), ps={};
          s.items.forEach(it=>{const p=it.部位||'其他'; ps[p]=(ps[p]||0)+(it.sets||0)});
          const pstr=Object.keys(ps).map(p=>p+' '+ps[p]+'组').join(' · ');
          return `<g class="barhit" onclick="detailDay('${s.date}','lift')"><text x="0" y="${y+11}" font-size="9.5" fill="var(--ink3)">${s.date.slice(5)}</text>
            <rect x="42" y="${y}" width="${w.toFixed(1)}" height="12" rx="3" fill="var(--lift)" opacity="${i===0?1:.5}"/>
            <text x="${(42+w+6).toFixed(1)}" y="${y+11}" font-size="9.5" fill="var(--ink)">${setsOf(s)} 组 · ${s.items.length} 个动作</text>
            <text x="42" y="${y+25}" font-size="8.5" fill="var(--ink3)">${pstr}</text></g>`}).join('')}
      </svg>
      <div class="cap">条长＝这一次做了多少组 · 下面一行是这次练的部位 · 点任意一行，弹出那天练了什么</div>
    </div></div>

  <div class="sec"><div class="shead"><span class="no">04</span><span class="tt">我能推多重</span><span class="en2">Best Lift</span><span class="ln"></span></div>
    <div class="card block">
      ${prList.map(([n,b],i)=>`<div class="pr ${i===0?'top':''} tap" onclick="toast('${esc(n)}：最好 ${b.kg} kg，${b.date.slice(5)} 做到的')">
        <div class="rk">${i+1}</div>
        <div class="mid"><b>${esc(n)}</b>
          <div class="meta">${b.gear?esc(b.gear)+' · ':''}${b.date.slice(5)} 达成${b.sets?' · '+b.sets+' 组 × '+b.reps:''}</div></div>
        <div class="vv"><b>${b.kg}<u> kg</u></b><span>最好成绩</span></div></div>`).join('')}
      ${bwList.length?`<div class="sh2">徒手动作（不加重量）</div>
        <div class="chips" style="margin-top:2px">${bwList.map(x=>
          `<span class="chip">${esc(x.name)} ${x.sets} 组 × ${x.reps}</span>`).join('')}</div>
        <div class="cap">俯卧撑、仰卧起坐这类不加铁的动作，看次数而不是重量</div>`:''}
      <div class="cap">同一个动作取你做过最重的那一次 · 不同健身房的器械重量不能直接比</div>
    </div></div>

  <div class="sec"><div class="shead"><span class="no">05</span><span class="tt">用过哪些器械</span><span class="en2">Equipment</span><span class="ln"></span></div>
    <div class="card block">
      ${gears.map(([g,n],gi)=>{const gmx=gears[0][1]||1; return `
        <div class="grow2"><span style="color:var(--ink2)">${esc(g)}</span>
          <span class="bar"><i style="width:${Math.max(n/gmx*100,4).toFixed(0)}%"></i></span>
          <span class="num">${n} 组</span></div>`}).join('')}

    </div></div>

  <div class="sec"><div class="shead"><span class="no">06</span><span class="tt">各次训练明细</span><span class="en2">Sessions</span><span class="ln"></span></div>
    ${ss.map(s=>`<div class="card tap" style="margin-bottom:10px" onclick="detailDay('${s.date}','lift')">
      <div class="block">

          <div class="calbox"><div class="tear"></div><div class="m">${+s.date.slice(5,7)} 月</div>
            <div class="d">${s.date.slice(8)}</div><div class="w">${WD[(new Date(s.date).getDay()+6)%7]}</div></div>
          <div style="flex:1;min-width:0">
            <div style="font-size:12.5px;font-weight:600">${esc(s.title||'力量训练')}</div>
            <div style="font-size:10px;color:var(--ink3);margin-top:3px">${s.items.length} 个动作 · ${setsOf(s)} 组 · ${Object.keys(s.items.reduce((a,i)=>{a[i.部位||'其他']=1;return a},{})).join('·')}</div>
          </div></div>

/* ── 训练建议 ── */
/* ═══════════ 路线轨迹（⌖ tab） ═══════════
   数据管线：iCloud 源文件 → 脚本/build_routes.py → routes.json（折线，懒加载）
             data.json 的 routeIdx（瘦索引，列表首屏直接用，不用等折线）。
   速度配色是「蓝慢 → 红快」五档，不跟随深浅色（两组底色都清楚）。 */
const RT={data:null,loading:false,err:null,cur:null,proj:null,down:false,play:0};
const RT_COL={'跑步':'#4A8FD4','骑行':'#3FA07A','徒步':'#D9A83C','步行':'#8A93A3'};
const SPD_STOPS=['#4A8FD4','#3FA07A','#D9A83C','#E07B39','#C8503C'];   /* 慢 → 快 */

function rtLoad(quiet){
  if(RT.data||RT.loading) return;
  RT.loading=true;
  /* ⚠️ 原来这里带 ?v=Date.now()，等于每次都禁用缓存、重下 0.5 MB 轨迹，
     点卡片要等好几秒才有反应（2026-10-21 阿成反馈"点它很久才反应过来"）。
     现在用数据版本号做参数：同一个版本第一次下完就进 HTTP 缓存，之后秒开。 */
  const ver=(D.routeIdx&&D.routeIdx.v)||D.v||'1';
  fetch('routes.json?v='+encodeURIComponent(ver)).then(r=>r.json()).then(d=>{
    RT.data=d;RT.loading=false;RT.err=null;
    rtFillHome();
    if(CUR==='#/route') route();          /* 在路线页触发的加载 → 重画列表补上缩略图 */
    if(RT.cur) rtOpen(RT.cur);            /* 加载期间点了卡片/明细入口 → 补开详情 */
  }).catch(e=>{
    RT.loading=false;RT.err=String(e);
    const v=document.getElementById('rtView');
    if(RT.cur&&v&&v.classList.contains('on')){
      document.getElementById('rtBody').innerHTML=
        `<div class="wrap" style="padding-top:16px"><div class="empty-tip">轨迹数据没载进来：${esc(RT.err)}<br>
        <button class="rtgo" style="margin-top:10px" onclick="RT.err=null;rtLoad()">重试</button></div></div>`;
    }
    if(!quiet) route();
  });
}
/* 首页渲染完就顺手把轨迹数据拉到内存里（idle 时段），
   这样点「路线轨迹」是直接出图，不用先等 0.5 MB 下载。 */
let rtPre=0;
function rtPreload(){
  if(rtPre||RT.data||RT.loading||!D.routeIdx||!D.routeIdx.n) return;
  rtPre=1;
  const go=()=>{rtPre=0;rtLoad(true)};
  if('requestIdleCallback' in window) requestIdleCallback(go,{timeout:2200});
  else setTimeout(go,1200);
}
/* 首页「路线轨迹」卡的缩略图（数据到了再补，不挡首屏） */
function rtFillHome(){
  const el=document.getElementById('homeRtMini');
  if(!el||!RT.data||!D.routeIdx||!D.routeIdx.idx.length) return;
  const top=D.routeIdx.idx[0];
  const r=RT.data.routes.find(x=>x.id===top.id);
  if(r) el.innerHTML=rtMiniSVG(r.pts,RT_COL[r.type]||'#8A93A3');
}

/* ── 投影：经纬度 → SVG 坐标（等距圆柱近似，1px 代表的米数各处一致） ── */
function rtProject(pts,w,h,pad){
  const n=pts.length, lat0=pts.reduce((a,p)=>a+p[1],0)/n;
  const MY=110540, MX=111320*Math.cos(lat0*Math.PI/180);
  let mnx=1e18,mxx=-1e18,mny=1e18,mxy=-1e18;
  for(const p of pts){const x=p[0]*MX,y=p[1]*MY;
    if(x<mnx)mnx=x;if(x>mxx)mxx=x;if(y<mny)mny=y;if(y>mxy)mxy=y;}
  const rx=Math.max(mxx-mnx,1), ry=Math.max(mxy-mny,1);
  const s=Math.min((w-pad*2)/rx,(h-pad*2)/ry);
  const ox=(w-rx*s)/2, oy=(h-ry*s)/2;
  const xs=new Array(n),ys=new Array(n),cum=new Array(n);
  let tot=0;cum[0]=0;
  for(let i=0;i<n;i++){
    xs[i]=ox+(pts[i][0]*MX-mnx)*s;
    ys[i]=h-(oy+(pts[i][1]*MY-mny))*s;
    if(i){tot+=Math.hypot((pts[i][0]-pts[i-1][0])*MX,(pts[i][1]-pts[i-1][1])*MY);cum[i]=tot;}
  }
  return {xs:xs,ys:ys,cum:cum,total:tot||1,s:s};
}
function rtLine(xs,ys,stride){
  let out='';
  for(let i=0;i<xs.length;i+=stride) out+=(out?' ':'')+xs[i].toFixed(1)+','+ys[i].toFixed(1);
  const last=xs.length-1;
  if(last%stride) out+=' '+xs[last].toFixed(1)+','+ys[last].toFixed(1);
  return out;
}
function rtPct(arr,p){const a=arr.slice().sort((x,y)=>x-y);return a[Math.floor((a.length-1)*p)]||0;}
function rtSpdCol(v,lo,hi){
  const t=hi>lo?Math.max(0,Math.min(1,(v-lo)/(hi-lo))):.5;
  return SPD_STOPS[Math.min(4,Math.floor(t*4.999))];
}
function rtMiniSVG(pts,col){
  const p=rtProject(pts,92,68,8);
  const stride=Math.max(1,Math.ceil(p.xs.length/40));
  return `<svg viewBox="0 0 92 68" width="92" height="68" aria-hidden="true">
    <polyline fill="none" stroke="${col}" stroke-opacity=".16" stroke-width="5" stroke-linecap="round"
      points="${rtLine(p.xs,p.ys,stride)}"/>
    <polyline fill="none" stroke="${col}" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"
      points="${rtLine(p.xs,p.ys,stride)}"/>
    <circle cx="${p.xs[0].toFixed(1)}" cy="${p.ys[0].toFixed(1)}" r="2.8" fill="var(--card)" stroke="${col}" stroke-width="1.7"/>
  </svg>`;
}

/* ── 路线列表页 ── */
function viewRoute(){
  const idx=D.routeIdx;
  if(!idx||!idx.n)
    return head({month:'—',t:'路线轨迹',s:'还没有带路线数据的运动'},'Routes')+
    `<div class="wrap"><div class="empty-tip">用 Apple Watch 记录的运动会自动带上路线<br>之后这里会出现轨迹图</div></div>`;
  if(!RT.data&&!RT.loading&&!RT.err) rtLoad();
  const f=ST.rtf||'all';
  const all=idx.idx||[];

  const list=f==='all'?all:all.filter(r=>r.type===f);

  return head({month:spanLabel(all.map(r=>r.date)),t:'路线轨迹',
    s:`${idx.n} 条 GPS 轨迹 · 累计 ${idx.totalKm} km · 总爬升 ${idx.totalElev} m`},'Routes')+
  `<div class="wrap">
    <div class="sec" style="margin-top:16px">
      <div class="rtstat">
        <div class="cell"><div class="v">${idx.n}<u>条</u></div><div class="lb">轨迹总数</div></div>
        <div class="cell"><div class="v">${idx.totalKm}<u>km</u></div><div class="lb">累计距离</div></div>
        <div class="cell"><div class="v">${idx.totalElev>=1000?(idx.totalElev/1000).toFixed(1)+'<u>km</u>':idx.totalElev+'<u>m</u>'}</div><div class="lb">累计爬升</div></div>
      </div>
    </div>
    <div class="sec"><div class="shead"><span class="no">01</span><span class="tt">按类型看</span><span class="en2">Filter</span><span class="ln"></span></div>
      <div class="rflt">${chips}</div>
      ${RT.err?`<div class="empty-tip">轨迹数据加载失败：${RT.err}<br><button class="rtgo" style="margin-top:10px" onclick="RT.err=null;rtLoad()">重试</button></div>`:''}
      ${!RT.err&&RT.loading&&!RT.data?`<div class="empty-tip">正在载入轨迹数据…</div>`:''}
      ${list.length?list.map(r=>rtCardHTML(r)).join('')
        :`<div class="empty-tip">这个类型还没有轨迹</div>`}
      <div class="cap" style="text-align:center;padding:10px 0 4px">轨迹来自 Apple Watch 的 GPS 记录 · 点任意一条看完整轨迹<br>
        最新一条 ${first.slice(5).replace('-','/')}</div>
    </div>
  </div>`;
}
function RT_LONG2(t){return {'跑步':'户外跑','骑行':'骑行','徒步':'徒步','步行':'步行'}[t]||t;}
function rtCardHTML(r){
  const col=RT_COL[r.type]||'#8A93A3';
  const full=RT.data&&RT.data.routes.find(x=>x.id===r.id);
  const pace=(['跑步','骑行','步行','徒步'].indexOf(r.type)>=0&&r.dist>0)
    ?paceTxt(Math.round(r.dur*60/r.dist)):'';
  return `<div class="card rtc" onclick="openRoute('${r.id}')">
    <div class="rtmini">${full?rtMiniSVG(full.pts,col):'<div class="rtmini-sk"></div>'}</div>
    <div class="info">
      <div class="d1"><b>${r.date.slice(5).replace('-','/')}</b><span>${(TY[r.type]||['',''])[0]} ${r.type}</span></div>
      <div class="d2">${r.dist} km · ${fmtDur(r.dur)}${pace?' · '+pace+'/km':''}</div>
      <div class="d3">${r.hrAvg?'♥ '+r.hrAvg+(r.hrMax?'–'+r.hrMax:'')+' bpm':'心率 —'}${r.elevUp?' · 爬升 '+r.elevUp+' m':''}</div>
    </div><div class="go"></div></div>`;
}

/* ── 详情 ── */
/* 点了就立刻有反馈：先弹出浮层骨架，数据到了再填内容。
   以前是"点了没反应，等 fetch 完了才整页滑出来"，手感像卡死。 */
function openRoute(id){
  /* ⚠️ 2026-10-21 阿成：从「当天明细」点进轨迹，关掉轨迹后应该回到**那天的明细**，
     不是直接掉回日历页。原来这里无条件 closeSheet()，所以回去时明细已经没了。
     现在不关弹层：轨迹浮层 z-index 100 直接盖在明细弹层（90）上面，
     关掉轨迹 → 原地露出当天明细；再返回一次才关明细、回日历。逐级退，和点进来时对称。 */
  if(!RT.data){RT.cur=id;rtLoadingCover();rtLoad();return;}
  rtOpen(id);
}
function rtLoadingCover(){
  const t=document.getElementById('rtTitle'), b=document.getElementById('rtBody');
  if(t) t.innerHTML='正在载入轨迹<span>ROUTE TRACE</span>';
  if(b) b.innerHTML='<div class="wrap" style="padding-top:16px"><div class="empty-tip">正在读取 GPS 轨迹…<br>'+
    '<span style="font-size:10px">第一次打开要下载约 0.5 MB，之后会缓存秒开</span></div></div>';
  const v=document.getElementById('rtView');
  if(v){v.classList.add('on');v.scrollTop=0;}
}
function rtOpen(id){
  RT.cur=id;
  const r=RT.data&&RT.data.routes.find(x=>x.id===id);
  if(!r){toast('这条轨迹的数据缺失');return;}
  document.getElementById('rtTitle').innerHTML=
    `${r.date.slice(5).replace('-','/')} · ${(TY[r.type]||['',''])[0]} ${r.type}<span>ROUTE TRACE</span>`;
  document.getElementById('rtBody').innerHTML=rtDetailHTML(r);
  const v=document.getElementById('rtView');
  v.classList.add('on');v.scrollTop=0;
  rtBindMap(r);
}
function closeRoute(){
  if(RT.play){cancelAnimationFrame(RT.play);RT.play=0;}
  document.getElementById('rtView').classList.remove('on');
  RT.cur=null;RT.down=false;
}
function rtDetailHTML(r){
  const paceSec=r.dist>0?r.dur*60/r.dist:0;
  const isPace=['跑步','徒步','步行'].indexOf(r.type)>=0;
  const spd=r.dur>0?r.dist/(r.dur/60):0;
  const cadU=r.type==='骑行'?'rpm':'spm', cadL=r.type==='骑行'?'踏频':'步频';
  const cells=[
    [r.dist,'km','距离'],[fmtDur(r.dur),'','时长'],
    [isPace?paceTxt(Math.round(paceSec)):spd.toFixed(1),isPace?'/km':'km/h',isPace?'配速':'均速'],
    [r.hrAvg||'—','bpm','均心'],[r.hrMax||'—','bpm','峰心'],
    [r.elevUp||0,'m','爬升'],[r.kcal||'—','kcal','消耗'],
    [r.cadence||'—',cadU,cadL]];
  const conds=[];
  if(r.temp!=null)conds.push('🌡 '+r.temp+' ℃');
  if(r.humidity)conds.push('💧 湿度 '+r.humidity+'%');
  if(r.loc)conds.push('📍 '+esc(r.loc));
  if(r.effort)conds.push('⚡ 竭力度 '+r.effort+'/10');
  return `<div class="wrap" style="padding-top:14px">
    <div class="sec"><div class="shead"><span class="no">01</span><span class="tt">轨迹</span><span class="en2">Trace</span><span class="ln"></span></div>
      <div class="rtmap">
        ${rtRouteMap(r)}
        <div class="rtread" id="rtRead"></div>
        <button class="rtplay" onclick="rtPlay()">▶ 回放</button>
      </div>
      <div class="cap">线条颜色＝当时速度（蓝慢 → 红快）· 在轨迹上拖动可查看任意位置 · 空心圈为每公里刻度</div>
    </div>
    <div class="sec"><div class="shead"><span class="no">02</span><span class="tt">数据</span><span class="en2">Stats</span><span class="ln"></span></div>
      <div class="rtgrid">${cells.map(c=>`<div class="cell"><div class="v">${c[0]}<u>${c[1]}</u></div><div class="lb">${c[2]}</div></div>`).join('')}</div>
    </div>
    ${r.elev&&r.elev.length>1?`<div class="sec"><div class="shead"><span class="no">03</span><span class="tt">海拔剖面</span><span class="en2">Elevation</span><span class="ln"></span></div>
      <div class="card block" data-noswipe>${rtElevSVG(r)}
      <div class="cap">同样可以拖动 · 和上面的轨迹左右对齐</div></div></div>`:''}
    ${r.hr&&r.hr.length>1?`<div class="sec"><div class="shead"><span class="no">04</span><span class="tt">心率曲线</span><span class="en2">Heart Rate</span><span class="ln"></span></div>
      <div class="card block">${rtHRSVG(r)}
      <div class="cap">纵轴 bpm · 横轴为开始运动后的分钟数</div></div></div>`:''}
    ${r.splits&&r.splits.length?`<div class="sec"><div class="shead"><span class="no">05</span><span class="tt">每公里分段</span><span class="en2">Splits</span><span class="ln"></span></div>
      <div class="card block"><table>
        <tr><th>公里</th><th>用时</th><th>配速</th><th>心率</th></tr>
        ${r.splits.map(q=>`<tr class="${q.pace===Math.min.apply(null,r.splits.map(z=>z.pace))?'fast':''}">
          <td>${q.km}</td><td>${Math.floor(q.sec/60)}'${String(q.sec%60).padStart(2,'0')}"</td>
          <td>${paceTxt(q.pace)}</td><td>${q.hr||'—'}</td></tr>`).join('')}
      </table><div class="cap">金色＝最快的一公里 · 心率取自该公里平均</div></div></div>`:''}
    ${conds.length?`<div class="sec"><div class="shead"><span class="no">06</span><span class="tt">环境与强度</span><span class="en2">Conditions</span><span class="ln"></span></div>
      <div class="card block"><div class="rtcond">${conds.map(c=>`<span>${c}</span>`).join('')}</div>
      <div class="cap">Apple Watch 当场记录 · 竭力度 1（轻松）～ 10（最大）</div></div></div>`:''}
  </div>`;
}
/* 大轨迹图：光晕 + 按速度分段上色 + 起终点 + 公里刻度 + 方向箭头 */
function rtRouteMap(r){
  const W=342,H=232,pad=16;
  const p=rtProject(r.pts,W,H,pad);
  RT.proj=p;
  const n=r.pts.length;
  const sp=r.pts.map(q=>q[2]);
  const lo=rtPct(sp,.1),hi=rtPct(sp,.9);
  let segs='';
  for(let i=1;i<n;i++)
    segs+=`<line x1="${p.xs[i-1].toFixed(1)}" y1="${p.ys[i-1].toFixed(1)}" x2="${p.xs[i].toFixed(1)}" y2="${p.ys[i].toFixed(1)}" stroke="${rtSpdCol((sp[i-1]+sp[i])/2,lo,hi)}" stroke-width="2.6" stroke-linecap="round"/>`;
  /* 公里刻度（空心圈 + 数字），点一下把游标拽过去 */
  const scale=r.dist/(p.total||1);
  let ticks='',k=1;
  while(k<=Math.floor(r.dist)){
    for(let i=1;i<n;i++){
      if(p.cum[i]*scale>=k){
        ticks+=`<g style="cursor:pointer" onclick="rtShowAt(${i})">
          <circle cx="${p.xs[i].toFixed(1)}" cy="${p.ys[i].toFixed(1)}" r="5.4" fill="var(--card)"/>
          <text x="${p.xs[i].toFixed(1)}" y="${(p.ys[i]-7.5).toFixed(1)}" font-size="7.5" fill="var(--ink3)" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">${k}</text></g>`;
        break;}
    }
    k++;
  }
  /* 方向箭头：全程均匀取 5 个，按局部朝向旋转 */
  let arrows='';
  for(let f=0.12;f<0.9;f+=0.16){
    const i=Math.min(n-2,Math.round(f*n)), j=Math.min(n-1,i+2);
    const ang=Math.atan2(p.ys[j]-p.ys[i],p.xs[j]-p.xs[i])*180/Math.PI;
    arrows+=`<g transform="translate(${p.xs[i].toFixed(1)},${p.ys[i].toFixed(1)}) rotate(${ang.toFixed(0)})" opacity=".55">
      <path d="M-2.6,-2.4 L3.4,0 L-2.6,2.4 Z" fill="var(--ink3)"/></g>`;
  }
  const x0=p.xs[0].toFixed(1),y0=p.ys[0].toFixed(1),
        x1=p.xs[n-1].toFixed(1),y1=p.ys[n-1].toFixed(1);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" id="rtSvg" aria-label="运动轨迹图">
    <g stroke="var(--grid)">${[0.25,0.5,0.75].map(f=>`<line x1="0" y1="${(H*f).toFixed(0)}" x2="${W}" y2="${(H*f).toFixed(0)}"/><line x1="${(W*f).toFixed(0)}" y1="0" x2="${(W*f).toFixed(0)}" y2="${H}"/>`).join('')}</g>
    <polyline fill="none" stroke="var(--gold)" stroke-opacity=".14" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"
      points="${rtLine(p.xs,p.ys,1)}"/>
    ${segs}
    ${arrows}
    ${ticks}
    <circle id="rtMkHalo" cx="0" cy="0" r="11" fill="var(--gold)" opacity="0"/>
    <circle id="rtMk" cx="0" cy="0" r="5" fill="var(--card)" stroke="var(--gold)" stroke-width="2.6" opacity="0"/>
    <g><circle cx="${x0}" cy="${y0}" r="5.6" fill="#fff" stroke="#0F7A52" stroke-width="2.4"/>
      <circle cx="${x0}" cy="${y0}" r="1.8" fill="#0F7A52"/>
      <text x="${x0}" y="${(+y0-8).toFixed(1)}" font-size="8" fill="#0F7A52" text-anchor="middle" font-weight="700">起</text></g>
    <g><circle cx="${x1}" cy="${y1}" r="5.6" fill="var(--gold)"/>
      <circle cx="${x1}" cy="${y1}" r="2" fill="var(--card)"/>
      <text x="${x1}" y="${(+y1-8).toFixed(1)}" font-size="8" fill="var(--gold)" text-anchor="middle" font-weight="700">终</text></g>
  </svg>${rtScaleBar(p)}`;
}
function rtScaleBar(p){
  const mpp=1/p.s;
  const cands=[50,100,200,500,1000,2000,5000];
  let best=cands[0];
  for(const c of cands){if(c/mpp<=90)best=c;else break;}
  return `<div class="rtscale"><i style="width:${Math.round(best/mpp)}px"></i>${best>=1000?(best/1000)+' km':best+' m'}</div>`;
}
function rtElevSVG(r){
  const e=r.elev,W=342,H=96,pad=12;
  const mx=e[e.length-1][0]||1;
  const als=e.map(q=>q[1]),mn=Math.min.apply(null,als),mxa=Math.max.apply(null,als),rg=Math.max(mxa-mn,1);
  const X=k=>pad+(k/mx)*(W-pad*2),Y=a=>H-pad-((a-mn)/rg)*(H-pad*2);
  const pts=e.map(q=>X(q[0]).toFixed(1)+','+Y(q[1]).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" id="rtElevSvg" style="touch-action:none;cursor:crosshair">
    <defs><linearGradient id="rtEg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--gold)" stop-opacity=".30"/><stop offset="1" stop-color="var(--gold)" stop-opacity=".02"/></linearGradient></defs>
    <g stroke="var(--grid)"><line x1="0" y1="${pad}" x2="${W}" y2="${pad}"/><line x1="0" y1="${(H/2).toFixed(0)}" x2="${W}" y2="${(H/2).toFixed(0)}"/><line x1="0" y1="${H-pad}" x2="${W}" y2="${H-pad}"/></g>
    <polygon points="${pad},${H-pad} ${pts} ${(W-pad).toFixed(1)},${H-pad}" fill="url(#rtEg)"/>
    <polyline fill="none" stroke="var(--gold)" stroke-width="1.8" stroke-linejoin="round" points="${pts}"/>
    <text x="${pad}" y="${H-2}" font-size="7.5" fill="var(--ink3)">0 km</text>
    <text x="${W}" y="${H-2}" font-size="7.5" fill="var(--ink3)" text-anchor="end">${mx.toFixed(1)} km</text>
    <text x="${pad}" y="${pad+6}" font-size="7.5" fill="var(--ink3)">最高 ${mxa.toFixed(0)} m · 最低 ${mn.toFixed(0)} m</text>
  </svg>`;
}
function rtHRSVG(r){

  const bs=h.map(q=>q[1]),mn=Math.min.apply(null,bs)-3,mxa=Math.max.apply(null,bs)+3,rg=Math.max(mxa-mn,1);

/* ── 拖动游标：轨迹图与剖面图共用一套逻辑 ── */
function rtBindMap(r){
  const svg=document.getElementById('rtSvg');
  const ev=document.getElementById('rtElevSvg');
  const mapXY=e=>{
    const rect=svg.getBoundingClientRect();
    return {x:(e.clientX-rect.left)/rect.width*342,y:(e.clientY-rect.top)/rect.height*232};
  };
  const evXY=e=>{
    const rect=ev.getBoundingClientRect();
    const km=(e.clientX-rect.left)/rect.width*(r.dist||1);
    return {km:km};
  };
  if(svg){
    svg.addEventListener('pointerdown',e=>{RT.down=true;rtScrub(mapXY(e))});
    svg.addEventListener('pointermove',e=>{if(RT.down||e.pointerType==='mouse')rtScrub(mapXY(e))});
    ['pointerup','pointerleave','pointercancel'].forEach(t=>svg.addEventListener(t,()=>{RT.down=false}));
  }
  if(ev){
    ev.addEventListener('pointerdown',e=>{RT.down=true;rtScrub(evXY(e))});
    ev.addEventListener('pointermove',e=>{if(RT.down||e.pointerType==='mouse')rtScrub(evXY(e))});
    ['pointerup','pointerleave','pointercancel'].forEach(t=>ev.addEventListener(t,()=>{RT.down=false}));
  }
}
/* 输入：轨迹图给 {x,y}（SVG 坐标），剖面图给 {km} */
function rtScrub(inp){
  const r=RT.cur&&RT.data?RT.data.routes.find(x=>x.id===RT.cur):null;
  if(!r||!RT.proj) return;
  const p=RT.proj,scale=r.dist/(p.total||1);
  let i=0;
  if(inp.km!=null){
    const target=inp.km/scale;
    if(target<=0){i=0;}
    else{
      i=p.cum.length-1;
      for(let j=1;j<p.cum.length;j++){if(p.cum[j]>=target){i=j;break;}}
    }
  }else{
    let bd=1e18;
    for(let j=0;j<p.xs.length;j++){const dx=p.xs[j]-inp.x,dy=p.ys[j]-inp.y,d=dx*dx+dy*dy;if(d<bd){bd=d;i=j;}}
  }
  rtShowAt(i);
}
function rtShowAt(i){
  const r=RT.cur&&RT.data?RT.data.routes.find(x=>x.id===RT.cur):null;
  if(!r||!RT.proj) return;
  const p=RT.proj,scale=r.dist/(p.total||1);
  const km=p.cum[i]*scale;
  const tMin=r.dur*km/Math.max(r.dist,.001);
  const sp=r.pts[i][2];
  const mm=Math.floor(tMin),ss=Math.round((tMin-mm)*60);
  const hr=rtHrAt(r,tMin);
  const spdTxt=r.type==='骑行'?(sp*3.6).toFixed(1)+' km/h':(sp>0.3?paceTxt(Math.round(1000/sp))+'/km':'—');
  const mk=document.getElementById('rtMk'),hl=document.getElementById('rtMkHalo'),el=document.getElementById('rtRead');
  if(!mk||!el) return;
  mk.setAttribute('cx',p.xs[i].toFixed(1));mk.setAttribute('cy',p.ys[i].toFixed(1));mk.setAttribute('opacity','1');
  hl.setAttribute('cx',p.xs[i].toFixed(1));hl.setAttribute('cy',p.ys[i].toFixed(1));hl.setAttribute('opacity','.16');
  el.innerHTML=`<b>${km.toFixed(2)}</b> km · ${mm}'${String(Math.min(ss,59)).padStart(2,'0')}" · ${spdTxt}${hr?' · ♥'+hr:''}`;
  el.classList.add('on');
}
function rtHrAt(r,tMin){
  const h=r.hr;if(!h||h.length<2)return null;
  if(tMin<=h[0][0])return h[0][1];
  for(let i=1;i<h.length;i++){
    if(tMin<=h[i][0]){
      const t=(tMin-h[i-1][0])/Math.max(h[i][0]-h[i-1][0],.001);
      return Math.round(h[i-1][1]+(h[i][1]-h[i-1][1])*t);
    }
  }
  return h[h.length-1][1];
}
/* 回放：从头到尾走一遍轨迹（约 5 秒），再点一次轨迹图停止 */
function rtPlay(){
  const r=RT.cur&&RT.data?RT.data.routes.find(x=>x.id===RT.cur):null;
  if(!r||!RT.proj)return;
  if(RT.play){cancelAnimationFrame(RT.play);RT.play=0;return;}
  const n=r.pts.length,t0=performance.now(),DUR=5000;
  const step=()=>{
    const t=(performance.now()-t0)/DUR;
    if(t>=1){rtShowAt(n-1);RT.play=0;return;}
    rtShowAt(Math.round(t*(n-1)));
    RT.play=requestAnimationFrame(step);
  };
  RT.play=requestAnimationFrame(step);
}

    const j=D.journal.find(e=>e.date===ds);

      <div style="display:flex;align-items:center;gap:11px">

    [0,1,2,3].map(c=>{const m=r*4+c+1, list=months[m]||[];

      return `<div class="${cls}" ${list.length?`onclick="navRec('${cy}',${m})"`:'style="cursor:default"'}>
        <b>${m} 月</b><span>${list.length?list.length+' 次':'—'}</span></div>`}).join('')}</div>`).join('');
  return head({month:ys.length>1?ys[ys.length-1]+' – '+ys[0]:ys[0],t:'全部记录',
    s:`共 ${D.recent.length} 次手表记录 · 日历看分布，列表按月翻明细`},'All Records')+
  `<div class="wrap">
    <div class="sec" style="margin-top:16px">
      <div class="segbar">
        <button class="${ST.recView==='cal'?'on':''}" onclick="ST.recView='cal';route()">日历</button>
        <button class="${(ST.recView||'list')==='list'?'on':''}" onclick="ST.recView='list';route()">列表</button>
      </div>
    </div>
    ${(ST.recView||'list')==='cal'?recCalBody():`
    <div class="sec">
      <div class="shead"><span class="no">01</span><span class="tt">选个月份</span><span class="en2">Period</span><span class="ln"></span></div>
      <div class="ychips">${ys.map(v=>`<button class="btn ${v===cy?'':'off'}" onclick="navRec('${v}',0)">${v} 年</button>`).join('')}</div>

        <div class="yhead">
          <b>${cy} 年</b>
          <span>共 ${cyList.length} 次 · ${hm(ytot)} · ${ykm.toFixed(1)} km · ${ykal} kcal</span>
        </div>
        <div>${mrows}</div>
        <div class="cap">有记录的月份可以点 · 点一下换一个月 ↓</div>
      </div>

    <div class="sec">
      <div class="shead"><span class="no">02</span><span class="tt">这个月的记录</span><span class="en2">Log</span><span class="ln"></span></div>
      ${days.length?days.map(ds=>
        `<div class="card tap" style="margin-bottom:10px" onclick="detailDay('${ds}')">${dayCard(ds)}</div>`).join('')
        :`<div class="empty-tip">${cy} 年 ${cm} 月还没有记录，换个月份看看</div>`}
    </div>`}
  </div>`;
}
/* 记录页的「日历」视图：直接复用日历页本体（底栏已没有日历 tab，这里是它的入口）。
   用 embed 参数让它跳过 cover，只留 wrap 正文 —— 否则记录页里会出现两个页头。 */
/* 记录页的日历视图（v5 重做）：和首页同一套格子语言，可翻月。
   ⚠️ 数据必须合并 D.strength —— 老版只读 D.recent，手动补录的器械日在这张日历上是空的，
   跟首页对不上（他一定会发现"今天明明练了，日历里没有"）。 */
function recCalBody(){
  const ym=ST.ym||nowYM(), [Y,M]=ym.split('-').map(Number);
  const days=allDays(), dim=new Date(Y,M,0).getDate();
  const start=(new Date(Y,M-1,1).getDay()+6)%7;
  let mx=1;
  for(let d=1;d<=dim;d++){const o=days[Y+'-'+dsPad(M)+'-'+dsPad(d)]; if(o&&o.min>mx) mx=o.min}
  const tds=dsOf(new Date());
  let cells='',on=0;
  for(let i=0;i<start;i++) cells+='<div class="cd empty"></div>';
  for(let d=1;d<=dim;d++){
    const ds=Y+'-'+dsPad(M)+'-'+dsPad(d), o=days[ds];
    const has=!!(o&&(o.n||o.st));
    let lv=0;
    if(has){on++;lv=o.min>0?(o.min<mx*0.3?1:o.min<mx*0.6?2:o.min<mx*0.85?3:4):2}
    const cls='cd'+(lv?' lv'+lv:'')+(ds===tds?' now':'');
    cells+=`<div class="${cls}"${has?` onclick="detailDay('${ds}')"`:''} aria-label="${M} 月 ${d} 日${has?' 有训练':''}">
      <span class="cdn">${d}</span>${o&&o.st?'<div class="dotline"><i></i></div>':''}</div>`;
  }
  const tail=(7-(start+dim)%7)%7;
  for(let i=0;i<tail;i++) cells+='<div class="cd empty"></div>';

  const ms=monthStat(ym), isCur=ym===nowYM();
  return `<div class="sec">
    <div class="sectt"><i></i><b>日历</b><span>点某天看当天做了什么</span></div>
    <div class="card block mcal">
      <div class="mnav">
        <button onclick="navMonth(-1)" aria-label="上个月">‹</button>
        <b>${Y} 年 ${M} 月</b>
        <div class="mn">
          ${isCur?'':'<button class="minibtn" style="width:auto;padding:0 9px" onclick="ST.ym=nowYM();route()">本月</button>'}
          <button onclick="navMonth(1)" aria-label="下个月">›</button>
        </div>
      </div>
      <div class="ch7">${['一','二','三','四','五','六','日'].map(x=>`<span>${x}</span>`).join('')}</div>
      <div class="cg">${cells}</div>
      <div class="leg"><span>练了 <b style="color:var(--gold);font-weight:700">${on}</b> 天</span>
        <span style="margin-left:auto">金格＝有训练 · 小金点＝手动补录的器械</span></div>
    </div>
  </div>
  <div class="sec">
    <div class="sectt"><i></i><b>这个月</b><span>${Y} 年 ${M} 月</span></div>
    <div class="card block">
      <div class="duo" style="gap:0">
        <div style="text-align:left"><div style="font-size:9.5px;color:var(--ink3);letter-spacing:.08em">训练次数</div>
          <div style="font-size:23px;font-weight:700;letter-spacing:-.8px;margin-top:4px;font-variant-numeric:tabular-nums">${ms.n}<u style="font-size:10px;font-weight:600;color:var(--ink3);text-decoration:none;margin-left:3px">次</u></div></div>
        <div style="text-align:left"><div style="font-size:9.5px;color:var(--ink3);letter-spacing:.08em">累计时长</div>
          <div style="font-size:23px;font-weight:700;letter-spacing:-.8px;margin-top:4px;font-variant-numeric:tabular-nums">${ms.min?hrsOf(ms.min):'—'}<u style="font-size:10px;font-weight:600;color:var(--ink3);text-decoration:none;margin-left:3px">小时</u></div></div>
      </div>
      <div class="cap" style="margin-top:12px">${ms.d?`${ms.d} 天有训练${ms.min?` · 平均每次 ${Math.round(ms.min/ms.n)} 分钟`:''}`:'这个月还没有记录'}</div>
    </div>
  </div>`;
}

function calMonthBody(){
  const keep=ST.embed; ST.embed=1;
  const h=viewCal();
  ST.embed=keep;
  const a=h.indexOf('<div class="wrap">');
  return a<0?h:`<div class="sec">${h.slice(a+18).replace(/<\/div>\s*$/,'')}</div>`;
}
function navRec(y,m){
  const chMonth=(m&&m!==ST.recM);       /* 只有点月份才翻页；换年份不翻 */
  ST.recY=y;ST.recM=m||0;ST.flip=chMonth;route();
}

/* ── 身体 ── */
function viewBody(){
  const b=D.body.slice().sort((x,y)=>x.date<y.date?-1:1);
  const W=342,H=150,pad=18;
  const w=b.map(r=>r.weight_jin), mn=Math.min(...w)-1, mx=Math.max(...w)+1, rg=mx-mn;
  const step=(W-pad*2)/Math.max(b.length-1,1);
  const pw=b.map((r,i)=>[pad+i*step, H-pad-((r.weight_jin-mn)/rg)*(H-pad*2-30)]);
  const bf=b.map(r=>r.bf_pct), bn=Math.min(...bf)-.5, bx=Math.max(...bf)+.5;
  const pf=b.map((r,i)=>[pad+i*step, H-pad-((r.bf_pct-bn)/(bx-bn))*(H-pad*2-30)]);
  const latest=b[b.length-1], first=b[0];
  return head({month:spanLabel(b.map(r=>r.date)),t:'身体数据',s:`薄荷体脂秤读数 · 共 ${b.length} 次记录`},'Body Metrics')+
  `<div class="wrap">
    <div class="sec"><div class="shead"><span class="no">01</span><span class="tt">体重与体脂</span><span class="en2">Trend</span><span class="ln"></span></div>
      <div class="card block">
        <div class="chartbox">
          <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" id="bsvg">
            <g stroke="var(--grid)"><line x1="0" y1="${pad}" x2="${W}" y2="${pad}"/>
              <line x1="0" y1="${(H/2).toFixed(0)}" x2="${W}" y2="${(H/2).toFixed(0)}"/>
              <line x1="0" y1="${H-pad}" x2="${W}" y2="${H-pad}"/></g>
            <polyline fill="none" stroke="var(--warn)" stroke-width="1.6" stroke-dasharray="4 3"
              points="${pf.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" opacity=".85"/>
            <polyline fill="none" stroke="var(--gold)" stroke-width="2.4" stroke-linejoin="round"
              points="${pw.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}"/>
            ${pw.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.4" fill="var(--gold)" class="barhit"
              ontouchstart="evB(${i})" onclick="evB(${i})"/>
              <rect x="${(p[0]-13).toFixed(1)}" y="${(p[1]-16).toFixed(1)}" width="26" height="30" fill="transparent" class="barhit"
              onclick="evB(${i})"/>`).join('')}
            <text x="0" y="12" font-size="8.5" fill="var(--ink3)">金线＝体重（斤）　橙虚线＝体脂率（%）</text>
          </svg>
          <div class="tip" id="btip"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--ink3);margin-top:4px">
          <span>${first.date.slice(5)}</span><span>${latest.date.slice(5)}</span></div>
        <div class="cap">点任一金色圆点，显示那次称重的所有数据</div>
      </div></div>

    <div class="sec"><div class="shead"><span class="no">02</span><span class="tt">变化小结</span><span class="en2">Delta</span><span class="ln"></span></div>
      <div class="card block">
        <div class="srow2"><b>体重</b><span>${first.weight_jin} → ${latest.weight_jin} 斤（${(latest.weight_jin-first.weight_jin>0?'+':'')}${(latest.weight_jin-first.weight_jin).toFixed(1)}）</span></div>
        <div class="srow2"><b>体脂率</b><span>${first.bf_pct} → ${latest.bf_pct} %（${(latest.bf_pct-first.bf_pct>0?'+':'')}${(latest.bf_pct-first.bf_pct).toFixed(1)}）</span></div>
        <div class="srow2"><b>去脂体重</b><span>${first.lean_jin} → ${latest.lean_jin} 斤</span></div>
        <div class="srow2"><b>基础代谢</b><span>${first.bmr} → ${latest.bmr} kcal</span></div>
        <div class="srow2"><b>目标</b><span>${D.profile['目标斤']} 斤，还差 <b style="color:var(--gold)">${(latest.weight_jin-D.profile['目标斤']).toFixed(1)}</b> 斤</span></div>
      </div></div>

    <div class="sec"><div class="shead"><span class="no">03</span><span class="tt">围度</span><span class="en2">Girth</span><span class="ln"></span></div>
      <div class="card block">
        ${(D.girths||[]).map(g=>`<div class="srow2"><b>${g.date.slice(5)} 测量</b>
          <span>胸 ${g['胸围']} · 腰 ${g['腰围']} · 臀 ${g['臀围']} · 腿 ${g['腿围']} · 臂 ${g['臂围']} cm</span></div>`).join('')}
        <div class="cap">单位为厘米 · 臂围越大越好，其余越小越好</div>
      </div></div>

    <div class="sec"><div class="shead"><span class="no">04</span><span class="tt">全部称重</span><span class="en2">Log</span><span class="ln"></span></div>
      <div class="card block"><table>
        <tr><th>日期</th><th>体重斤</th><th>体脂%</th><th>去脂斤</th><th>代谢</th></tr>
        ${D.body.map(r=>`<tr class="tap" onclick="evB(${D.body.slice().sort((x,y)=>x.date<y.date?-1:1).findIndex(v=>v.date===r.date)})">
          <td>${r.date.slice(5)}</td><td>${r.weight_jin}</td><td>${r.bf_pct}</td><td>${r.lean_jin}</td><td>${r.bmr}</td></tr>`).join('')}
      </table></div></div>
  </div>`;
}

function evB(i){
  const b=D.body.slice().sort((x,y)=>x.date<y.date?-1:1)[i];
  openSheet(`<h3>${b.date} 称重</h3><div class="sst">第 ${b.i} 次记录（1＝最新）</div>
    <div class="srow2"><b>体重</b><span>${b.weight_jin} 斤</span></div>
    <div class="srow2"><b>体脂率</b><span>${b.bf_pct} %</span></div>
    <div class="srow2"><b>脂肪量</b><span>${b.fat_jin} 斤</span></div>
    <div class="srow2"><b>去脂体重</b><span>${b.lean_jin} 斤</span></div>
    <div class="srow2"><b>基础代谢</b><span>${b.bmr} kcal</span></div>
    <div class="srow2"><b>内脏脂肪</b><span>${b.visceral} 级</span></div>
