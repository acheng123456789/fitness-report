/* ── 某天明细 ── */
/* kind: 'run'/'跑步' 只看跑步 · 'lift'/'器械' 只看器械 · 空＝这一天全部 */
function detailDay(ds,kind){
  kind = (kind==='跑步'||kind==='run') ? 'run'
       : (kind==='器械'||kind==='lift') ? 'lift' : null;
  const all=D.recent.filter(r=>r.date===ds).sort((a,b)=>a.time<b.time?1:-1);
  const list = kind==='run'  ? all.filter(r=>r.类型==='跑步')
             : kind==='lift' ? all.filter(r=>['力量训练','核心训练'].indexOf(r.类型)>=0)
             : all;
  const st = kind==='run' ? null : D.strength.find(s=>s.date===ds);
  const j=D.journal.find(e=>e.date===ds);
  const tot=list.reduce((a,b)=>a+b.时长,0), kcal=list.reduce((a,b)=>a+(b.消耗||0),0);
  const km=list.reduce((a,b)=>a+(b.距离||0),0);
  const dt=new Date(ds), wd=WD[(dt.getDay()+6)%7];
  const FL=['轻松','有点累','累但能扛','很累','撑不住'];
  const maxT=Math.max(...list.map(r=>r.时长),1);
  const KIND={run:'跑步',lift:'器械'};
  if(!list.length&&!st){
    /* 没训练不等于没数据 —— 手表可能记了身体指标（静息心率/HRV/步数…），
       这种日子打开就看到身体数据，别甩一句"没有记录"（2026-10-18） */
    const hb=hmDayBlock(ds);
    if(hb){
      openSheet(`<div style="display:flex;gap:12px;align-items:center">
        <div class="calbox"><div class="tear"></div><div class="m">${+ds.slice(5,7)} 月</div>
          <div class="d">${ds.slice(8)}</div><div class="w">${wd}</div></div>
        <div style="flex:1;min-width:0">
          <h3 style="margin:0">${ds.slice(0,4)} 年 ${+ds.slice(5,7)} 月 ${+ds.slice(8)} 日</h3>
          <div class="sst">这天没有训练记录</div></div></div>
        ${hb}`);
      return;
    }
    openSheet(`<h3>${ds.slice(5).replace('-',' 月 ')} 日</h3>
      <div class="sst">这天没有${KIND[kind]||''}记录</div>`);return;
  }
  let html=`<div style="display:flex;gap:12px;align-items:center">
      <div class="calbox"><div class="tear"></div><div class="m">${+ds.slice(5,7)} 月</div>
        <div class="d">${ds.slice(8)}</div><div class="w">${wd}</div></div>
      <div style="flex:1;min-width:0">
        <h3 style="margin:0">${ds.slice(0,4)} 年 ${+ds.slice(5,7)} 月 ${+ds.slice(8)} 日${
          KIND[kind]?' · '+KIND[kind]:''}</h3>
        <div class="sst">${list.length?list.length+' 次':'—'} ${KIND[kind]?KIND[kind]+'':'运动'} · 合计 ${hm(tot)} · ${kcal} kcal${km?` · ${km.toFixed(2)} km`:''}</div>
        ${j?`<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;row-gap:6px;margin-top:7px">
          <span style="font-size:9.5px;color:var(--ink3)">疲劳</span>
          <span style="display:flex;gap:2px">${[1,2,3,4,5].map(i=>
            `<i style="width:15px;height:5px;border-radius:2px;background:${i<=j.疲劳?'var(--warn)':'var(--line2)'}"></i>`).join('')}</span>
          <span style="font-size:9.5px;color:var(--ink2)">${FL[j.疲劳-1]||''}</span>
        </div>`:''}
      </div></div>`;
  if(list.length) html+=`<div class="sh2">${KIND[kind]?KIND[kind]+'构成':'当天训练构成'}</div>`+
   list.map(r=>`<div style="display:grid;grid-template-columns:70px 1fr 52px;gap:8px;align-items:center;padding:4px 0;font-size:10.5px">
      <span style="color:var(--ink2)">${(TY[r.类型]||['·'])[0]} ${r.类型}</span>
      <span style="height:9px;background:var(--line2);border-radius:5px;overflow:hidden">
        <i style="display:block;height:100%;width:${(r.时长/maxT*100).toFixed(0)}%;background:var(--${(TY[r.类型]||['','run'])[1]});border-radius:5px"></i></span>
      <span style="text-align:right;color:var(--ink3);font-family:ui-monospace,Menlo,monospace">${Math.round(r.时长)} 分</span></div>`).join('');
  if(list.length) html+=`<div class="sh2">${KIND[kind]?KIND[kind]+'明细':'训练明细'}</div>`+
   list.map(r=>{
     const rtId=(D.routeIdx&&D.routeIdx.idx||[]).find(x=>x.date===ds&&x.time===r.time&&x.type===r.类型);
     return `<div class="srow2" style="margin-top:6px">
      <b>${(TY[r.类型]||['·'])[0]} ${r.类型}</b>
      <span>${r.time} · ${Math.round(r.时长)}分${r.距离?' · '+r.距离+'km':''}${hasPace(r)?' · '+r.配速显示:''}</span></div>
     <div style="font-size:10px;color:var(--ink3);margin:4px 0 8px">心率 ${r.平均心率}${r.最高心率?'（最高 '+r.最高心率+'）':''} · ${r.消耗} kcal${r.地形?' · '+r.地形:''}</div>
     ${rtId?`<div style="margin:0 0 10px"><button class="rtgo" onclick="openRoute('${rtId.id}')">⌖ 查看路线轨迹</button></div>`:''}`;
   }).join('');
  html+=hmDayBlock(ds);
  if(st){
    html+=`<div class="sh2">力量动作 · ${esc(st.title||'')}（${st.items.length} 个）</div>
      <div>${st.items.map((it,i)=>`<div class="ex">
        <div class="no">${i+1}</div>
        <div class="mid"><b>${esc(it.name)}</b>
          <div class="meta">${it.gear?esc(it.gear)+' · ':''}${it.部位?'部位：'+esc(it.部位):''}</div>
          ${it.note?`<div class="note">${esc(it.note)}</div>`:''}</div>
        <div class="val">${it.kg?`<b>${it.kg}<i style="font-style:normal;font-size:9px;color:var(--ink2)"> kg</i></b>`
          :`<b style="font-size:12.5px;font-family:-apple-system,'PingFang SC',sans-serif">徒手</b>`}
          <span>${it.sets} 组 × ${it.reps}</span></div>
      </div>`).join('')}</div>`;
  }
  if(j) html+=`<div class="sh2" style="margin-top:14px">训练手记${(j.图表&&j.图表.日期)?' · '+j.图表.日期.length+' 天数据对比':''}</div>${jBlock(j)}`;
  openSheet(html);
}

/* ── sheet / toast ── */
function openSheet(h){document.getElementById('sheetBody').innerHTML=h;
  document.getElementById('mask').classList.add('on');document.getElementById('sheet').classList.add('on');}
function closeSheet(){document.getElementById('mask').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');}
/* 器械照片相关逻辑已整体移除（2026-10-21）*/
/* 弹层下滑关闭：只认顶部那根小横条，避免和弹层内部上下滚动打架。
   下拉跟手（关掉 transition），松手超过 70px 就关。 */
(function(){
  const sh=document.getElementById('sheet');
  if(!sh) return;
  let y0=null, dy=0;
  sh.addEventListener('touchstart',e=>{
    if(!e.target.closest('.grab')) return;
    y0=e.touches[0].clientY; dy=0; sh.style.transition='none';
  },{passive:true});
  sh.addEventListener('touchmove',e=>{
    if(y0===null) return;
    dy=Math.max(0,e.touches[0].clientY-y0);
    sh.style.transform='translateY('+dy+'px)';
  },{passive:true});
  sh.addEventListener('touchend',()=>{
    if(y0===null) return;
    sh.style.transition=''; sh.style.transform='';
    const close=dy>70; y0=null;
    if(close) closeSheet();
  },{passive:true});
})();

function toast(t){
  const el=document.createElement('div');
  el.style.cssText='position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:200;'+
    'background:var(--ink);color:var(--bg);font-size:12px;padding:9px 15px;border-radius:10px;'+
    'box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:80%;line-height:1.5;opacity:0;transition:opacity .2s';
  el.textContent=t;document.body.appendChild(el);
  requestAnimationFrame(()=>el.style.opacity='1');
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),250)},2200);
}

/* ── 路由 ──
   历史策略（阿成 2026-10-03 要求「一划就回首页，别一级一级退」）：
     · 首页 → 子页 ：pushState，压一条
     · 子页 → 子页 ：replaceState，替换
     · 任何 → 首页 ：replaceState，把中间站全部顶掉
   这样不管在站里点了多少层，从屏幕左侧往右滑（系统的返回手势）
   都一步落到首页，而不是一层层往回退。 */
const V={'#/':viewHome,'#/overview':viewOvr,'#/calendar':viewCal,'#/records':viewRec,
  '#/analyze':viewAnalyze,'#/train':viewTrain,'#/route':viewRoute,'#/body':viewBody,'#/advice':viewAdvice};
/* 路由 → 底部哪个 tab 亮（阿成要求：底栏永远只有四个） */
const TABOF={'#/':'#/','#/records':'#/records','#/calendar':'#/records',
  '#/analyze':'#/analyze','#/train':'#/analyze','#/route':'#/analyze','#/overview':'#/analyze',
  '#/advice':'#/advice','#/body':'#/advice'};
let CUR=location.hash||'#/';

/* 每个路由记住自己的滚动位置：切回某个 tab 会回到刚才看到的地方（原生 App 的手感）。
   同路由重绘（翻月、切分段）保持当前视野，绝不跳回顶部。 */
const SCROLLPOS={};
let LASTPAINT='';

function paint(){
  ST.pick=ST.pick||{}; ST.focus=ST.focus===undefined?null:ST.focus; ST.aseg=ST.aseg||'run';
  const h=location.hash||'#/';
  if(h!=='#/calendar') ST.caly=0;   // 离开日历页就退出年视图，回来默认显示月历
  const app=document.getElementById('app');
  const keepY=window.scrollY, samePage=(LASTPAINT===h);
  app.innerHTML=(V[h]||viewHome)();
  app.style.animation='none'; void app.offsetWidth; app.style.animation='';
  const tabOf=TABOF[h]||'#/';
  document.querySelectorAll('#tab a').forEach(a=>{
    const on=a.dataset.r===tabOf;
    a.classList.toggle('on',on);
    a.setAttribute('aria-current',on?'page':'false');
  });
  if(h==='#/overview'){renderMix();renderPace();renderJ();}
  window.scrollTo(0, samePage?keepY:(SCROLLPOS[h]||0));
  LASTPAINT=h;
  syncTh();
  rtPreload();   /* 空闲时预取轨迹数据，点「路线轨迹」就不用等下载 */
}
/* 重渲染（hash 没变也要重画时用，比如日历翻月） */
function route(){CUR=location.hash||'#/';paint()}
/* 首页两种模式：图表优先 / 数字优先。切换时重画整页，
   但要记住滚动位置 —— 否则用户滑到一半点一下就跳回顶部。 */
function setHMode(m){
  if(ST.hmode===m) return;
  const y=window.scrollY;
  ST.hmode=m; route();
  window.scrollTo(0,y);
}

function navigate(t){
  if(t===CUR){
    /* 再点一次当前 tab = 回到顶部（iOS 的惯例手势），比逼他一路往上滑强。
       平滑滚动在部分环境下不启动（无头/省电模式），1 秒后兜底硬跳。 */
    if(window.scrollY>0){
      window.scrollTo({top:0,behavior:'smooth'});
      setTimeout(()=>{ if(window.scrollY>2) window.scrollTo(0,0) },1000);
    }
    return;
  }
  SCROLLPOS[CUR]=window.scrollY;
  try{
    if(t==='#/') history.replaceState(null,'',t);
    else if(CUR==='#/') history.pushState(null,'',t);
    else history.replaceState(null,'',t);
  }catch(e){ location.hash=t; return; }   // 极老浏览器兜底
  CUR=t; paint();
}
function goHome(){ if(CUR!=='#/') navigate('#/') }

/* 站内所有 <a href="#/…"> 交给 navigate 处理（内联 onclick 仍会照常跑） */
document.addEventListener('click',e=>{
  const a=e.target.closest&&e.target.closest('a[href^="#/"]');
  if(!a) return;
  e.preventDefault();
  navigate(a.getAttribute('href'));
},true);

/* 往右滑 = 返回上一级。顺序：轨迹详情层 → 明细弹层 → 首页。
   ⚠️ 2026-10-21 重写（阿成反馈"轨迹出来以后左滑右滑回不去"）：
   1) 旧版只认「28px 以内起手」，可 iOS Safari 那二十来像素会被系统的侧滑返回抢走，
      我们根本收不到 pointer 事件 → 手指按在边缘滑，页面上什么都不发生。
      现在起手范围放宽到屏幕左侧 46%，触发位移 60px。
   2) 旧版只调 goHome()，**没关 #rtView 浮层** —— 底层页面换了、浮层还盖在上面，
      看起来就是"滑了没反应"。现在先关浮层（这才是"上一页"），关完才回首页。
   3) 轨迹图/横滑筛选条自己要用横向拖动，起手落在这些元素上直接放行。 */
let _sg=null;
function noSwipe(el){
  if(!el||!el.closest) return false;
  /* 图（轨迹图/海拔剖面/心率曲线/迷你图）自己要用横向拖动 ——
     ⚠️ 2026-10-21：在海拔图上左右拖，会把浮层当成"右滑返回"关掉，阿成录屏里就踩到了。
     所有 svg 一律不参与返回手势。 */
  if(el.closest('svg')) return true;
  if(el.closest('[data-noswipe]')) return true;
  if(el.closest('.rtmap,.ychips,.segbar,.rflt')) return true;
  for(let n=el;n&&n!==document.body;n=n.parentElement){
    const cs=getComputedStyle(n);
    if((cs.overflowX==='auto'||cs.overflowX==='scroll')&&n.scrollWidth>n.clientWidth+6) return true;
  }
  return false;
}
function backOne(){
  const v=document.getElementById('rtView');
  if(v&&v.classList.contains('on')){closeRoute();return true}
  const sh=document.getElementById('sheet');
  if(sh&&sh.classList.contains('on')){closeSheet();return true}
  if(CUR&&CUR!=='#/'){navigate('#/');return true}
  return false;
}
document.addEventListener('pointerdown',e=>{
  _sg=null;
  if(e.pointerType==='mouse') return;
  if(e.clientX>innerWidth*.46) return;
  if(noSwipe(e.target)) return;
  _sg={x:e.clientX,y:e.clientY,ok:true};
},{passive:true});
document.addEventListener('pointermove',e=>{
  if(!_sg||!_sg.ok) return;
  const dx=e.clientX-_sg.x, dy=e.clientY-_sg.y;
  if(dx<-12){_sg.ok=false;return}                                   // 往左滑，不管
  if(Math.abs(dy)>14&&Math.abs(dy)>Math.abs(dx)){_sg.ok=false;return} // 竖着滚动，放行
  if(dx>60&&Math.abs(dy)<Math.abs(dx)*.8){_sg.ok=false;backOne()}
},{passive:true});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{_sg=null},{passive:true}));

function setTh(m){THMODE=m;localStorage.setItem('thm',m);syncTh()}   // 'auto' | 'l' | 'd'

/* 页头收缩：滚过 70px 加 body.scrolled（回去 30px 以内就撤掉）。
   只在跨阈值那一刻改类，滚动过程中不做 DOM 写入。 */
(function(){
  let on=false;
  const upd=()=>{
    const y=window.scrollY||document.documentElement.scrollTop||0;
    if(!on&&y>70){on=true;document.body.classList.add('scrolled')}
    else if(on&&y<30){on=false;document.body.classList.remove('scrolled')}
  };
  addEventListener('scroll',upd,{passive:true});
  addEventListener('resize',upd,{passive:true});
})();

function syncTh(){
  ST.theme=wantDark();            // 每次都从 THMODE 重算 —— 别只更新 auto 分支，否则点浅色没反应
  document.body.classList.toggle('dk',ST.theme);
  document.querySelectorAll('.sw button').forEach(b=>{
    b.classList.toggle('on',b.dataset.m===THMODE);
    b.setAttribute('aria-pressed',b.dataset.m===THMODE?'true':'false');
  });
}
/* 手机系统切换深/浅色时，只有「自动」模式跟着换；手动选过的不动。
   除了 change 事件，回到前台/从缓存恢复时也补一次同步 ——
   iOS 在后台切主题时不一定会派发 change，光靠它会有"没及时跟上"。 */
MQ.addEventListener('change',syncTh);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncTh()});
window.addEventListener('pageshow',syncTh);
window.addEventListener('focus',syncTh);
window.addEventListener('popstate',()=>{CUR=location.hash||'#/';paint()});
window.addEventListener('hashchange',()=>{CUR=location.hash||'#/';paint()});

/* data.json 加 cache-bust：GitHub Pages 会给它 10 分钟缓存，不破一下的话
   手机刷新看到的还是旧数据（他反馈过"改了没生效"）。文件才 120KB 级，不值一提。 */
fetch('data.json?v='+Date.now()).then(r=>r.json()).then(d=>{
  if(d.v && d.v!==APPV && !upgrading(d.v)) return;   // 页面旧、数据新 → 自动刷一次新版
  Object.assign(D,d);route();
})
  .catch(e=>{document.getElementById('app').innerHTML='<div class="empty-tip">数据加载失败：'+e+'</div>'});

/* 检测到线上有新版本：提示后换 URL 重载（带 cb 参数绕开 Safari 的文档缓存）。
   用 sessionStorage 兜底，避免万一拉不到新版时反复重载。 */
function upgrading(v){
  let done=false;
  try{ done = sessionStorage.getItem('up_'+v)==='1'; sessionStorage.setItem('up_'+v,'1'); }catch(e){}
  if(done) return false;
  try{ toast('已更新到新版，正在刷新…'); }catch(e){}
  setTimeout(()=>{location.replace(location.href.split('?')[0].split('#')[0]+'?cb='+Date.now());},900);
  return true;
}
</script>
</body>
