.dest{margin-top:20px;display:grid;gap:9px;text-align:left}
.dest a{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:14px;

  box-shadow:0 1px 2px rgba(16,72,48,.05);
  transition:transform .22s cubic-bezier(.32,.72,0,1),background .22s,box-shadow .22s;
  -webkit-tap-highlight-color:transparent}
/* 「按下去」＝三件事同时发生：整块**下沉** 2px、**收小**一点、外投影收没且底色压深。
   苹果那种物理按键感就是这么来的 —— 只做 scale 会像"缩小"，只有把投影一起收掉才像"陷进去"。
   按下走 .08s（必须跟手，慢了就觉得没反应），松手回弹用 .22s 的 iOS 曲线（起步快、收尾长）。
   ⚠️ 只动 transform / background / box-shadow。千万别碰 padding / margin / height ——
      那会把上下两张卡片一起顶动，手感立刻变廉价。
   ⚠️ `.press` 与 `:active` 写在一起：:active 兜底（键盘/鼠标/禁 JS），
      .press 才是主路径（由 COVER_JS 的 pointerdown 驱动，iOS 上可靠）。 */
.dest a:active,.dest a.press{transform:translateY(2px) scale(.972);background:#E6F4ED;
  box-shadow:0 0 0 rgba(16,72,48,0);transition-duration:.08s}
.dest .di{flex:none;width:34px;height:34px;border-radius:11px;background:#E4F7ED;

/* ---- 底部毛玻璃 Tab Bar（iOS 风）：四个板块直达 ---- */
/* iOS 26「液态玻璃」Dock（与报告页同一套观感） */
.tabbar{position:fixed;left:11px;right:11px;z-index:60;
  bottom:calc(10px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:7px 6px 6px;border-radius:31px;
  /* ⚠️ 这里**不能**加 overflow:hidden —— Safari 上祖先 overflow:hidden 会让
     子元素(.gsl)的 backdrop-filter 静默失效（玻璃就退化成一块死白）。 */
  background:linear-gradient(180deg,rgba(255,255,255,.54),rgba(255,255,255,.34));
  -webkit-backdrop-filter:blur(30px) saturate(210%) brightness(1.07);
  backdrop-filter:blur(30px) saturate(210%) brightness(1.07);
  /* ⚠️⚠️⚠️ 常见的三种"横线"来源这里一个都没有：border / height:1px 亮线 /
     「伪元素＋inset＋filter」组合（后者在 iOS 上还会渲染出**品红色杂线**）。
     详见报告页 .tabbar 那段长注释（本段必须与它保持一致）。 */
  box-shadow:0 14px 40px rgba(14,40,28,.2),0 2px 6px rgba(14,40,28,.07)}
.tabbar a{position:relative;z-index:1;color:var(--ac);opacity:.62;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;padding:0;border-radius:18px;text-decoration:none;
  font-size:11px;font-weight:700;letter-spacing:.2px;
  -webkit-tap-highlight-color:transparent;
  transition:transform .12s,opacity .16s}
.tabbar a.live{opacity:1}
/* 文字跟着图标一起"点亮"：未选中是中性灰，滑块停到哪格，哪格的文字才是自己的主色。
   这样"选中"这件事同时由三处表达——实心图标 + 全彩 + 文字变色，一眼就能看出在哪格。 */
.tabbar a span{color:#5C5668;transition:color .18s ease}
.tabbar a.live span{color:var(--ac)}
/* 手势：**点按走原生 `<a>`**（立刻跳），脚本只接管横向拖动（详见 COVER_JS 注释）。
   pan-y ＝ 竖直手势仍归页面滚动。 */
.tabbar{touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:grab;
  -webkit-touch-callout:none}
.tabbar.dragging{cursor:grabbing}
.tabbar a:active{transform:scale(.9)}
.tgl{display:flex;align-items:center;justify-content:center;
  width:54px;height:36px;border-radius:18px;
  /* 透镜：--lens 由脚本按"离滑块多远"写（见报告页同段注释） */
  transform:scale(calc(1 + var(--lens,0)*.34)) translateY(calc(var(--lens,0)*-1.6px));
  transition:transform .34s cubic-bezier(.32,.72,0,1)}
/* ⚠️ 原来这里有一串 filter + drop-shadow(红/蓝) 做"棱镜色散"，iOS 上会渲染出
   **品红色杂线**，已整体删除（详见报告页同段注释）。 */
.tabbar svg{width:32px;height:32px;display:block;fill:none;stroke:currentColor;
  stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}
/* 选中态空心 ⇄ 实心：每个 svg 里叠了 .ol（线性/空心）与 .fi（实心）两套形状，
   只切 opacity。未选中＝空心，落在滑块下那格＝实心。详见报告页同段注释。 */
.tabbar svg .fi,.tabbar svg .fi *{fill:currentColor;stroke:none}
.tabbar svg .fi{opacity:0}
.tabbar svg .ol,.tabbar svg .fi{transition:opacity .18s ease}
.tabbar.dragging svg .ol,.tabbar.dragging svg .fi{transition:none}
.tabbar a.live svg .ol{opacity:0}
.tabbar a.live svg .fi{opacity:1}
.gsl{position:absolute;top:4px;bottom:3px;z-index:0;pointer-events:none;
  left:calc(6px - (100% - 12px)/4 * 0.07);
  width:calc((100% - 12px)/4 * 1.14);
  border-radius:30px;
  /* 两层普通渐变（径向峰值落在胶囊内部 26% 处）＝ 玻璃"中间薄、边缘厚"，不会烧出上沿亮线 */
  background:
    radial-gradient(120% 150% at 50% 26%,rgba(255,255,255,.30),rgba(255,255,255,0) 72%),
    linear-gradient(180deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,.19) 46%,
      rgba(255,255,255,.24) 100%);
  /* ⚠️ 和报告页一样：**不要 backdrop-filter**。移动的元素带 backdrop-filter 时，
     浏览器每帧都要重新取景身后的内容再糊一遍 —— 这是拖动卡顿的主因，而拿掉它
     逐像素比对几乎看不出差别（详见报告页同段注释）。 */
  /* ⚠️ 无 inset、无伪元素（原因同报告页：inset 会留亮线，伪元素+filter 会出杂色线） */
  box-shadow:0 5px 16px rgba(18,45,32,.14),0 1px 3px rgba(18,45,32,.08);
  /* --i 由封面脚本写（拖动时是小数）；缓动与报告页一致（iOS 曲线，不过冲） */
  transform:translateX(calc(var(--i,0) * 100% / 1.14)) translateZ(0);
  transition:transform .42s cubic-bezier(.32,.72,0,1)}
.tabbar.dragging .gsl{will-change:transform}

/* 滑块：封面没有 radio，位置由封面脚本写（拖动跟手 / 松手吸附后跳页） */

<script>
(function(){
 /* ---- 三张次级卡片的"按下去" ----
    ⚠️ 光靠 CSS `:active` 不行：iOS 在可滚动页面里会把 :active 押后到手势判定之后，
    甚至干脆不发，快速点按时几乎看不到"陷下去"。所以这里的做法和 Dock 一样——
    **状态由指针事件驱动**：pointerdown 立刻加 .press（下沉 2px + 收小 3% + 投影收没），
    pointerup / pointercancel / pointerleave 任一到达就撤掉。
    ⚠️ pointercancel 必须一起监听：iOS 一旦把这次触摸判成滚动就只发 cancel、不发 up
    （这个坑在 Dock 上踩过，见下面那段长注释），漏了它卡片会永远停在"按着"的状态。
    只加/删一个 class、不 preventDefault，所以点按跳转仍然是原生 <a> 的 click。 */
 var ds=document.querySelectorAll('.dest a');
 for(var di=0;di<ds.length;di++){
   ds[di].addEventListener('pointerdown',function(e){e.currentTarget.classList.add('press');});
   ds[di].addEventListener('pointerup',function(e){e.currentTarget.classList.remove('press');});
   ds[di].addEventListener('pointercancel',function(e){e.currentTarget.classList.remove('press');});
   ds[di].addEventListener('pointerleave',function(e){e.currentTarget.classList.remove('press');});
 }
 var bar=document.querySelector('.tabbar');if(!bar)return;
 var gsl=bar.querySelector('.gsl'),as=bar.querySelectorAll('a.tga');
 var N=as.length;if(!N)return;
 /* 首格（总览）标成"当前"：封面本身不属于任何板块，但滑块停在第一格，
    灯得跟着亮，否则滑块底下是灰的、看着像坏掉。 */
 as[0].classList.add('live');

 var lastLens=[-1,-1,-1,-1],lastN=-1,raf=0,leaving=false;
 var down=false,dragging=false,sx=0,sy=0,lx=0,rect=null,suppress=false;

 function paint(){
   raf=0;if(!rect)return;
   var v=(lx-rect.left)/rect.width*N-0.5;
   if(v<0)v=0;if(v>N-1)v=N-1;
   if(gsl)gsl.style.setProperty('--i',v);
   var n=Math.round(v);
   for(var j=0;j<N;j++){
     var d=Math.abs(j-v),f=d>=1?0:Math.pow(1-d,0.75);
     if(Math.abs(f-lastLens[j])>.008){as[j].style.setProperty('--lens',f.toFixed(3));lastLens[j]=f;}
   }
   if(n!==lastN){
     if(as[lastN])as[lastN].classList.remove('live');
     as[n].classList.add('live');lastN=n;
   }
 }
 function queue(){if(!raf)raf=requestAnimationFrame(paint);}

 /* 松手：先让滑块滑到那格（撤掉行内 --i，交回 :root 的默认 0——封面没有 :checked，
     所以这里直接把 --i 写成整数），**等它滑完**再跳，否则页面瞬间切走、动画看不见。 */
 function leave(n){
   if(leaving)return;leaving=true;
   if(gsl){gsl.style.transition='';gsl.style.setProperty('--i',n);}
   for(var j=0;j<N;j++)as[j].style.removeProperty('--lens');
   var a=as[n];if(!a)return;
   setTimeout(function(){location.href=a.getAttribute('href');},190);
 }

 bar.addEventListener('click',function(e){
   if(!suppress)return;               /* 点按：原生跳转，不拦 */
   suppress=false;e.preventDefault();e.stopPropagation();
 },true);

 bar.addEventListener('pointerdown',function(e){
   if(e.button&&e.button!==0)return;
   down=true;dragging=false;suppress=false;
   sx=lx=e.clientX;sy=e.clientY;rect=null;
 },false);

 bar.addEventListener('pointermove',function(e){
   if(!down)return;
   lx=e.clientX;
   var ax=Math.abs(e.clientX-sx),ay=Math.abs(e.clientY-sy);
   if(!dragging){
     if(ax<8||ax<ay*1.2)return;
     dragging=true;rect=bar.getBoundingClientRect();
     if(gsl)gsl.style.transition='none';
     bar.classList.add('dragging');
     if(bar.setPointerCapture){try{bar.setPointerCapture(e.pointerId);}catch(err){}}
   }
   e.preventDefault();
   queue();
 },false);

 function near(){
   if(!rect)return 0;
   var v=(lx-rect.left)/rect.width*N-0.5;
   v=v<0?0:(v>N-1?N-1:v);
   return Math.round(v);
 }
 bar.addEventListener('pointerup',function(e){
   if(!down)return;down=false;
   if(!dragging)return;
   suppress=true;lx=e.clientX;bar.classList.remove('dragging');lastN=-1;leave(near());
 },false);
 bar.addEventListener('pointercancel',function(){
   if(!down)return;down=false;
   if(!dragging)return;
   suppress=true;bar.classList.remove('dragging');lastN=-1;leave(near());
 },false);
})();
</script>
