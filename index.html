*{box-sizing:border-box;margin:0;padding:0}

/* 底部装饰光：让 Dock 的 backdrop-filter **有东西可以模糊**。
   封面背景原本是纯色渐变，玻璃后面什么都没有 → 看起来就是一块死白，
   所以"折射感"根本出不来。加一条斜光带 + 两个光斑就有了。 */
html:before{content:'';position:fixed;z-index:0;pointer-events:none;
  left:-30%;right:-30%;bottom:6%;height:190px;transform:rotate(-7deg);
  background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.20) 28%,
    rgba(255,255,255,.36) 50%,rgba(255,255,255,.16) 72%,rgba(255,255,255,0) 100%)}
body:before{content:'';position:fixed;z-index:0;pointer-events:none;
  left:-64px;bottom:26px;width:250px;height:250px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 68%)}
body:after{content:'';position:fixed;z-index:0;pointer-events:none;
  right:-76px;bottom:96px;width:270px;height:270px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.42) 0%,rgba(255,255,255,0) 68%)}
.cover{width:100%;max-width:380px;background:#fff;border-radius:26px;padding:30px 24px 24px;
  position:relative;z-index:1;
  box-shadow:0 24px 60px rgba(0,90,50,.28);text-align:center}
.badge{display:inline-block;font-size:11.5px;letter-spacing:.5px;color:#00A85E;
  background:#E9F9F1;padding:5px 14px;border-radius:20px;margin-bottom:16px;font-weight:600}
.emoji{font-size:48px;line-height:1;margin-bottom:10px}
.cover h1{font-size:25px;font-weight:800;letter-spacing:1px;color:#241F2E}
.sub{margin-top:9px;font-size:13px;color:#6B6577;line-height:1.7}
.kpis{display:flex;gap:10px;margin:22px 0 4px}
.k{flex:1;background:#F1FBF6;border-radius:14px;padding:13px 4px}
.k b{display:block;font-size:20px;font-weight:800;color:#00A85E}
.k span{font-size:10.5px;color:#6B6577;margin-top:4px;display:block}
/* 三个次级入口：做成可点的卡片（原来是三个挤在一起的小字链接） */
.dest{margin-top:20px;display:grid;gap:9px;text-align:left}
.dest a{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:14px;
  background:#F7FBF9;border:1px solid #E8F4EE;text-decoration:none;color:#241F2E;

.dest a:active{transform:scale(.985);background:#EFF8F3}
.dest .di{flex:none;width:34px;height:34px;border-radius:11px;background:#E4F7ED;

.dest .dar{margin-left:auto;color:#C6C2CE;font-size:17px;flex:none}
/* ---- 底部毛玻璃 Tab Bar（iOS 风）：四个板块直达 ---- */
/* iOS 26「液态玻璃」Dock（与报告页同一套观感） */
.tabbar{position:fixed;left:11px;right:11px;z-index:60;
  bottom:calc(10px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:7px 6px 6px;border-radius:31px;
  /* ⚠️ 这里**不能**加 overflow:hidden —— Safari 上祖先 overflow:hidden 会让
     子元素(.gsl)的 backdrop-filter 静默失效（玻璃就退化成一块死白）。
     圆角交给各伪元素自带的 border-radius:inherit 去裁。 */
  background:linear-gradient(180deg,rgba(255,255,255,.56),rgba(255,255,255,.36));
  -webkit-backdrop-filter:blur(30px) saturate(210%) brightness(1.07);
  backdrop-filter:blur(30px) saturate(210%) brightness(1.07);
  border:.5px solid rgba(255,255,255,.55);
  box-shadow:
    inset 0 3px 9px -5px rgba(255,255,255,.62),
    inset 0 -3px 9px -5px rgba(255,255,255,.26),
    inset 3px 0 9px -5px rgba(255,255,255,.4),
    inset -3px 0 9px -5px rgba(255,255,255,.4),
    0 14px 40px rgba(14,40,28,.20),
    0 2px 6px rgba(14,40,28,.07)}
.tabbar:before{content:'';position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;
  /* 同上：这里原来是 163deg 斜角反光，也会显出斜线，改成纯垂直 */
  background:linear-gradient(180deg,rgba(255,255,255,.3) 0%,rgba(255,255,255,.09) 26%,
    rgba(255,255,255,0) 52%,rgba(255,255,255,.10) 100%)}
.tabbar:after{content:'';position:absolute;left:16px;right:16px;bottom:1.5px;height:1px;
  border-radius:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent)}
.tabbar a{position:relative;z-index:1;color:var(--ac);opacity:.62;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;padding:0;border-radius:18px;text-decoration:none;
  font-size:11px;font-weight:700;letter-spacing:.2px;
  -webkit-tap-highlight-color:transparent;
  transition:transform .12s,opacity .16s}
.tabbar a.live{opacity:1}
.tabbar a span{color:#5C5668}
/* 拖拽层：透明原生 range 铺满 Dock（同报告页）。默认 display:none，由脚本打开 */
.tsl{position:absolute;inset:0;z-index:3;width:100%;height:100%;
  margin:0;padding:0;display:none;opacity:0;cursor:grab;
  -webkit-appearance:none;appearance:none;background:transparent;
  touch-action:pan-y}
.tsl:active{cursor:grabbing}
.tsl::-webkit-slider-runnable-track{height:100%;background:transparent;border:0}
.tsl::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:25%;height:100%;background:transparent;border:0}
.tsl::-moz-range-track{height:100%;background:transparent;border:0}
.tsl::-moz-range-thumb{width:25%;height:100%;background:transparent;border:0}
.tabbar a:active{transform:scale(.9)}
.tgl{display:flex;align-items:center;justify-content:center;
  width:54px;height:36px;border-radius:18px;
  /* 透镜：--lens 由脚本按"离滑块多远"写（见报告页同段注释） */
  transform:scale(calc(1 + var(--lens,0)*.34)) translateY(calc(var(--lens,0)*-1.6px));
  transition:filter .26s,transform .26s cubic-bezier(.34,1.35,.5,1)}
/* 折射感（红/蓝重影＝棱镜色散）**只在拖动中出现**，静止时不加（否则图标发紫发脏） */
.tabbar.dragging .tgl{
  filter:blur(calc(var(--lens,0)*.32px))
         drop-shadow(calc(var(--lens,0)*1.15px) 0 calc(var(--lens,0)*.5px) rgba(255,72,132,.55))
         drop-shadow(calc(var(--lens,0)*-1.15px) 0 calc(var(--lens,0)*.5px) rgba(46,150,255,.55))
         brightness(calc(1 + var(--lens,0)*.22))
         saturate(calc(1 + var(--lens,0)*.55));
  transition:filter 0s,transform 0s}
.tabbar svg{width:32px;height:32px;display:block;fill:none;stroke:currentColor;
  stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}
.gsl{position:absolute;top:4px;bottom:3px;z-index:0;pointer-events:none;
  left:calc(6px - (100% - 12px)/4 * 0.07);
  width:calc((100% - 12px)/4 * 1.14);
  border-radius:30px;
  /* 中心几乎全透、边缘略白 ＝ 玻璃"中间薄、边缘厚"（详见报告页同段注释） */
  background:radial-gradient(132% 122% at 50% 44%,
    rgba(255,255,255,.02) 38%,rgba(255,255,255,.24) 100%);
  -webkit-backdrop-filter:blur(3px) saturate(190%) brightness(1.06);
  backdrop-filter:blur(3px) saturate(190%) brightness(1.06);
  /* ⚠️ inset 高光**必须带模糊半径**：`inset 0 1px 0 rgba(...)` 的 blur=0，
     渲染出来就是一条 1px 硬线（"有横线"就是这么来的，被反馈过两次）。
     要柔光就用「正 blur + 负 spread」，让它是一团光而不是一条线。 */
  box-shadow:
    inset 0 5px 12px -6px rgba(255,255,255,.9),
    inset 0 -4px 10px -6px rgba(255,255,255,.42),
    inset 0 0 0 .5px rgba(255,255,255,.12),
    0 4px 14px rgba(18,45,32,.15),
    0 1px 3px rgba(18,45,32,.08);
  /* --i 由封面脚本写（拖动时是小数） */
  transform:translateX(calc(var(--i,0) * 100% / 1.14));
  transition:transform .36s cubic-bezier(.3,1.32,.45,1)}
.gsl:before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(118% 82% at 50% -10%,
    rgba(255,255,255,.5),rgba(255,255,255,0) 62%)}
.gsl:after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  padding:1.5px;
  /* ⚠️ **绝不能用斜角渐变**（160deg 之类）：mask 把它裁成 1.5px 边框后，
     斜渐变的等值线会在左右两条边框上斜着切过去 —— 看起来就是"一条斜线"（被反馈过两次）。
     要"上亮下暗"用**纯垂直**(180deg，等值线水平 → 左右边框同色)；
     要"一圈厚度"用**径向**（左右对称）。 */
  background:
    linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 64%),
    radial-gradient(128% 118% at 50% 50%,
      rgba(255,255,255,0) 58%,rgba(255,255,255,.42) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}

/* 滑块：封面没有 radio，位移由封面脚本在点击时写 transform（先滑、再跳） */
.foot{margin-top:18px;font-size:10.5px;color:#9E99A8;line-height:1.6}

<script>
(function(){
 var bar=document.querySelector('.tabbar');if(!bar)return;
 var gsl=bar.querySelector('.gsl'),as=bar.querySelectorAll('a.tga');
 var N=as.length;if(!N)return;
 var cur=0,leaving=false;
 function paint(v,snap){
   if(gsl){
     /* 拖动中必须关掉过渡，否则滑块会"追着"手指慢慢走，手感发飘 */
     gsl.style.transition=snap?'':'none';
     gsl.style.setProperty('--i',v);
   }
   var n=Math.round(v);
   for(var j=0;j<N;j++){
     /* 透镜：拖动中贴着滑块的图标被放大最多 34% */
     var d=Math.abs(j-v);
     var f=snap?(j===n?0.3:0):(d>=1?0:Math.pow(1-d,0.75));
     as[j].style.setProperty('--lens',f.toFixed(3));
     as[j].classList.toggle('live',j===n);
   }
 }
 function leave(i){
   if(leaving)return;leaving=true;
   var a=as[i];if(!a)return;
   setTimeout(function(){location.href=a.getAttribute('href');},260);
 }
 var s=document.createElement('input');
 s.type='range';s.min=0;s.max=N-1;s.step=0.001;s.value=0;
 s.className='tsl';s.setAttribute('aria-label','拖动或点按切换板块');
 bar.appendChild(s);s.style.display='block';
 s.addEventListener('input',function(){cur=parseFloat(s.value);
   bar.classList.add('dragging');paint(cur,false);});
 s.addEventListener('change',function(){
   var n=Math.round(parseFloat(s.value));s.value=n;
   bar.classList.remove('dragging');
   if(gsl)gsl.style.transition='';
   requestAnimationFrame(function(){paint(n,true);});
   leave(n);
 });
 for(var i=0;i<N;i++)(function(a,i){
   a.addEventListener('click',function(e){e.preventDefault();
     s.value=i;cur=i;paint(i,true);leave(i);});
 })(as[i],i);
 paint(0,true);
})();
</script>
